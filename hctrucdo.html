<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bài 11 – Hình chiếu trục đo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e9eff9; --card:#ffffff; --ink:#0f172a; --muted:#5b6b82; --line:#dbe3f0;
  --navy:#0b1d4a; --navy2:#1e3a8a; --gold:#fbbf24;
  --ax:#e11d48; --base:#2563eb; --feat:#ea580c; --dim:#d97706; --ok:#059669; --bad:#dc2626; --vio:#7c3aed;
  --r:18px; --hd:64px;
  --font:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5}
body{background:radial-gradient(1200px 600px at 85% -10%,#dbe7ff 0,transparent 60%),radial-gradient(900px 500px at -10% 110%,#fde7c7 0,transparent 55%),var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* ---- thanh trên ---- */
.hd{position:sticky;top:0;z-index:10;height:var(--hd);display:flex;align-items:center;gap:16px;padding:0 18px;color:#fff;
  background:linear-gradient(120deg,#0b1d4a 0%,#1e3a8a 55%,#2b4fc7 100%);box-shadow:0 8px 24px -12px rgba(11,29,74,.6);overflow:hidden}
.hd::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background-image:linear-gradient(rgba(255,255,255,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.08) 1px,transparent 1px);background-size:24px 24px}
.hd::after{content:"";position:absolute;width:260px;height:260px;right:120px;top:-170px;border-radius:50%;background:radial-gradient(circle,rgba(251,191,36,.45),transparent 70%);filter:blur(6px);animation:glow 6s ease-in-out infinite alternate;pointer-events:none}
@keyframes glow{to{transform:translateX(-260px)}}
.brand{position:relative;display:flex;align-items:center;gap:12px;min-width:0}
.logo{flex:none;width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:19px;color:#0b1d4a;
  background:linear-gradient(140deg,#fde68a,#fbbf24);box-shadow:0 0 0 3px rgba(255,255,255,.2),0 6px 16px -6px #fbbf24}
.brand b{display:block;font-size:18px;letter-spacing:-.2px}.brand small{display:block;font-size:12px;opacity:.78;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{position:relative;margin-left:auto;display:flex;gap:4px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);padding:4px;border-radius:14px}
.tabs button{border:0;background:transparent;color:#e2e8f0;font-weight:700;padding:8px 14px;border-radius:10px;white-space:nowrap}
.tabs button.on{background:#fff;color:var(--navy);box-shadow:0 4px 12px -4px rgba(0,0,0,.35)}
.fs{position:relative;flex:none;width:42px;height:42px;border-radius:12px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.12);color:#fff;font-size:20px}
.fs:hover{background:rgba(255,255,255,.22)}

/* ---- khung chính: vừa một màn hình ---- */
.main{height:calc(100vh - var(--hd));padding:14px;overflow:hidden}
.ve,.lt{height:100%;display:grid;grid-template-columns:200px minmax(280px,.8fr) minmax(440px,1.45fr);gap:14px}
.nho{height:100%;overflow:auto;display:flex;flex-direction:column;gap:14px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 1px 2px rgba(15,23,42,.05),0 12px 30px -18px rgba(30,58,138,.35);padding:14px;min-height:0;display:flex;flex-direction:column}
.ph{display:flex;align-items:center;gap:10px;margin-bottom:8px}.ph b{font-size:16px}
.chipmini{margin-left:auto;font-size:12px;font-weight:600;color:var(--muted);background:#f1f5fb;border:1px solid var(--line);padding:3px 9px;border-radius:999px;white-space:nowrap}

/* ---- danh sách vật thể ---- */
.side{min-height:0;min-width:0;overflow:auto;padding-right:2px}
.ve>*,.lt>*{min-width:0}
.side h3{margin:4px 4px 8px;font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
.side h3:not(:first-child){margin-top:16px}
.olist{display:flex;flex-direction:column;gap:6px}
.olist button{display:flex;align-items:center;gap:10px;text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:8px 10px;font-weight:600;font-size:13.5px;line-height:1.3;transition:.15s}
.olist button:hover{border-color:#93b4f5;transform:translateX(2px)}
.olist button .n{flex:none;width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:#eef3fd;color:var(--navy2);font-weight:800;font-size:13px}
.olist button small{display:block;font-weight:500;color:var(--muted);font-size:11.5px}
.olist button.on{border-color:var(--base);background:linear-gradient(120deg,#eff5ff,#fff);box-shadow:0 6px 16px -10px var(--base)}
.olist button.on .n{background:linear-gradient(140deg,#3b82f6,#1d4ed8);color:#fff}
.stars{color:#d97706!important;letter-spacing:1px}
.tip{font-size:13px;color:var(--muted);background:#fff7e6;border:1px dashed #f5c26b;border-radius:12px;padding:10px;margin-top:14px}

/* ---- bản vẽ ---- */
.drwbox{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;border-radius:14px;padding:8px;
  background-color:#fbfdff;background-image:linear-gradient(#eef4fd 1px,transparent 1px),linear-gradient(90deg,#eef4fd 1px,transparent 1px);background-size:16px 16px;border:1px solid #e3eaf6}
svg.drw{width:100%;height:100%;max-height:100%}
.axl{font:italic 800 21px Georgia,serif;fill:var(--ax)}
.axes{animation:fadeIn .6s ease}
.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{stroke-opacity:.45}}
@keyframes fadeIn{from{opacity:0}}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:12.5px;color:var(--muted)}
.lg{display:inline-block;width:24px;height:0;border-top:3px solid var(--ink);vertical-align:middle;margin-right:6px}
.lg.h{border-top:2px dashed var(--ink)}.lg.c{border-top:1.5px dashed #475569}.lg.a{border-top-color:var(--ax)}
.hint{font-size:13px;color:var(--muted);margin:8px 2px 0}
.gridtg{margin-left:auto;font-size:13px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:6px;cursor:pointer}
.gridtg input{width:17px;height:17px;accent-color:var(--base)}

/* ---- sân khấu vẽ ---- */
.stagehd{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.oname{margin-left:auto;font-weight:700;color:var(--navy2);font-size:14px}
.seg{display:flex;background:#eef2f9;border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:9px;font-weight:700;color:var(--muted);font-size:14px}
.seg button.on{background:linear-gradient(140deg,#7c3aed,#5b21b6);color:#fff;box-shadow:0 6px 14px -6px #7c3aed}
.steps{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-bottom:10px}
.steps button{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:4px;border:1.5px solid var(--line);background:#fff;border-radius:13px;padding:8px 4px;font-weight:700;font-size:12.5px;line-height:1.2;color:var(--muted);transition:.15s}
.steps button:hover{border-color:#93b4f5}
.steps .num{flex:none;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;background:#eef2f9;color:var(--muted)}
.steps button.done{color:var(--ink);border-color:#bfe3d3;background:#f2fbf7}
.steps button.done .num{background:var(--ok);color:#fff}
.steps button.on{color:#fff;border-color:transparent;background:linear-gradient(135deg,#f59e0b,#e11d48);box-shadow:0 10px 22px -10px #e11d48}
.steps button.on .num{background:#fff;color:#e11d48}
.cvbox{position:relative;flex:1;min-height:220px;border-radius:16px;overflow:hidden;border:1px solid #e3eaf6;
  background-color:#fff;background-image:linear-gradient(#f1f5fc 1px,transparent 1px),linear-gradient(90deg,#f1f5fc 1px,transparent 1px);background-size:22px 22px}
.cvbox canvas{position:absolute;inset:0;width:100%;height:100%}
.start{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--muted)}
.go{border:0;border-radius:999px;padding:14px 28px;font-size:18px;font-weight:800;color:#fff;background:linear-gradient(135deg,#f59e0b,#e11d48);box-shadow:0 14px 30px -12px #e11d48;animation:bob 2.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.explain{margin-top:10px;border-radius:14px;padding:11px 14px;background:#f6f8fd;border-left:6px solid #94a3b8;min-height:86px}
.explain.s1{border-color:var(--ax);background:#fff1f3}.explain.s2,.explain.s3{border-color:var(--base);background:#eff5ff}
.explain.s4{border-color:var(--dim);background:#fff8eb}.explain.s5{border-color:var(--feat);background:#fff3ea}.explain.s6{border-color:var(--ok);background:#ecfaf3}
.et{font-weight:800;font-size:16.5px;margin-bottom:3px}.ex{font-size:14.5px}
.cr{color:var(--ax)}.cb{color:var(--base)}.cd{color:var(--dim)}.cf{color:var(--feat)}
.note{display:block;margin-top:6px;padding:6px 10px;border-radius:10px;background:#f3e8ff;color:#5b21b6;font-size:13.5px}
.ctrl{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.ctrl .btn:last-child{margin-left:auto}
.btn{border:0;border-radius:12px;padding:10px 18px;font-weight:700;color:#fff;background:linear-gradient(140deg,#2563eb,#1e3a8a);box-shadow:0 8px 18px -10px #1e3a8a;min-height:44px}
.btn:hover{filter:brightness(1.08)}.btn:disabled{opacity:.4;cursor:not-allowed;filter:none}
.btn.ghost{background:#fff;color:var(--navy2);border:1.5px solid var(--line);box-shadow:none}

/* ---- ghi nhớ ---- */
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.cmpcv{width:100%;height:340px;border-radius:14px;background:#fbfdff;border:1px solid #e3eaf6}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:#f1f5fb;font-size:13px;color:var(--muted)}th:nth-child(2){color:#0f766e}th:nth-child(3){color:var(--vio)}
.six{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.six li{display:flex;gap:10px;background:#f8faff;border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.six .num{flex:none;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;background:linear-gradient(135deg,#f59e0b,#e11d48)}
.six p{margin:2px 0 0;font-size:13.5px;color:var(--muted)}

/* ---- luyện tập ---- */
.qstem{font-size:15.5px;margin-bottom:10px}
.optgrid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.opt{position:relative;border:2px solid var(--line);background:#fbfdff;border-radius:16px;padding:0;min-height:170px;overflow:hidden;transition:.15s}
.opt:hover:not([disabled]){border-color:var(--base);transform:translateY(-2px);box-shadow:0 12px 24px -16px var(--base)}
.opt canvas{position:absolute;inset:0;width:100%;height:100%}
.ol{position:absolute;z-index:1;top:8px;left:8px;width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:800;background:var(--navy2);color:#fff}
.opt.ok{border:3px solid var(--ok);background:#ecfdf5}.opt.bad{border:3px solid var(--bad);background:#fef2f2}
.fb{margin-top:10px;padding:10px 14px;border-radius:12px;font-size:14.5px}.fb.ok{background:#ecfdf5;color:#065f46}.fb.bad{background:#fef2f2;color:#991b1b}


.steps button.s3d .num{background:#ede9fe;color:#6d28d9}
.steps button.s3d.on{background:linear-gradient(135deg,#7c3aed,#2563eb);box-shadow:0 10px 22px -10px #7c3aed}
.steps button.s3d.on .num{background:#fff;color:#6d28d9}
.explain.s7{border-color:var(--vio);background:#f5f0ff}
.cvbox canvas.v3{touch-action:none;cursor:grab}
.cvbox canvas.half{width:50%}.cvbox canvas.half.r{left:50%;border-left:2px dashed #dbe3f0}
.v3tag{position:absolute;z-index:2;top:10px;left:10px;font-weight:800;font-size:14px;color:#fff;background:linear-gradient(140deg,#0f766e,#115e59);border-radius:10px;padding:5px 11px;pointer-events:none}
.v3tag.r{left:calc(50% + 10px);background:linear-gradient(140deg,#7c3aed,#5b21b6)}.v3tag small{display:block;font-size:11.5px;font-weight:600;opacity:.9}.cvbox canvas.v3:active{cursor:grabbing}
.v3bar{position:absolute;z-index:2;bottom:10px;right:10px;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px;max-width:calc(100% - 20px)}
.v3bar button{border:1.5px solid var(--line);background:rgba(255,255,255,.94);border-radius:10px;padding:6px 11px;font-weight:700;font-size:13px;color:var(--navy2);box-shadow:0 4px 12px -8px rgba(15,23,42,.4)}
.v3bar button.on{background:linear-gradient(140deg,#7c3aed,#5b21b6);color:#fff;border-color:transparent}
.v3hint{position:absolute;z-index:2;left:10px;bottom:10px;font-size:12.5px;font-weight:600;color:var(--muted);background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:999px;padding:4px 11px;pointer-events:none}
.v3leg{position:absolute;z-index:2;left:10px;bottom:46px;display:flex;flex-direction:column;gap:3px;font-size:12px;font-weight:600;background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:10px;padding:6px 9px;pointer-events:none}
.sw{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:6px;border:1px solid rgba(15,23,42,.25)}
/* ---- so sánh 3D ---- */
.ss{height:100%;display:grid;grid-template-columns:200px minmax(0,1fr);gap:14px}.ss>*{min-width:0}
.sscol{min-height:0;display:flex;flex-direction:column;gap:12px}
.sstool{flex-direction:row;align-items:center;flex-wrap:wrap;gap:8px 18px;padding:10px 14px}.sstool .gridtg{margin-left:0}.sstool b{font-size:15.5px;color:var(--navy2);margin-right:auto}
.cmp2{flex:1;min-height:240px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cv3{position:relative;flex:1;min-height:0;border-radius:14px;background:#fbfdff;border:1px solid #e3eaf6;overflow:hidden}
.cv3 canvas{position:absolute;inset:0;width:100%;height:100%}
.cv3 .v3hint{font-size:11.5px}
.sstab{flex:none;max-height:38%;overflow:auto;padding:4px 8px}
.sstab td:first-child{font-weight:600;white-space:nowrap}
.sstab td,.sstab th{padding:7px 10px;font-size:13.5px}
@media (max-width:1180px){.ss{grid-template-columns:190px 1fr}.cmp2{flex:none;height:420px}.sstab{max-height:none}}
@media (max-width:760px){.ss{grid-template-columns:1fr}.cmp2{grid-template-columns:1fr;height:auto}.cmp2 .panel{height:340px}.steps button.s3d{grid-column:span 3}.sstab td:first-child{white-space:normal}}
@media (max-height:800px) and (min-width:1181px){.steps button{padding:5px 3px;font-size:11.5px}.steps .num{width:24px;height:24px;font-size:12.5px}.explain{padding:8px 12px;min-height:0}.et{font-size:15px}.ex{font-size:13.5px}.note{font-size:12.5px;padding:4px 8px}.btn{min-height:38px;padding:7px 14px}.stagehd{margin-bottom:6px}.panel{padding:12px}}
/* ---- màn hình nhỏ ---- */
@media (max-width:1180px){.ve,.lt{grid-template-columns:190px 1fr}.ve .stage,.lt .stage{grid-column:1/-1}.main{height:auto;overflow:visible}.ve .pv,.lt .pv{height:440px}.cvbox{min-height:440px}.optgrid{min-height:220px}.steps .tt{font-size:11.5px}}
@media (max-width:760px){
  .hd{height:auto;flex-wrap:wrap;padding:10px 12px;gap:8px}.tabs{margin-left:0;order:3;width:100%}.tabs button{flex:1;padding:8px 6px;font-size:13px}.fs{margin-left:auto}
  .main{padding:10px}.ve,.lt{grid-template-columns:1fr}.side{overflow:visible}.olist{flex-direction:row;overflow-x:auto;padding-bottom:4px}.olist button{flex:none}.side h3:not(:first-child){margin-top:8px}
  .ve .pv,.lt .pv{height:360px}.steps{grid-template-columns:repeat(3,minmax(0,1fr))}.cvbox{min-height:360px}.cmp{grid-template-columns:1fr}.six{grid-template-columns:1fr}.optgrid{grid-template-columns:1fr}.opt{min-height:220px}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
const HC = (() => {
  const area = L => { let a = 0; L.forEach((p, i) => { const q = L[(i + 1) % L.length]; a += p[0] * q[1] - q[0] * p[1]; }); return a / 2; };
  const circ = (cx, cy, r, n = 28) => Array.from({ length: n }, (_, i) => { const t = i / n * Math.PI * 2; return [cx + r * Math.cos(t), cy + r * Math.sin(t), 1]; });
  const arcPts = (cx, cy, r, a0, a1, n) => Array.from({ length: n + 1 }, (_, i) => { const t = (a0 + (a1 - a0) * i / n) * Math.PI / 180; return [cx + r * Math.cos(t), cy + r * Math.sin(t), 1]; });
  const AX = { x: [1, 0, 0], y: [0, 1, 0], z: [0, 0, 1] };
  const to3 = (ax, p, q, c) => ax === 'z' ? [p, q, c] : ax === 'x' ? [c, p, q] : [q, c, p];
  const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]], cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  const norm = a => { const l = Math.hypot(...a) || 1; return a.map(v => v / l); };
  const orient = (L, ccw) => { if ((area(L) > 0) === ccw) return L; const n = L.length; return L.map((_, j) => { const v = L[n - 1 - j]; return [v[0], v[1], L[(n - 2 - j + n) % n][2] || 0]; }); };
  /** đùn đa giác (p,q) dọc trục ax từ c0 đến c1; mỗi điểm [p,q,s], s=1: cạnh tới điểm sau thuộc mặt cong */
  function extrude(ax, outer, holes, c0, c1, keep = 'tbsh') {
    const O = orient(outer.map(v => [v[0], v[1], v[2] || 0]), true), H = (holes || []).map(h => orient(h.map(v => [v[0], v[1], v[2] || 0]), false));
    const A = AX[ax], F = [];
    F.push({ pts: O.map(v => to3(ax, v[0], v[1], c1)), holes: H.map(h => h.map(v => to3(ax, v[0], v[1], c1))), n: A, t: 't' });
    F.push({ pts: O.map(v => to3(ax, v[0], v[1], c0)).reverse(), holes: H.map(h => h.map(v => to3(ax, v[0], v[1], c0)).reverse()), n: A.map(x => -x), t: 'b' });
    [O, ...H].forEach((L, li) => L.forEach((a, i) => {
      const b = L[(i + 1) % L.length], a0 = to3(ax, a[0], a[1], c0), b0 = to3(ax, b[0], b[1], c0);
      F.push({ pts: [a0, b0, to3(ax, b[0], b[1], c1), to3(ax, a[0], a[1], c1)], holes: [], n: norm(cross(sub(b0, a0), A)), smooth: !!a[2], t: li ? 'h' : 's' });
    }));
    return F.filter(f => keep.indexOf(f.t) >= 0 && (f.t === 't' || f.t === 'b' || c1 !== c0));
  }
  const xz = L => L.map(v => [v[1], v[0], v[2] || 0]);       // đùn theo y: đổi (x,z) → (z,x)
  const box = (x0, x1, y0, y1, z0, z1) => extrude('z', [[x0, y0], [x1, y0], [x1, y1], [x0, y1]], [], z0, z1);
  /** chuẩn bị cạnh: bỏ đường ghép giữa các mặt đồng phẳng liền nhau */
  function prep(faces) {
    const fx = v => (Math.abs(v) < 5e-4 ? 0 : v).toFixed(3);
    const key = (f, s = 1) => { const d = f.n[0] * f.pts[0][0] + f.n[1] * f.pts[0][1] + f.n[2] * f.pts[0][2]; return f.n.map(v => fx(v * s)).join(',') + '|' + fx(d * s); };
    faces.forEach(f => { f.k = key(f); f.ko = key(f, -1); f.loops = [f.pts, ...f.holes]; });

    const A = pr.P(a), B = pr.P(b), L = Math.hypot(B[0] - A[0], B[1] - A[1]) || 1; let nx = -(B[1] - A[1]) / L, ny = (B[0] - A[0]) / L;
    if (((A[0] + B[0]) / 2 - C[0]) * nx + ((A[1] + B[1]) / 2 - C[1]) * ny < 0) { nx = -nx; ny = -ny; }
    const off = 24 * dp, A2 = [A[0] + nx * off, A[1] + ny * off], B2 = [B[0] + nx * off, B[1] + ny * off];
    [A, B].forEach(E => line(ctx, [E[0] + nx * 5 * dp, E[1] + ny * 5 * dp], [E[0] + nx * (off + 6 * dp), E[1] + ny * (off + 6 * dp)], COL.dim, 1.2, null, 0.9, dp));
    line(ctx, A2, B2, COL.dim, 1.8, null, 1, dp);
    const an = Math.atan2(B2[1] - A2[1], B2[0] - A2[0]); arrowHead(ctx, B2, an, COL.dim, dp); arrowHead(ctx, A2, an + Math.PI, COL.dim, dp);
    pill(ctx, (A2[0] + B2[0]) / 2, (A2[1] + B2[1]) / 2, t, COL.dim, dp, '#fff', 12);
  });
}
function renderCmp(cv, o, type) {

const objOf = id => ALL.find(o => o.id === id);

function stepText(o, type, s) {
  const front = o.base === 'front', bn = front ? 'hình chiếu đứng' : 'hình chiếu bằng', pl = front ? 'X′O′Z′' : 'X′O′Y′', other = front ? 'O′Y′' : 'O′Z′';

    case 2: return ['Bước 2. Vẽ hình chiếu cơ sở', `Chọn <b class="cb">${bn}</b> làm cơ sở. Chỉ vẽ <b class="cb">đường bao quanh</b> của nó trên mặt phẳng <b>${pl}</b>, bắt đầu <b>từ gốc O′ đi ra</b>, các đoạn song song với trục nào thì vẽ song song với trục đo đó. ${undist ? '<span class="note">Hình chiếu trục đo xiên góc cân: mặt phẳng X′O′Z′ có góc 90° nên mặt này <b>không bị biến dạng</b> – vẽ đúng hình dạng và kích thước thật.</span>' : xi ? 'Theo phương O′Y′ phải nhân kích thước với q = 0,5.' : 'Kích thước theo các trục giữ nguyên (p = q = r = 1).'}`];

    case 4: return ['Bước 4. Đặt độ dài, nối các điểm', `Lấy kích thước tương ứng trên ${front ? 'hình chiếu bằng / hình chiếu cạnh' : 'hình chiếu đứng / hình chiếu cạnh'} (<b class="cd">${L}</b>${xi && front ? ` × 0,5 = <b class="cd">${L / 2}</b>` : ''}) và đặt lên từng đường song song – có đoạn dài, đoạn ngắn tuỳ từng phần của vật thể. Được các điểm <b class="cd">●</b>, nối chúng lại theo hình chiếu.`];

  }

      <tr><td><b>Đặc điểm</b></td><td>Ba mặt biến dạng như nhau; đường tròn trên mọi mặt đều thành elip</td><td>Mặt song song với X′O′Z′ (góc 90°) <b>không bị biến dạng</b>: đúng hình dạng, kích thước thật, đường tròn vẫn là đường tròn</td></tr>
      <tr><td><b>Giống nhau</b></td><td colspan="2">Cùng là hình biểu diễn ba chiều trên một mặt phẳng; cạnh song song trên vật thể vẫn song song trên hình chiếu trục đo; vẽ theo cùng 6 bước.</td></tr></tbody></table></div></div>
    <div class="panel"><div class="ph"><b>Quy trình 6 bước vẽ hình chiếu trục đo</b></div><ol class="six">${STEPS.map((t, i) => `<li><span class="num">${i + 1}</span><div><b>${t}</b><p>${['Đặt các trục Ox, Oy, Oz lên các hình chiếu vuông góc; vẽ hệ trục đo O′X′Y′Z′.', 'Chọn hình chiếu đứng (hoặc hình chiếu bằng), vẽ đường bao của nó từ gốc O′ đi ra.', 'Xác định các điểm tại chỗ gấp khúc, kẻ các đường song song với trục còn lại.', 'Đặt độ dài từng đoạn tương ứng lên các đường song song, nối các điểm lại.', 'Vẽ hình chiếu trục đo của phần rãnh, lỗ.', 'Kiểm tra, xoá nét dựng hình, tô đậm các cạnh thấy.'][i]}</p></div></li>`).join('')}</ol></div></section>`;
}
function bindNho() { const o = objOf(st.obj); setTimeout(() => { renderFinal($('#c1'), getF(o, 'full'), o, 'vgd', true); renderFinal($('#c2'), getF(o, 'full'), o, 'xien', true); }, 0); }

/* ---------- Trang 3: luyện tập ---------- */
function opts(o) {
  const key = '_op'; if (o[key]) return o[key];
  const L = [{ F: 'full', ok: true }];
  if (o.mir) L.push({ F: 'mir', why: 'Hình này bị lật ngược trái – phải so với bản vẽ.' });
  o.alts.forEach((a, i) => { if (L.length < 3) L.push({ F: 'alt' + i, why: a.why }); });
  const s = L.map(x => [Math.random(), x]).sort((a, b) => a[0] - b[0]).map(x => x[1]);
  return (o[key] = s);
}
function pageLt() {
  const o = PRACT[st.pi], a = st.ans[o.id + st.ptype], O = opts(o), stars = n => '★'.repeat(n) + '☆'.repeat(3 - n);
  const ch = a != null ? O[a] : null;
  return `<section class="lt">
    <aside class="side"><h3>5 bài tự luyện</h3><div class="olist">${PRACT.map((x, i) => { const d = ['vgd', 'xien'].filter(t => { const v = st.ans[x.id + t]; return v != null && opts(x)[v].ok; }).length;
      return `<button data-p="${i}" class="${i === st.pi ? 'on' : ''}"><span class="n">${i + 1}</span><span>${x.ten}<small class="stars">${stars(x.lv)}${d ? ' · ✔ ' + d + '/2' : ''}</small></span></button>`; }).join('')}</div>
      <p class="tip">💡 Em hãy vẽ ra giấy theo 6 bước trước, rồi mới chọn đáp án để tự kiểm tra.</p></aside>
    <div class="panel pv"><div class="ph"><b>Bài ${st.pi + 1}. ${o.ten}</b><label class="gridtg"><input type="checkbox" id="grid" ${st.grid ? 'checked' : ''}> Lưới 1 ô = 10 mm</label></div>
      <div class="drwbox">${drawingSvg(o, { grid: st.grid })}</div>
      <p class="hint">Kích thước bao: dài <b>${o.W * 10}</b> · rộng <b>${o.D * 10}</b> · cao <b>${o.H * 10}</b> (mm)</p></div>
    <div class="panel stage"><div class="stagehd">${typeSeg('ptype', st.ptype)}</div>
      <div class="qstem">Vẽ hình chiếu trục đo <b>${TYPE[st.ptype].toLowerCase()}</b> của vật thể có ba hình chiếu bên cạnh. Hình nào dưới đây đúng?</div>
      <div class="optgrid">${O.map((x, i) => `<button class="opt ${ch ? (x.ok ? 'ok' : i === a ? 'bad' : '') : ''}" data-a="${i}" ${ch ? 'disabled' : ''}><span class="ol">${'ABC'[i]}</span><canvas data-cv="${i}"></canvas></button>`).join('')}</div>
      ${ch ? `<div class="fb ${ch.ok ? 'ok' : 'bad'}"><b>${ch.ok ? '✔ Chính xác!' : '✘ Chưa đúng.'}</b> ${ch.ok ? 'Hình chiếu trục đo khớp với cả ba hình chiếu vuông góc.' : ch.why + ' Đáp án đúng là ' + 'ABC'[O.findIndex(x => x.ok)] + '.'}</div>` : ''}
      <div class="ctrl"><button class="btn ghost" id="sol">✏️ Xem cách vẽ 6 bước</button>${ch ? '<button class="btn ghost" id="redo">↻ Làm lại</button>' : ''}<button class="btn" id="nxp">${st.pi < PRACT.length - 1 ? 'Bài tiếp →' : 'Về bài 1'}</button></div></div></section>`;
}
function bindLt() {
  const o = PRACT[st.pi], O = opts(o);
  $$('[data-p]').forEach(b => b.onclick = () => { st.pi = +b.dataset.p; render(); });
  $$('[data-seg="ptype"] button').forEach(b => b.onclick = () => { st.ptype = b.dataset.v; render(); });
  $('#grid').onchange = e => { st.grid = e.target.checked; render(); };
  $$('[data-a]').forEach(b => b.onclick = () => { st.ans[o.id + st.ptype] = +b.dataset.a; store.set('ans', st.ans); render(); });
  if ($('#redo')) $('#redo').onclick = () => { delete st.ans[o.id + st.ptype]; delete o._op; store.set('ans', st.ans); render(); };
  $('#sol').onclick = () => { st.tab = 've'; st.obj = o.id; st.type = st.ptype; st.step = 0; render(); };
  $('#nxp').onclick = () => { st.pi = (st.pi + 1) % PRACT.length; render(); };
  setTimeout(() => $$('[data-cv]').forEach(cv => renderFinal(cv, getF(o, O[+cv.dataset.cv].F), o, st.ptype, false)), 0);
}

/* ---------- phím tắt, thay đổi kích thước ---------- */
document.addEventListener('keydown', e => {
  if (st.tab !== 've' || /INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
  if (['ArrowRight', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); if (st.step < 7) setStep(st.step + 1); }
  if (['ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); if (st.step > 0) setStep(st.step - 1); }
});
let rt = 0; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { if (st.tab === 've') { const cv = $('#cv'); if (st.step === 7) start3D(false); else if (cv) { { sizeCv(cv); renderStep(cv, objOf(st.obj), st.type, st.step, 1); } } } else ({ ss: bindSs, nho: bindNho, lt: bindLt })[st.tab](); }, 120); });
document.addEventListener('fullscreenchange', () => window.dispatchEvent(new Event('resize')));
render();
})();

</script>
</body>
</html>
