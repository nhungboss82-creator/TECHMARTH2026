:7px 10px;gap:2px;border-radius:10px}\n.panel .ctl label{font-size:13px}\n.panel .ctl output{font-size:14px}\n.panel .ctl .row{gap:6px}\n.panel .step{width:24px;height:24px;border-radius:6px}\n.panel input[type=range]{height:22px}\n.panel .opts{gap:4px}\n.panel .opts button{padding:3px 8px;font-size:12px}\n.panel .fnote{font-size:11px;line-height:1.3}\n.panel .grpT{margin:10px 0 5px;font-size:11px}\n.panel #resCtrls{margin-top:10px!important}\n.panel .sigs.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}\n.panel .sigs.two .ctrls{grid-template-columns:minmax(0,1fr)}\n@media (max-width:520px){.panel .sigs.two{grid-template-columns:minmax(0,1fr)}}\n.panel .quick{margin-top:10px;gap:6px}\n.panel .pill{padding:4px 10px;font-size:12px}\nfooter{color:var(--muted);font-size:12.5px;padding-block:0 30px}\n\n/* ===== Bố cục gọn một màn hình: tiêu đề một dòng; sơ đồ · bảng điều chỉnh · dao động kí cùng hàng ===== */\nheader .wrap{padding-block:8px;gap:8px 18px;align-items:center}\nheader .wrap>div:first-child{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;min-width:0}\n.eyebrow{font-size:11px;white-space:nowrap}\nh1{font-size:clamp(18px,1.7vw,22px);margin:0;white-space:nowrap}\nheader .sub{display:none}\n.seg{flex:1 1 560px;border-radius:12px;padding:3px;gap:3px}\n.seg button{padding:5px 6px;font-size:13.5px;flex-direction:row;align-items:baseline;gap:6px;border-radius:9px}\n.seg button{white-space:nowrap}\n.seg button small{font-size:10.5px}\n.panel .ctl:has(.opts){grid-column:1/-1}\n@media (max-width:1560px){.seg button small{display:none}.seg button{font-size:13px;padding:6px 4px}}\n.card{padding:14px}\n.card h2{font-size:16px}\nmain.wrap{padding-block:14px 30px;gap:14px}\n.col{gap:14px}\n@media (min-width:1280px){\n  .wrap{max-width:1720px}\n  main.wrap{grid-template-columns:minmax(0,1.12fr) minmax(300px,.82fr) minmax(0,1.06fr);\n    grid-template-areas:\"s p o\" \"r p o\" \"r p t\";align-items:start}\n  main.wrap>.col{display:contents}\n  main.wrap>.col:first-child>.card:first-child{grid-area:s}\n  main.wrap>.col:first-child>.panel{grid-area:p}\n  main.wrap>.col:last-child>.scope{grid-area:o}\n  main.wrap>.col:last-child>.card:nth-child(2){grid-area:r}\n  main.wrap>.col:last-child>.card:nth-child(3){grid-area:t}\n  main.wrap>*>*{align-self:start}\n  .panel .ctrls{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}\n  .scope{padding:12px}\n  .scope .bar{margin-bottom:8px}\n  .screen{aspect-ratio:10/7.4}\n  .reads{grid-template-columns:repeat(2,minmax(0,1fr))}\n  .rd .v{font-size:18px}\n}\n@media (max-width:640px){h1{white-space:normal}.seg button{flex-direction:column;align-items:center;gap:0}}\n@media (prefers-reduced-motion: reduce){*{transition:none!important}}\n<\/style>\n<\/head>\n<body>\n\n<header>\n  <div class=\"wrap\">\n    <div>\n      <div class=\"eyebrow\">Công nghệ 12 · Bài 19<\/div>\n      <h1>Ứng dụng của <span class=\"a\">khuếch đại<\/span> <span class=\"b\">thuật toán<\/span><\/h1>\n      <p class=\"sub\">Chọn mạch, đổi giá trị linh kiện và quan sát ngay tín hiệu lối vào, lối ra trên màn dao động kí.<\/p>\n    <\/div>\n    <div class=\"seg\" role=\"group\" aria-label=\"Chọn mạch\">\n      <button data-mode=\"inv\" aria-pressed=\"true\">KĐ đảo<small>19.5<\/small><\/button>\n      <button data-mode=\"non\" aria-pressed=\"false\">KĐ không đảo<small>19.7<\/small><\/button>\n      <button data-mode=\"sinv\" aria-pressed=\"false\">Cộng đảo<small>19.9<\/small><\/button>\n      <button data-mode=\"snon\" aria-pressed=\"false\">Cộng không đảo<small>19.10<\/small><\/button>\n      <button data-mode=\"cmpi\" aria-pressed=\"false\">So sánh đảo<small>19.12a<\/small><\/button>\n      <button data-mode=\"cmpn\" aria-pressed=\"false\">So sánh không đảo<small>19.12b<\/small><\/button>\n    <\/div>\n  <\/div>\n<\/header>\n\n<main class=\"wrap\">\n  <div class=\"col\">\n    <section class=\"card\">\n      <h2><span class=\"dot\" style=\"background:var(--sun)\"><\/span><span id=\"schemTitle\">Sơ đồ mạch khuếch đại đảo<\/span><span class=\"tag\">Sơ đồ nguyên lí<\/span><\/h2>\n      <svg class=\"schem\" id=\"schem\" viewBox=\"0 0 520 300\" aria-label=\"Sơ đồ mạch\"><\/svg>\n      <p class=\"hint\" id=\"dragHint\">Mẹo: <kbd>kéo lên/xuống<\/kbd> ngay trên điện trở, hoặc bấm vào điện trở rồi dùng <kbd>↑<\/kbd><kbd>↓<\/kbd>. Chấm vàng là dòng điện chạy qua các điện trở.<\/p>\n    <\/section>\n\n    <section class=\"card panel\">\n      <h2><span class=\"dot\" style=\"background:var(--r1)\"><\/span>Bảng điều chỉnh<span class=\"tag\">Giá trị chuẩn E12<\/span><\/h2>\n      <div class=\"ctrls\" id=\"resCtrls\" style=\"margin-top:14px\"><\/div>\n      <div class=\"sigs\" id=\"sigs\"><div class=\"sig1\">\n      <div class=\"grpT\" id=\"g1T\">Tín hiệu vào U<sub>vào<\/sub><\/div>\n      <div class=\"ctrls\">\n        <div class=\"ctl\" style=\"--c:var(--vin)\">\n          <div class=\"top\"><label for=\"amp\" id=\"ampL\">Biên độ U<sub>vào<\/sub><\/label><output id=\"o-amp\">0,5 V<\/output><\/div>\n          <input type=\"range\" id=\"amp\" min=\"0.1\" max=\"5\" step=\"0.1\">\n        <\/div>\n        <div class=\"ctl\" style=\"--c:var(--vin)\">\n          <div class=\"top\"><label for=\"freq\" id=\"freqL\">Tần số<\/label><output id=\"o-freq\">1 kHz<\/output><\/div>\n          <input type=\"range\" id=\"freq\" min=\"0\" max=\"4\" step=\"1\">\n          <div class=\"fnote\" id=\"o-per\"><\/div>\n        <\/div>\n        <div class=\"ctl\" style=\"--c:var(--vin)\">\n          <div class=\"top\"><label id=\"waveL\">Dạng tín hiệu vào<\/label><\/div>\n          <div class=\"opts\" id=\"waves\">\n            <button data-w=\"sin\" aria-pressed=\"true\">Hình sin<\/button>\n            <button data-w=\"tri\" aria-pressed=\"false\">Tam giác<\/button>\n            <button data-w=\"sq\" aria-pressed=\"false\">Xung vuông<\/button>\n            <button data-w=\"saw\" aria-pressed=\"false\">Răng cưa<\/button>\n            <button data-w=\"dc\" aria-pressed=\"false\">Một chiều<\/button>\n          <\/div>\n        <\/div>\n      <\/div>\n      <\/div>\n      <div id=\"u2box\" hidden>\n        <div class=\"grpT\">Tín hiệu vào U<sub>vào2<\/sub><\/div>\n        <div class=\"ctrls\">\n          <div class=\"ctl\" style=\"--c:var(--u2)\">\n            <div class=\"top\"><label for=\"amp2\" id=\"amp2L\">Giá trị U<sub>vào2<\/sub><\/label><output id=\"o-amp2\"><\/output><\/div>\n            <input type=\"range\" id=\"amp2\" min=\"-5\" max=\"5\" step=\"0.1\">\n          <\/div>\n          <div class=\"ctl\" style=\"--c:var(--u2)\">\n            <div class=\"top\"><label for=\"freq2\">Tần số U<sub>vào2<\/sub><\/label><output id=\"o-freq2\"><\/output><\/div>\n            <input type=\"range\" id=\"freq2\" min=\"0\" max=\"4\" step=\"1\">\n          <\/div>\n          <div class=\"ctl\" style=\"--c:var(--u2)\">\n            <div class=\"top\"><label>Dạng U<sub>vào2<\/sub><\/label><\/div>\n            <div class=\"opts\" id=\"waves2\">\n              <button data-w=\"dc\" aria-pressed=\"true\">Một chiều<\/button>\n              <button data-w=\"sin\" aria-pressed=\"false\">Hình sin<\/button>\n              <button data-w=\"tri\" aria-pressed=\"false\">Tam giác<\/button>\n              <button data-w=\"sq\" aria-pressed=\"false\">Xung vuông<\/button>\n              <button data-w=\"saw\" aria-pressed=\"false\">Răng cưa<\/button>\n            <\/div>\n          <\/div>\n        <\/div>\n      <\/div>\n      <\/div>\n      <div class=\"grpT\">Nguồn cấp<\/div>\n      <div class=\"ctrls\" style=\"grid-template-columns:minmax(0,1fr)\">\n        <div class=\"ctl\" style=\"--c:var(--hot)\">\n          <div class=\"top\"><label for=\"vcc\">Nguồn cấp ±U<sub>cc<\/sub><\/label><output id=\"o-vcc\">±12 V<\/output><\/div>\n          <input type=\"range\" id=\"vcc\" min=\"5\" max=\"15\" step=\"1\">\n        <\/div>\n      <\/div>\n      <div id=\"cmpbox\" hidden>\n        <div class=\"grpT\">Mạch so sánh<\/div>\n        <div class=\"ctrls\">\n          <div class=\"ctl\" style=\"--c:var(--u2)\">\n            <div class=\"top\"><label for=\"th\">Điện áp ngưỡng U<sub>ngưỡng<\/sub><\/label><output id=\"o-th\"><\/output><\/div>\n            <input type=\"range\" id=\"th\" min=\"-5\" max=\"5\" step=\"0.1\">\n          <\/div>\n        <\/div>\n      <\/div>\n      <div class=\"quick\">\n        <span>Chọn nhanh:<\/span>\n        <span id=\"pills\" style=\"display:contents\"><\/span>\n      <\/div>\n    <\/section>\n\n  <\/div>\n\n  <div class=\"col\">\n    <section class=\"scope\" aria-label=\"Màn dao động kí\">\n      <div class=\"bar\">\n        <h2><span class=\"led\" id=\"led\"><\/span>Dạng tín hiệu lối vào và lối ra<\/h2>\n        <div id=\"chips\" style=\"display:flex;gap:6px;flex-wrap:wrap\"><\/div>\n      <\/div>\n      <div class=\"screen\"><canvas id=\"scope\" style=\"cursor:crosshair;touch-action:none\"><\/canvas><\/div>\n      <div class=\"fnote\" style=\"color:#8fb0d6;margin-top:6px\">Rê chuột hoặc chạm vào màn hình để đo điện áp tại một điểm.<\/div>\n      <div class=\"foot\">\n        <div class=\"grp\"><span id=\"vdivLbl\">1 V/ô<\/span><span>·<\/span><span id=\"tdivLbl\">0,5 ms/ô<\/span><\/div>\n        <div class=\"grp\">\n          <span>Biên độ:<\/span>\n          <button class=\"sbtn\" id=\"vOut\" aria-label=\"Thu nhỏ biên độ\">− Thu nhỏ<\/button>\n          <button class=\"sbtn\" id=\"vIn\" aria-label=\"Phóng to biên độ\">+ Phóng to<\/button>\n          <button class=\"sbtn\" id=\"vAuto\" aria-pressed=\"true\">Tự động<\/button>\n        <\/div>\n        <div class=\"grp\">\n          <span>Thời gian:<\/span>\n          <button class=\"sbtn\" id=\"tOut\" aria-label=\"Thu nhỏ thời gian\">− Thu nhỏ<\/button>\n          <button class=\"sbtn\" id=\"tIn\" aria-label=\"Phóng to thời gian\">+ Phóng to<\/button>\n          <button class=\"sbtn\" id=\"pk\" aria-pressed=\"true\">Đo đỉnh<\/button>\n          <button class=\"sbtn\" id=\"run\" aria-pressed=\"false\">⏸ Dừng<\/button>\n        <\/div>\n      <\/div>\n    <\/section>\n\n    <section class=\"card\">\n      <div class=\"reads\">\n        <div class=\"rd\"><div class=\"k\" id=\"k1\"><\/div><div class=\"v\" id=\"v1\"><\/div><\/div>\n        <div class=\"rd\"><div class=\"k\" id=\"k2\"><\/div><div class=\"v\" id=\"v2\"><\/div><\/div>\n        <div class=\"rd\"><div class=\"k\" id=\"k3\"><\/div><div class=\"v\" id=\"v3\"><\/div><\/div>\n        <div class=\"rd\"><div class=\"k\" id=\"k4\"><\/div><div class=\"v\" id=\"v4\"><\/div><div id=\"rSt\"><\/div><\/div>\n      <\/div>\n    <\/section>\n\n    <section class=\"card\">\n      <h2><span class=\"dot\" style=\"background:var(--r2)\"><\/span><span id=\"tcTitle\">Đặc tuyến U<sub>ra<\/sub> – U<sub>vào<\/sub><\/span><\/h2>\n      <canvas class=\"tc\" id=\"tc\"><\/canvas>\n    <\/section>\n\n  <\/div>\n<\/main>\n<footer class=\"wrap\">Mô phỏng khuếch đại thuật toán lí tưởng (A → ∞) theo SGK Công nghệ 12 – Kết nối tri thức, Bài 19. Khi điện áp ra tính theo công thức vượt quá nguồn cấp, U<sub>ra<\/sub> bị giới hạn ở ±U<sub>cc<\/sub> (bão hòa).<\/footer>\n\n<script>\n(function(){\nconst E12=[1,1.2,1.5,1.8,2.2,2.7,3.3,3.9,4.7,5.6,6.8,8.2];\nconst RV=[];[1e3,1e4].forEach(m=>E12.forEach(v=>RV.push(Math.round(v*m))));RV.push(1e5);\nconst FREQS=[100,200,500,1000,2000];\nconst $=id=>document.getElementById(id);\nconst ix=v=>RV.indexOf(v);\nconst MODES={\n  inv:{t:'Sơ đồ mạch khuếch đại đảo (Hình 19.5)',res:['r1','r2'],two:false},\n  non:{t:'Sơ đồ mạch khuếch đại không đảo (Hình 19.7)',res:['r1','r2'],two:false},\n  sinv:{t:'Sơ đồ mạch cộng đảo (Hình 19.9)',res:['r1','r2','rf'],two:true},\n  snon:{t:'Sơ đồ mạch cộng không đảo (Hình 19.10)',res:['r1','r2','rg','rf'],two:true},\n  cmp:{t:'Sơ đồ mạch so sánh (Hình 19.12)',res:[],two:false}};\nconst RES={\n  r1:{s:'R₁',h:'R<sub>1<\/sub>',c:'var(--r1)'},\n  r2:{s:'R₂',h:'R<sub>2<\/sub>',c:'var(--r2)'},\n  rf:{s:'R<tspan font-size=\"11\" dy=\"4\">f<\/tspan>',h:'R<sub>f<\/sub>',c:'var(--rf)'},\n  rg:{s:'R<tspan font-size=\"11\" dy=\"4\">g<\/tspan>',h:'R<sub>g<\/sub>',c:'var(--rg)'}};\nconst S={mode:'inv',\n  R:{inv:{r1:ix(1e4),r2:ix(47e3)},non:{r1:ix(1e4),r2:ix(39e3)},sinv:{r1:ix(1e4),r2:ix(1e4),rf:ix(22e3)},snon:{r1:ix(1e4),r2:ix(1e4),rg:ix(1e4),rf:ix(22e3)},cmp:{}},\n  amp:0.5,fi:3,wave:'sin',amp2:1,fi2:1,wave2:'dc',th:0,ct:'inv',vcc:12,vdiv:'auto',ti:2,pkOn:true,run:true,st:null};\nconst VST=[0.1,0.2,0.5,1,2,5,10],TST=[0.1e-3,0.2e-3,0.5e-3,1e-3,2e-3,5e-3];let CUR=null;\nconst done={inv:new Set(),non:new Set(),sinv:new Set(),snon:new Set(),cmpinv:new Set(),cmpnon:new Set()};\nconst dk=()=>S.mode==='cmp'?'cmp'+S.ct:S.mode;\nconst satSeen={};const visited={};\n\nconst rnd=(x,d)=>{const r=+(+x).toFixed(d);return r===0?0:r;};\nconst num=(x,d=2)=>rnd(x,d).toFixed(d).replace('.',',').replace('-','−');\nconst sgn=(x,d=2)=>(rnd(x,d)>=0?'+':'')+num(x,d);\nconst fmtR=v=>v>=1000?String(v/1000).replace('.',',')+' kΩ':v+' Ω';\nconst fmtF=f=>f>=1000?(f/1000)+' kHz':f+' Hz';\nconst fmtT=s=>s>=1e-3?num(s*1e3,(s*1e3)%1?1:0)+' ms':num(s*1e6,0)+' µs';\nconst rv=k=>RV[S.R[S.mode][k]];\nconst clamp=(x,a)=>Math.max(-a,Math.min(a,x));\nconst usat=()=>S.vcc;\nconst two=()=>MODES[S.mode].two;\nfunction coef(){const m=S.mode;\n  if(m==='inv')return [-rv('r2')/rv('r1'),0];\n  if(m==='non')return [1+rv('r2')/rv('r1'),0];\n  if(m==='sinv')return [-rv('rf')/rv('r1'),-rv('rf')/rv('r2')];\n  if(m==='snon'){const g=1+rv('rf')/rv('rg'),a=rv('r1'),b=rv('r2');return [g*b/(a+b),g*a/(a+b)];}\n  return [0,0];}\nfunction ideal(a,b){const c=coef();return c[0]*a+c[1]*b;}\nfunction out(a,b){if(S.mode==='cmp'){const hi=a>S.th;return (S.ct==='inv'?(hi?-1:1):(hi?1:-1))*usat();}return clamp(ideal(a,b),usat());}\nfunction shape(p,w){if(w==='dc')return 1;p-=Math.floor(p);if(w==='saw')return 2*p-1;\n  if(w==='sin')return Math.sin(2*Math.PI*p);if(w==='tri')return 1-4*Math.abs(((p+0.25)%1)-0.5);return p<0.5?1:-1;}\nconst u1=t=>S.amp*shape(t*FREQS[S.fi],S.wave);\nconst u2=t=>two()?S.amp2*shape(t*FREQS[S.fi2],S.wave2):0;\nconst tdiv=()=>TST[S.ti];\nfunction stats(){const f=Math.min(FREQS[S.fi],two()?FREQS[S.fi2]:1e9);const T=Math.max(2/f,10*tdiv());const N=1200;\n  let imx=-1e9,imn=1e9,mx=-1e9,mn=1e9,sat=false,p1=0,p2=0,hi=0,lo1=1e9,hi1=-1e9;\n  for(let i=0;i<N;i++){const t=i/N*T,a=u1(t),b=u2(t),o=out(a,b);mx=Math.max(mx,o);mn=Math.min(mn,o);\n    p1=Math.max(p1,Math.abs(a));p2=Math.max(p2,Math.abs(b));lo1=Math.min(lo1,a);hi1=Math.max(hi1,a);\n    const id=ideal(a,b);imx=Math.max(imx,id);imn=Math.min(imn,id);if(S.mode!=='cmp'&&Math.abs(id)>usat()+1e-9)sat=true;if(o>0)hi++;}\n  return {imx,imn,mx,mn,sat,p1,p2,lo1,hi1,duty:hi/N};}\n\n/* ---------- Schematic ---------- */\nfunction zig(x1,x2,y){const lead=8,n=6,a=9,w=(x2-x1-2*lead)/n;let d=`M${x1} ${y} H${x1+lead}`;\n  for(let i=0;i<n;i++){d+=` L${x1+lead+w*(i+.25)} ${y-a} L${x1+lead+w*(i+.75)} ${y+a}`}return d+` L${x2-lead} ${y} H${x2}`;}\nconst W=d=>`<path class=\"w\" d=\"${d}\"/>`;\nconst gnd=(x,y)=>`<path class=\"w\" d=\"M${x-12} ${y} H${x+12} M${x-7} ${y+5} H${x+7} M${x-2.5} ${y+10} H${x+2.5}\"/>`;\nconst gndT=(x,y)=>`<path class=\"w\" d=\"M${x} ${y-14} V${y}\"/><circle class=\"term\" cx=\"${x}\" cy=\"${y-17.5}\" r=\"3.5\"/>`+gnd(x,y);\nconst term=(x,y)=>`<circle class=\"term\" cx=\"${x}\" cy=\"${y}\" r=\"5\"/>`;\nconst node=(x,y)=>`<circle class=\"node\" cx=\"${x}\" cy=\"${y}\" r=\"4.5\"/>`;\nconst tl=(x,y,sub,col,anc)=>`<text class=\"lbl\" x=\"${x}\" y=\"${y}\" ${anc?`text-anchor=\"${anc}\"`:''} style=\"fill:${col}\">U<tspan font-size=\"11\" dy=\"4\">${sub}<\/tspan><\/text>`;\nfunction res(k,x1,x2,y){const r=RES[k],mid=(x1+x2)/2;\n  return `<g class=\"res\" id=\"g-${k}\" tabindex=\"0\" role=\"slider\" aria-label=\"Điện trở\" data-t=\"${k}\">\n    <rect class=\"halo\" x=\"${x1-6}\" y=\"${y-22}\" width=\"${x2-x1+12}\" height=\"44\" rx=\"12\" fill=\"${r.c}\"/>\n    <path class=\"z\" d=\"${zig(x1,x2,y)}\" stroke=\"${r.c}\"/>\n    <rect class=\"hit\" x=\"${x1-6}\" y=\"${y-26}\" width=\"${x2-x1+12}\" height=\"52\"/>\n    <text class=\"lbl\" x=\"${mid}\" y=\"${y-18}\" text-anchor=\"middle\" style=\"fill:${r.c}\">${r.s}<\/text>\n    <g class=\"chip\"><rect x=\"${mid-34}\" y=\"${y+16}\" width=\"68\" height=\"22\" fill=\"${r.c}\"/><text id=\"chip-${k}\" x=\"${mid}\" y=\"${y+32}\" text-anchor=\"middle\"><\/text><\/g><\/g>`;}\nfunction opamp(){return `<polygon class=\"amp\" points=\"270,110 270,230 370,170\"/>\n  <text class=\"sign\" x=\"278\" y=\"147\">−<\/text><text class=\"sign\" x=\"278\" y=\"208\">+<\/text>\n  <text class=\"pin\" x=\"256\" y=\"132\">1<\/text><text class=\"pin\" x=\"256\" y=\"193\">2<\/text><text class=\"pin\" x=\"378\" y=\"160\">3<\/text>`;}\nconst OUT=()=>W('M370 170 H465')+node(420,170)+term(470,170)+tl(458,152,'ra','var(--vout)')+gndT(470,214);\nconst LOUT={x:508,y:238,a:'end',c:'var(--vout)',f:c=>'Ura = '+sgn(c.o)+' V'};\nfunction layout(){const m=S.mode;\n  if(m==='inv')return {vb:'0 0 520 300',\n    svg:W('M45 140 H90 M170 140 H270 M230 140 V60 H290 M370 60 H420 V170 M270 200 H240 V226')+gnd(240,226)+term(40,140)+tl(18,126,'vào','var(--vin)')+gndT(40,184)+node(230,140)+opamp()+OUT()+res('r1',90,170,140)+res('r2',290,370,60),\n    flows:['M45 140 H230 V60 H420 V170 H370'],\n    lives:[{x:14,y:210,c:'var(--vin)',f:c=>'Uvào = '+sgn(c.a)+' V'},LOUT,\n      {x:320,y:262,a:'middle',c:'var(--muted)',f:c=>'U₋ = '+sgn(c.vn)+' V'+(Math.abs(c.vn)<.01?' (đất ảo)':'')},\n      {x:320,y:288,a:'middle',c:'var(--ink)',f:c=>'I qua R₁, R₂ = '+sgn(c.I[0]*1000,3)+' mA'}]};\n  if(m==='non')return {vb:'0 0 520 300',\n    svg:W('M60 158 V140 H90 M170 140 H270 M230 140 V60 H290 M370 60 H420 V170 M270 200 H45')+gnd(60,158)+term(40,200)+tl(18,186,'vào','var(--vin)')+gndT(40,244)+node(230,140)+opamp()+OUT()+res('r1',90,170,140)+res('r2',290,370,60),\n    flows:['M60 158 V140 H230 V60 H420 V170 H370'],\n    lives:[{x:14,y:268,c:'var(--vin)',f:c=>'Uvào = '+sgn(c.a)+' V'},LOUT,\n      {x:320,y:262,a:'middle',c:'var(--muted)',f:c=>'U₋ = '+sgn(c.vn)+' V ≈ Uvào'},\n      {x:320,y:288,a:'middle',c:'var(--ink)',f:c=>'I qua R₁, R₂ = '+sgn(c.I[0]*1000,3)+' mA'}]};\n  if(m==='sinv')return {vb:'0 0 520 300',\n    svg:W('M45 95 H90 M170 95 H200 V175 M45 175 H90 M170 175 H200 M200 140 H270 M230 140 V45 H290 M370 45 H420 V170 M270 200 H240 V226')+gnd(240,226)\n      +term(40,95)+tl(14,81,'vào1','var(--vin)')+term(40,175)+tl(14,161,'vào2','var(--u2)')+gndT(40,219)+node(200,140)+node(230,140)+opamp()+OUT()\n      +res('r1',90,170,95)+res('r2',90,170,175)+res('rf',290,370,45),\n    flows:['M45 95 H200 V140 H230','M45 175 H200 V140 H230','M230 140 V45 H420 V170 H370'],\n    lives:[{x:14,y:262,c:'var(--vin)',f:c=>'Uvào1 = '+sgn(c.a)+' V'},{x:14,y:286,c:'var(--u2)',f:c=>'Uvào2 = '+sgn(c.b)+' V'},LOUT,\n      {x:340,y:262,a:'middle',c:'var(--muted)',f:c=>'U₋ = '+sgn(c.vn)+' V'+(Math.abs(c.vn)<.01?' (đất ảo)':'')},\n      {x:340,y:286,a:'middle',c:'var(--ink)',f:c=>'I qua Rf = '+sgn(c.I[2]*1000,3)+' mA'}]};\n  if(m==='snon')return {vb:'0 0 520 340',\n    svg:W('M60 158 V140 H90 M170 140 H270 M230 140 V60 H290 M370 60 H420 V170 M45 200 H150 M230 200 H270 M45 275 H150 M230 275 H248 V200')+gnd(60,158)\n      +term(40,200)+tl(14,186,'vào1','var(--vin)')+term(40,275)+tl(14,261,'vào2','var(--u2)')+gndT(40,319)+node(230,140)+node(248,200)+opamp()+OUT()\n      +res('rg',90,170,140)+res('rf',290,370,60)+res('r1',150,230,200)+res('r2',150,230,275),\n    flows:['M60 158 V140 H230 V60 H420 V170 H370','M45 200 H248','M45 275 H248 V200'],\n    lives:[LOUT,\n      {x:400,y:304,a:'middle',c:'var(--muted)',f:c=>'U₊ = '+sgn(c.vp)+' V · U₋ = '+sgn(c.vn)+' V'},\n      {x:400,y:328,a:'middle',c:'var(--ink)',f:c=>'U1 = '+sgn(c.a)+' V · U2 = '+sgn(c.b)+' V'}]};\n  // comparator\n  const top=S.ct==='inv'?['vào','var(--vin)']:['ngưỡng','var(--sun)'],bot=S.ct==='inv'?['ngưỡng','var(--sun)']:['vào','var(--vin)'];\n  return {vb:'0 0 520 300',\n    svg:W('M105 140 H270 M105 200 H270 M320 140 V95 M320 200 V245 M100 235 V250')+term(100,140)+tl(90,145,top[0],top[1],'end')+term(100,200)+tl(90,205,bot[0],bot[1],'end')\n      +term(100,230)+gnd(100,250)+opamp()+term(320,90)+term(320,250)\n      +`<text class=\"lbl\" x=\"332\" y=\"86\" style=\"fill:var(--hot)\">+U<tspan font-size=\"11\" dy=\"4\">CC<\/tspan><\/text><text class=\"lbl\" x=\"332\" y=\"272\" style=\"fill:var(--hot)\">−U<tspan font-size=\"11\" dy=\"4\">CC<\/tspan><\/text>`+OUT(),\n    flows:[],\n    lives:[LOUT,{x:14,y:290,c:'var(--vin)',f:c=>'Uvào = '+sgn(c.a)+' V'},{x:180,y:290,c:'var(--sun)',f:()=>'Ungưỡng = '+sgn(S.th)+' V'},\n      {x:14,y:34,c:'var(--ink)',f:c=>(c.a>S.th?'Uvào > Ungưỡng':'Uvào < Ungưỡng')+' ⇒ Ura ≈ '+(c.o>0?'+':'−')+'Ucc'}]};\n}\nlet FLOWS=[],LIVES=[];\nfunction drawSchem(){\n  const L=layout();L.flows=L.flows.concat([S.mode==='cmp'?'M370 170 H465':'M420 170 H465']);const sv=$('schem');sv.setAttribute('viewBox',L.vb);\n  let s=L.svg+L.flows.map((d,i)=>`<path id=\"flow${i}\" d=\"${d}\" fill=\"none\" stroke=\"none\"/>`).join('');\n  s+=L.lives.map((v,i)=>`<text class=\"live\" id=\"lv${i}\" x=\"${v.x}\" y=\"${v.y}\" ${v.a?`text-anchor=\"${v.a}\"`:''} style=\"fill:${v.c}\" ${i>0&&v!==LOUT?'font-size=\"12\"':''}><\/text>`).join('');\n  s+='<g id=\"dots\"><\/g>';sv.innerHTML=s;\n  $('schemTitle').textContent=(S.mode==='cmp'?(S.ct==='inv'?'Sơ đồ mạch so sánh đảo (Hình 19.12a)':'Sơ đồ mạch so sánh không đảo (Hình 19.12b)'):MODES[S.mode].t);\n  const g=$('dots');FLOWS=L.flows.map((d,i)=>{const p=$('flow'+i),len=p.getTotalLength(),n=Math.max(len<60?2:4,Math.round(len/28));\n    const dots=[];for(let j=0;j<n;j++){const c=document.createElementNS('http://www.w3.org/2000/svg','circle');c.setAttribute('class','flow');c.setAttribute('r','3.6');g.appendChild(c);dots.push(c)}\n    return {p,len,off:0,pk:0,dots};});\n  LIVES=L.lives;\n  MODES[S.mode].res.forEach(bindRes);\n  $('dragHint').hidden=!MODES[S.mode].res.length;\n  updChips();\n}\nfunction bindRes(t){\n  const g=$('g-'+t);let y0=null,acc=0;\n  g.addEventListener('pointerdown',e=>{g.setPointerCapture(e.pointerId);y0=e.clientY;acc=0;select(t);e.preventDefault()});\n  g.addEventListener('pointermove',e=>{if(y0===null)return;const st=Math.trunc((y0-e.clientY)/14);if(st!==acc){bump(t,st-acc);acc=st}});\n  const end=()=>{y0=null};g.addEventListener('pointerup',end);g.addEventListener('pointercancel',end);\n  g.addEventListener('keydown',e=>{if(e.key==='ArrowUp'||e.key==='ArrowRight'){bump(t,1);e.preventDefault()}if(e.key==='ArrowDown'||e.key==='ArrowLeft'){bump(t,-1);e.preventDefault()}});\n  g.addEventListener('focus',()=>select(t));\n  g.addEventListener('wheel',e=>{e.preventDefault();bump(t,e.deltaY<0?1:-1)},{passive:false});\n}\nfunction select(t){document.querySelectorAll('.res').forEach(r=>r.classList.toggle('on',r.dataset.t===t));\n  const c=$('ctl-'+t);if(!c)return;c.classList.add('pulse');clearTimeout(c._t);c._t=setTimeout(()=>c.classList.remove('pulse'),900);}\nfunction bump(t,d){const R=S.R[S.mode];R[t]=Math.max(0,Math.min(RV.length-1,R[t]+d));FLOWS.forEach(f=>f.pk=0);sync();}\nfunction updChips(){MODES[S.mode].res.forEach(k=>{const c=$('chip-'+k);if(c)c.textContent=fmtR(rv(k));$('g-'+k)?.setAttribute('aria-valuetext',fmtR(rv(k)))});}\nfunction buildResCtrls(){const L=MODES[S.mode].res,box=$('resCtrls');box.hidden=!L.length;\n  box.innerHTML=L.map(k=>`<div class=\"ctl\" id=\"ctl-${k}\" style=\"--c:${RES[k].c}\"><div class=\"top\"><label for=\"sl-${k}\">Điện trở ${RES[k].h}<\/label><output id=\"o-${k}\"><\/output><\/div>\n    <div class=\"row\"><button class=\"step\" data-t=\"${k}\" data-d=\"-1\" aria-label=\"Giảm\">−<\/button><input type=\"range\" id=\"sl-${k}\" min=\"0\" max=\"${RV.length-1}\" step=\"1\"><button class=\"step\" data-t=\"${k}\" data-d=\"1\" aria-label=\"Tăng\">+<\/button><\/div><\/div>`).join('');\n  L.forEach(k=>$('sl-'+k).addEventListener('input',e=>{S.R[S.mode][k]=+e.target.value;FLOWS.forEach(f=>f.pk=0);select(k);sync()}));\n  box.querySelectorAll('.step').forEach(b=>b.addEventListener('click',()=>{select(b.dataset.t);bump(b.dataset.t,+b.dataset.d)}));}\n\n/* ---------- Scope ---------- */\nconst cv=$('scope'),cx=cv.getContext('2d'),tc=$('tc'),tx=tc.getContext('2d');\nlet tSim=0;\nfunction fit(c){const r=c.getBoundingClientRect(),d=window.devicePixelRatio||1;const w=Math.round(r.width*d),h=Math.round(r.height*d);\n  if(c.width!==w||c.height!==h){c.width=w;c.height=h}return {w,h,d};}\nfunction vdiv(){if(S.vdiv!=='auto')return VST[S.vdiv];return autoV();}\nfunction autoV(){const st=S.st;\n  const pk=Math.max(st.p1,st.p2,Math.abs(st.mx),Math.abs(st.mn),S.mode==='cmp'?Math.abs(S.th):0);\n  for(const v of [0.2,0.5,1,2,5])if(v*3.6>=pk)return v;return 10;}\nfunction cssv(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}\nconst C_IN='#3dff9e',C_U2='#ffc23d',C_OUT='#45a8ff';\nfunction drawScope(){\n  const {w,h,d}=fit(cv);const X=10,Y=8,dx=w/X,dy=h/Y;\n  cx.fillStyle='#051421';cx.fillRect(0,0,w,h);cx.lineWidth=1*d;\n  for(let i=1;i<X;i++){cx.strokeStyle=i===5?'rgba(120,190,255,.32)':'rgba(120,190,255,.12)';cx.beginPath();cx.moveTo(i*dx,0);cx.lineTo(i*dx,h);cx.stroke()}\n  for(let j=1;j<Y;j++){cx.strokeStyle=j===4?'rgba(120,190,255,.32)':'rgba(120,190,255,.12)';cx.beginPath();cx.moveTo(0,j*dy);cx.lineTo(w,j*dy);cx.stroke()}\n  cx.strokeStyle='rgba(120,190,255,.35)';\n  for(let i=0;i<=X*5;i++){const x=i*dx/5;cx.beginPath();cx.moveTo(x,h/2-3*d);cx.lineTo(x,h/2+3*d);cx.stroke()}\n  for(let j=0;j<=Y*5;j++){const y=j*dy/5;cx.beginPath();cx.moveTo(w/2-3*d,y);cx.lineTo(w/2+3*d,y);cx.stroke()}\n  const vd=vdiv(),td=tdiv(),T=X*td;const yv=v=>h/2-v/vd*dy;\n  cx.font=`${11*d}px JetBrains Mono, monospace`;cx.fillStyle='rgba(160,200,240,.55)';cx.textAlign='left';\n  for(let j=-3;j<=3;j++){if(j)cx.fillText(num(j*vd,vd<0.2?2:vd<1?1:0),w/2+5*d,yv(j*vd)-3*d)}\n  cx.fillText('0',w/2+5*d,h/2-4*d);\n  const us=usat(),cmp=S.mode==='cmp';\n  if(us<vd*4){cx.setLineDash([6*d,5*d]);cx.strokeStyle='rgba(255,77,109,.75)';cx.lineWidth=1.3*d;\n    [us,-us].forEach(v=>{cx.beginPath();cx.moveTo(0,yv(v));cx.lineTo(w,yv(v));cx.stroke()});cx.setLineDash([]);\n    cx.fillStyle='rgba(255,120,140,.9)';cx.textAlign='right'; r:1px solid color-mix(in srgb,var(--c4) 30%,var(--line));border-radius:8px;background:color-mix(in srgb,var(--c4) 5%,var(--panel));resize:vertical;font:inherit;font-weight:400}\n.grp{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:6px 10px;align-items:start}\n.gl{display:flex;align-items:center;gap:5px;font-weight:600;font-size:13px;white-space:nowrap}\n.gl input{width:64px;padding:5px 7px;border:1px solid color-mix(in srgb,var(--c3) 35%,var(--line));border-radius:6px;background:var(--panel)}\n.grp-names{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}\n.grp-name{padding:5px 8px;border:1px solid color-mix(in srgb,var(--c3) 35%,var(--line));border-radius:6px;background:var(--panel);font-size:13px;min-width:0}\n@media (max-width:620px){.grp{grid-template-columns:auto auto}.grp-names{grid-column:1/-1}}\n@media (prefers-reduced-motion: reduce){*{transition:none!important}}\n<\/style>\n<style>body{margin:0;font-size:14px}[hidden]{display:none!important}img{max-width:100%}<\/style>\n<\/head>\n<body>\n\n\n<header class=\"top\">\n  <div>\n    <div class=\"eyebrow\">Công nghệ 12 · Điện – điện tử · KNTT · Bài 20 · tr. 107–108<\/div>\n    <h1>Thực hành: Mạch khuếch đại đảo dùng LM741<\/h1>\n  <\/div>\n  <div class=\"hdr-score\" aria-live=\"polite\"><span id=\"hdrLabel\">Điểm nhóm<\/span><b id=\"hdrScore\">–<small>/10<\/small><\/b><\/div>\n  <div class=\"timer\" id=\"timer\" aria-live=\"polite\">\n    <div><div class=\"eyebrow\">Thời gian · tự chạy khi chọn linh kiện<\/div><b id=\"tClock\">45:00<\/b><\/div>\n    <button class=\"btn primary\" id=\"tStart\">Bắt đầu<\/button>\n    <button class=\"btn\" id=\"tReset\">Đặt lại<\/button>\n  <\/div>\n<\/header>\n\n<main class=\"app\">\n  <aside class=\"panel left\">\n    <section class=\"card\">\n      <h2>Khay linh kiện <small>kéo lên bo mạch<\/small><\/h2>\n      <div class=\"lib\" id=\"lib\"><\/div>\n      <div id=\"wireColors\" class=\"row\" hidden>\n        <span class=\"small muted\">Màu dây:<\/span>\n      <\/div>\n    <\/section>\n    <section class=\"card\">\n      <h2>Thao tác<\/h2>\n      <div class=\"row\">\n        <button class=\"btn\" id=\"toolSelect\" aria-pressed=\"true\">Chọn<\/button>\n        <button class=\"btn\" id=\"btnDelete\">Xoá<\/button>\n        <button class=\"btn\" id=\"btnUndo\">Hoàn tác<\/button>\n        <button class=\"btn\" id=\"btnClear\">Tháo hết<\/button>\n      <\/div>\n      <p class=\"small muted\" style=\"margin:0\">Kéo để xoay bàn, lăn chuột hoặc chụm hai ngón để phóng to. Bấm vào linh kiện đã cắm để chọn, phím Delete để xoá, Esc để huỷ.<\/p>\n    <\/section>\n    <section class=\"card\">\n      <h2>Kiểm tra mạch<\/h2>\n      <button class=\"btn primary\" id=\"btnCheck\">Kiểm tra mạch đã lắp<\/button>\n      <div class=\"verdict-line\" id=\"verdictLine\">Chưa kiểm tra mạch.<\/div>\n      <ul class=\"check-list\" id=\"checkList\"><li>Chưa kiểm tra.<\/li><\/ul>\n      <div class=\"fixbox\" id=\"fixBox\" hidden>\n        <h3>Hướng dẫn cắm lại<\/h3>\n        <ol class=\"fixes\" id=\"fixList\"><\/ol>\n        <p class=\"small muted\" style=\"margin:0\">Bóng cam nhấp nháy trên bo là chỗ cần cắm, khung đỏ là linh kiện cần gỡ hoặc thay. Hướng dẫn tự cập nhật khi em sửa mạch.<\/p>\n        <button class=\"btn\" id=\"hintToggle\">Ẩn gợi ý trên bo<\/button>\n      <\/div>\n    <\/section>\n  <\/aside>\n\n  <section class=\"stage\">\n    <div class=\"stage-wrap\" id=\"stageWrap\">\n      <canvas id=\"c3d\" aria-label=\"Bàn thực hành 3D: bo mạch cắm, nguồn, đồng hồ vạn năng\"><\/canvas>\n      <div class=\"hud\">\n        <span class=\"chip mode\" id=\"modeChip\">Chế độ chọn<\/span>\n        <span class=\"chip off\" id=\"pwrChip\">Nguồn: TẮT<\/span>\n        <span class=\"chip\" id=\"meterChip\">Đồng hồ: OFF<\/span>\n      <\/div>\n      <div class=\"top-btns\">\n        <button class=\"btn meter-btn\" id=\"meterBtn\" aria-pressed=\"false\">Lấy đồng hồ đo<\/button>\n        <button class=\"btn check-btn\" id=\"btnCheck2\">Kiểm tra mạch<\/button>\n        <button class=\"btn sample-btn\" id=\"sampleBtn\" aria-pressed=\"false\">Xem mạch mẫu<\/button>\n        <button class=\"btn meas-btn\" id=\"measBtn\" aria-expanded=\"false\" aria-controls=\"measPanel\">Cách đo<\/button>\n        <button class=\"btn proc-btn\" id=\"procBtn\" aria-expanded=\"false\" aria-controls=\"procPanel\">Quy trình thực hành<\/button>\n      <\/div>\n      <div class=\"proc\" id=\"procPanel\" hidden>\n        <h3>Quy trình thực hành <button id=\"procClose\" aria-label=\"Đóng quy trình\">Đóng<\/button><\/h3>\n        <p class=\"small muted\" style=\"margin:0\">SGK tr. 108 · Yêu cầu: mạch hoạt động đúng chức năng; liên kết giữa các phần tử chắc chắn, gọn gàng.<\/p>\n        <ol class=\"steps\" id=\"steps\"><\/ol>\n      <\/div>\n      <div class=\"proc meas\" id=\"measPanel\" hidden>\n        <h3>Cách đo điện áp <button id=\"measClose\" aria-label=\"Đóng cách đo\">Đóng<\/button><\/h3>\n        <ol class=\"steps\">\n          <li>Bấm <b>Kiểm tra mạch<\/b>, khi bảng báo <b>MẠCH ĐÚNG<\/b> thì bật công tắc <b>Nguồn ±12 V<\/b>.<\/li>\n          <li>Bấm <b>Lấy đồng hồ đo<\/b>, vặn núm sang <b>⎓V<\/b> (đồng hồ tự chọn thang).<\/li>\n          <li>Kéo <b>que đen<\/b> thả vào thanh <b>GND<\/b> (thanh xanh phía dưới bo). Que đen để yên ở GND suốt buổi đo.<\/li>\n          <li>Đặt <b>Uvào<\/b> theo bảng: chọn <b>0, 1 hoặc 2 pin<\/b>; bấm <b>Đảo cực pin<\/b> để có −1,5 V và −3 V.<\/li>\n          <li>Kéo <b>que đỏ<\/b> thả vào <b>cột chân 6<\/b> của IC (cột thứ 3 tính từ chân 1, nửa trên, ví dụ chân 1 ở f5 thì đo ở cột 7). Đọc số trên màn hình, ghi vào cột <b>Ura đo được<\/b>, giữ cả dấu “−”.<\/li>\n          <li>Muốn kiểm tra Uvào thật: đặt que đỏ vào <b>cột dây pin<\/b> (cột 3, nửa trên).<\/li>\n          <li>Tính <b>Ura theo công thức<\/b>: Ura = −(R2/R1)·Uvào = <b>−2,2·Uvào<\/b>, ghi vào cột bên cạnh, rồi so sánh để ghi nhận xét.<\/li>\n          <li>Đo đủ 5 thực nghiệm, ghi vào cột <b>Lần 1<\/b>; sau đó đo lại từ đầu, ghi vào cột <b>Lần 2<\/b>. Cuối cùng viết <b>một nhận xét<\/b> dưới bảng.<\/li>\n          <li>Đo điện trở R1, R2 (nếu cần): <b>tắt nguồn<\/b>, vặn núm sang <b>Ω<\/b>, đặt hai que vào hai đầu điện trở.<\/li>\n        <\/ol>\n        <p class=\"small muted\" style=\"margin:0\">Mẹo: bấm <b>HOLD<\/b> để giữ số trên màn hình khi ghi chép. Kéo đồng hồ sang chỗ trống để không che bo.<\/p>\n      <\/div>\n      <div class=\"verdict\" id=\"verdict\" hidden><\/div>\n      <div class=\"fmeter\" id=\"fmeter\" hidden aria-label=\"Đồng hồ vạn năng số, kéo để di chuyển\">\n        <div class=\"fm-top\" id=\"fmDrag\" title=\"Kéo để di chuyển đồng hồ\"><span>⠿ kéo để di chuyển<\/span><button id=\"fmMin\" aria-label=\"Cất đồng hồ\">×<\/button><\/div>\n        <div class=\"fm-face\" id=\"fmBody\">\n          <div class=\"fm-lcdbox\"><div class=\"fm-lcd\">\n            <div class=\"fm-ind\"><span id=\"fmAuto\">AUTO<\/span><span id=\"fmHoldI\">H<\/span><span id=\"fmMode\"><\/span><\/div>\n            <div class=\"fm-num\"><b id=\"fmRead\">&nbsp;<\/b><span id=\"fmUnit\"><\/span><\/div>\n          <\/div><\/div>\n          <div class=\"fm-btns\"><button class=\"k hold\" id=\"fmHold\">HOLD<\/button><button class=\"k\" data-x=\"MAX/MIN\">MAX/MIN<\/button><button class=\"k\" data-x=\"FILTER\">FILTER<\/button><button class=\"k dk\" data-x=\"RANGE\">RANGE<\/button><\/div>\n          <svg class=\"fm-dial\" id=\"fmDial\" viewBox=\"0 0 230 196\" role=\"group\" aria-label=\"Núm vặn chọn thang đo\"><\/svg>\n          <div class=\"fm-name\"><span class=\"tr\">True RMS<\/span><b>ĐỒNG HỒ VẠN NĂNG SỐ<\/b><\/div>\n          <div class=\"fm-jacks\">\n            <div class=\"jk\"><em>A<\/em><i><\/i><small>10A FUSED<\/small><\/div>\n            <div class=\"jk\"><em class=\"com\">COM<\/em><i class=\"b\"><\/i><\/div>\n            <div class=\"jk\"><em>V Ω<\/em><i class=\"r\"><\/i><small>CAT III 600V<\/small><\/div>\n          <\/div>\n          <div class=\"fm-probes\">\n            <div class=\"probe-tok\" data-k=\"black\" title=\"Kéo que đen thả vào lỗ trên bo\">\n              <svg viewBox=\"0 0 30 96\" width=\"22\" height=\"70\"><rect x=\"9\" y=\"30\" width=\"12\" height=\"62\" rx=\"5\" fill=\"#1f1f1f\"/><rect x=\"6\" y=\"26\" width=\"18\" height=\"6\" rx=\"2\" fill=\"#1f1f1f\"/><rect x=\"13.5\" y=\"2\" width=\"3\" height=\"26\" fill=\"#c8ccd2\"/><\/svg><span>Que đen<\/span><\/div>\n            <div class=\"probe-tok\" data-k=\"red\" title=\"Kéo que đỏ thả vào lỗ trên bo\">\n              <svg viewBox=\"0 0 30 96\" width=\"22\" height=\"70\"><rect x=\"9\" y=\"30\" width=\"12\" height=\"62\" rx=\"5\" fill=\"#d62828\"/><rect x=\"6\" y=\"26\" width=\"18\" height=\"6\" rx=\"2\" fill=\"#d62828\"/><rect x=\"13.5\" y=\"2\" width=\"3\" height=\"26\" fill=\"#c8ccd2\"/><\/svg><span>Que đỏ<\/span><\/div>\n          <\/div>\n          <div class=\"fm-info\" id=\"fmInfo\">Kéo que đo thả vào lỗ trên bo<\/div>\n        <\/div>\n      <\/div>\n      <div class=\"toast\" id=\"toast\"><\/div>\n      <span class=\"chip hover-info\" id=\"hoverInfo\">Di chuột lên bo mạch để xem các lỗ nối thông nhau<\/span>\n      <div class=\"view-btns\">\n        <button class=\"btn\" id=\"viewTop\">Nhìn từ trên<\/button>\n        <button class=\"btn\" id=\"viewPersp\">Góc nghiêng<\/button>\n      <\/div>\n    <\/div>\n    <section class=\"card report\" id=\"report\">\n      <div class=\"rep-head\">\n        <div><div class=\"eyebrow\">Báo cáo thực hành<\/div><h2 class=\"rep-title\">Mạch khuếch đại đảo<\/h2><\/div>\n        <div class=\"row\"><button class=\"btn\" id=\"btnCopy\">Sao chép báo cáo<\/button><button class=\"btn primary\" id=\"btnGrade\">Chấm điểm<\/button><\/div>\n      <\/div>\n      <div class=\"grp\">\n        <label class=\"gl\" for=\"grpNo\">Nhóm<input id=\"grpNo\" inputmode=\"numeric\"><\/label>\n        <label class=\"gl\" for=\"stClass\">Lớp<input id=\"stClass\"><\/label>\n        <div class=\"grp-names\" id=\"grpList\"><\/div>\n      <\/div>\n      <h3>1. Đo điện áp lối ra U<sub>ra<\/sub> khi thay đổi điện áp lối vào U<sub>vào<\/sub><\/h3>\n      <div class=\"rep-tables\" id=\"tables\"><\/div>\n      <h3>2. Đánh giá kết quả và kết luận<\/h3>\n      <div class=\"rep-q\">\n        <label for=\"q1\">Mạch điện hoạt động có đúng yêu cầu không?<textarea id=\"q1\" rows=\"2\"><\/textarea><\/label>\n        <label for=\"q2\">Giá trị điện áp U<sub>ra<\/sub> đo được có bị sai số so với tính trực tiếp bằng công thức của mạch khuếch đại đảo hay không?<textarea id=\"q2\" rows=\"2\"><\/textarea><\/label>\n      <\/div>\n      <div class=\"score\" id=\"score\">\n        <div><b id=\"sc1\">–<\/b><span>Lắp mạch /4<\/span><\/div>\n        <div><b id=\"sc2\">–<\/b><span>Ura đo được /3<\/span><\/div>\n        <div><b id=\"sc3\">–<\/b><span>Ura tính /3<\/span><\/div>\n        <div class=\"total\"><b id=\"sc4\">–<\/b><span>Tổng /10<\/span><\/div>\n      <\/div>\n      <ul class=\"check-list\" id=\"gradeList\"><\/ul>\n    <\/section>\n  <\/section>\n\n  <aside class=\"panel right\">\n    <section class=\"card schem\">\n      <h2>Sơ đồ nguyên lí <small>Hình 20.1<\/small><\/h2>\n      <div id=\"schem\"><\/div>\n      <details>\n        <summary class=\"small\" style=\"cursor:pointer\">Sơ đồ chân IC LM741 (nhìn từ trên)<\/summary>\n        <svg viewBox=\"0 0 300 120\" role=\"img\" aria-label=\"Sơ đồ chân IC LM741\">\n          <rect x=\"70\" y=\"30\" width=\"160\" height=\"60\" rx=\"4\" class=\"fillw\"/>\n          <path d=\"M70 50 a10 10 0 0 1 0 20\" class=\"str\"/>\n          <circle cx=\"85\" cy=\"78\" r=\"4\" class=\"dot\"/>\n          <g class=\"lbl\">\n            <text x=\"82\" y=\"22\" text-anchor=\"middle\">8<\/text><text x=\"122\" y=\"22\" text-anchor=\"middle\">7<\/text><text x=\"162\" y=\"22\" text-anchor=\"middle\">6<\/text><text x=\"202\" y=\"22\" text-anchor=\"middle\">5<\/text>\n            <text x=\"82\" y=\"106\" text-anchor=\"middle\">1<\/text><text x=\"122\" y=\"106\" text-anchor=\"middle\">2<\/text><text x=\"162\" y=\"106\" text-anchor=\"middle\">3<\/text><text x=\"202\" y=\"106\" text-anchor=\"middle\">4<\/text>\n          <\/g>\n          <g class=\"pin\">\n            <text x=\"122\" y=\"44\" text-anchor=\"middle\">V+<\/text><text x=\"162\" y=\"44\" text-anchor=\"middle\">Ra<\/text><text x=\"82\" y=\"44\" text-anchor=\"middle\">NC<\/text><text x=\"202\" y=\"44\" text-anchor=\"middle\">OS<\/text>\n            <text x=\"122\" y=\"84\" text-anchor=\"middle\">−<\/text><text x=\"162\" y=\"84\" text-anchor=\"middle\">+<\/text><text x=\"202\" y=\"84\" text-anchor=\"middle\">V−<\/text>\n          <\/g>\n          <text x=\"262\" y=\"64\" class=\"lbl\">LM741<\/text>\n          <text x=\"8\" y=\"64\" class=\"lbl\">khuyết<\/text>\n        <\/svg>\n      <\/details>\n    <\/section>\n\n    <section class=\"card\">\n      <h2>Nguồn điện<\/h2>\n      <div class=\"power\">\n        <div><b>Nguồn ±12 V<\/b><div class=\"small muted\">Bật sau khi đã kiểm tra mạch<\/div><\/div>\n        <button class=\"switch\" id=\"pwr\" role=\"switch\" aria-checked=\"false\" aria-label=\"Bật/tắt nguồn\"><\/button>\n      <\/div>\n      <div class=\"src-ctl\">\n        <span class=\"small\">Hộp pin 1,5 V × 3 cấp Uvào: gạt công tắc chọn số pin mắc nối tiếp, bấm đảo cực để có Uvào âm<\/span>\n        <div class=\"row\" id=\"pinSel\">\n          <button class=\"btn\" data-n=\"0\" aria-pressed=\"false\">0 pin<\/button>\n          <button class=\"btn\" data-n=\"1\" aria-pressed=\"true\">1 pin<\/button>\n          <button class=\"btn\" data-n=\"2\" aria-pressed=\"false\">2 pin<\/button>\n          <button class=\"btn\" data-n=\"3\" aria-pressed=\"false\">3 pin<\/button>\n        <\/div>\n        <button class=\"btn\" id=\"polBtn\" aria-pressed=\"false\">Đảo cực pin: Thuận (+)<\/button>\n      <\/div>\n    <\/section>\n\n    <section class=\"card\">\n      <h2>Đồng hồ vạn năng <small>số<\/small><\/h2>\n      <div class=\"meter-read\" aria-live=\"polite\"><b id=\"mRead\">&nbsp;<\/b><span id=\"mUnit\"><\/span><\/div>\n      <div class=\"dial\" id=\"dial\"><\/div>\n      <div class=\"probe-row\">\n        <button class=\"btn\" id=\"probeRed\"><i class=\"pdot\" style=\"background:#d62828\"><\/i>Đặt que đỏ<\/button>\n        <button class=\"btn\" id=\"probeBlack\"><i class=\"pdot\" style=\"background:#222\"><\/i>Đặt que đen<\/button>\n      <\/div>\n      <button class=\"btn\" id=\"probeHome\">Thu que đo về<\/button>\n      <div class=\"small muted\" id=\"probeInfo\">Que đỏ: chưa đặt · Que đen: chưa đặt<\/div>\n    <\/section>\n\n  <\/aside>\n<\/main>\n\n<script src=\"https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js\"><\/script>\n<script src=\"https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js\"><\/script>\n<script>\n(function(){\n\"use strict\";\nconst $=s=>document.querySelector(s);\nconst V3=THREE.Vector3;\n\n/* ---------- Nhiệm vụ ---------- */\nconst TASKS={\n 1:{name:\"Khuếch đại đảo\",short:\"KĐ ĐẢO\",uin:[0,1.5,3,-1.5,-3],steps:[\n  \"<b>Bước 1.<\/b> Chuẩn bị: kéo đúng linh kiện từ khay thả lên bo mạch (điện trở 1 kΩ, điện trở 2,2 kΩ, IC LM741, dây nối). Chỗ thả là chân thứ nhất, sau đó bấm lỗ để cắm chân còn lại.\",\n  \"<b>Bước 2.<\/b> Lắp ráp như Hình 20.2: cắm IC vắt qua rãnh giữa, chấm tròn (chân 1) ở góc trái phía dưới.\",\n  \"Nối chân 7 lên thanh +12 V, chân 4 xuống thanh −12 V, chân 3 xuống thanh GND.\",\n  \"Lắp R1 = 1 kΩ từ cột dây pin (cột 3, dây xanh) đến cột chân 2; lắp R2 = 2,2 kΩ từ cột chân 2 đến cột chân 6.\",\n  \"<b>Bước 3.<\/b> Kiểm tra mạch lắp ráp: bấm “Kiểm tra mạch”, sửa hết lỗi.\",\n  \"<b>Bước 4.<\/b> Bật nguồn ±12 V. Gạt hộp pin để có Uvào = 0; 1,5; 3 V, bấm đảo cực pin để có −1,5; −3 V cấp tới chân 2.\",\n  \"Vặn đồng hồ sang ⎓V (hoặc AUTO V), que đen đặt ở thanh GND, que đỏ đo Uvào (cột dây pin) rồi đo Ura (cột chân 6). Đo hai lần cho mỗi thực nghiệm.\",\n  \"<b>Bước 5.<\/b> Hoàn thành báo cáo thực hành bên dưới: ghi Ura đo được, Ura tính theo công thức, nhận xét, rồi bấm “Chấm điểm”.\"]}\n};\n\n/* ---------- Khay linh kiện ---------- */\nconst BAND={black:\"#1b1b1b\",brown:\"#7b3f12\",red:\"#c62828\",orange:\"#ef7d10\",yellow:\"#f2c40f\",green:\"#2e8b3e\",blue:\"#1f5fbf\",violet:\"#7b3fa0\",grey:\"#8a8a8a\",white:\"#f4f4f4\",gold:\"#c9a227\"};\nconst LIB={\n ic:{type:\"ic\",name:\"IC LM741\"},\n r1k:{type:\"res\",name:\"Điện trở 1 kΩ\",ohm:1000,bands:[\"brown\",\"black\",\"red\",\"gold\"]},\n r2k2:{type:\"res\",name:\"Điện trở 2,2 kΩ\",ohm:2200,bands:[\"red\",\"red\",\"red\",\"gold\"]},\n r10k:{type:\"res\",name:\"Điện trở 10 kΩ\",ohm:10000,bands:[\"brown\",\"black\",\"orange\",\"gold\"]},\n r4k7:{type:\"res\",name:\"Điện trở 4,7 kΩ\",ohm:4700,bands:[\"yellow\",\"violet\",\"red\",\"gold\"]},\n r100:{type:\"res\",name:\"Điện trở 100 Ω\",ohm:100,bands:[\"brown\",\"black\",\"brown\",\"gold\"]},\n cap:{type:\"cap\",name:\"Tụ hoá 100 µF\"},\n led:{type:\"led\",name:\"LED đỏ\"},\n wire:{type:\"wire\",name:\"Dây nối\"}\n};\nconst WIRE_COLORS=[[\"#d62828\",\"đỏ\"],[\"#222222\",\"đen\"],[\"#1f5fbf\",\"xanh dương\"],[\"#2e8b3e\",\"xanh lá\"],[\"#f2c40f\",\"vàng\"],[\"#ef7d10\",\"cam\"]];\n\n/* ---------- Bo mạch cắm ---------- */\nconst ROWS={a:-5.5,b:-4.5,c:-3.5,d:-2.5,e:-1.5,f:1.5,g:2.5,h:3.5,i:4.5,j:5.5};\nconst RAILS={tv:-8.5,tg:-7.5,bg:7.5,bm:8.5};\nconst RAIL_NAME={tv:\"+12 V\",tg:\"thanh phụ (chưa nối nguồn)\",bg:\"GND\",bm:\"−12 V\"};\nconst NC=30;\nconst colX=c=>(c-15.5);\nconst HOLES=new Map();\nfor(let c=1;c<=NC;c++){\n  for(const r in ROWS) HOLES.set(r+c,{id:r+c,x:colX(c),z:ROWS[r],row:r,col:c,rail:false});\n  for(const r in RAILS) HOLES.set(r+c,{id:r+c,x:colX(c),z:RAILS[r],row:r,col:c,rail:true});\n}\nconst HOLE_LIST=[...HOLES.values()];\nfunction baseNet(id){const h=HOLES.get(id);if(h.rail)return h.row;return(\"abcde\".includes(h.row)?\"T\":\"B\")+h.col;}\nconst hp=(id,y=0)=>{const h=HOLES.get(id);return new V3(h.x,y,h.z);};\n\n/* ---------- Trạng thái ---------- */\nconst S={hold:false,holdVal:null,task:1,tool:\"select\",lib:null,wireColor:\"#d62828\",pending:null,objs:[],nid:1,sel:null,undo:[],\n  power:false,pins:1,pol:1,vin:1.583,dial:\"OFF\",probe:{red:null,black:null},check:{1:null,2:null}};\nconst BAT=[1.583,1.556,1.604];const vinOf=n=>BAT.slice(0,n).reduce((a,b)=>a+b,0);\nconst VP=12.03,VN=-11.97,VSATP=10.85,VSATN=-10.62,AOL=2e5;\n\n/* Dây cố định của nguồn ±12 V và nguồn tín hiệu */\nconst SUP={x:-5,z:-15.6};      // tâm khối nguồn\nconst SUPT={p:new V3(-10,1.95,-14.6),g:new V3(-6,1.95,-14.6),n:new V3(-2,1.95,-14.6)};\nconst SRC={x:-22.6,z:1.5};\nconst SRCT={p:new V3(-20.3,1.15,4.4),g:new V3(-21.5,1.15,4.4)};\nconst FIXED=[\n {hole:\"tv1\",src:\"V+\",from:SUPT.p,color:\"#d62828\",via:new V3(-15,4,-12)},\n {hole:\"bg1\",src:\"GND\",from:SUPT.g,color:\"#222222\",via:new V3(-19,4,2)},\n {hole:\"bm1\",src:\"V-\",from:SUPT.n,color:\"#d62828\",via:new V3(-19.5,4.5,4)},\n {hole:\"e3\",src:\"VIN\",from:SRCT.p,color:\"#1f5fbf\",via:new V3(-17,3.2,1.5)},\n {hole:\"bg2\",src:\"GND\",from:SRCT.g,color:\"#222222\",via:new V3(-18,3,7.5)}\n];\nconst fixedHoles=new Set(FIXED.map(f=>f.hole));\n\n/* ---------- Mạng điện ---------- */\nfunction buildNets(ex){\n  const p={};\n  const f=x=>{if(p[x]===undefined)p[x]=x;while(p[x]!==x){p[x]=p[p[x]];x=p[x];}return x;};\n  for(const o of S.objs) if(o.type===\"wire\"&&o.id!==ex){const a=f(baseNet(o.holes[0])),b=f(baseNet(o.holes[1]));if(a!==b)p[a]=b;}\n  return id=>f(baseNet(id));\n}\nfunction pinHole(ic,n){const c=ic.col;return n<=4?(\"f\"+(c+n-1)):(\"e\"+(c+8-n));}\nfunction srcMap(R){const m={};for(const f of FIXED){const r=R(f.hole);(m[r]||(m[r]=new Set())).add(f.src);}return m;}\n\nfunction gauss(M,N){\n  for(let c=0;c<N;c++){\n    let p=c,mx=Math.abs(M[c][c]);\n    for(let r=c+1;r<N;r++){const v=Math.abs(M[r][c]);if(v>mx){mx=v;p=r;}}\n    if(mx<1e-18)continue;\n    if(p!==c){const t=M[p];M[p]=M[c];M[c]=t;}\n    for(let r=0;r<N;r++){if(r===c)continue;const fct=M[r][c]/M[c][c];if(!fct)continue;for(let k=c;k<=N;k++)M[r][k]-=fct*M[c][k];}\n  }\n  const x=new Float64Array(N);for(let i=0;i<N;i++)x[i]=Math.abs(M[i][i])<1e-18?0:M[i][N]/M[i][i];return x;\n}\nfunction solve(n,elems){\n  const nv=elems.filter(e=>e.t===\"V\"||e.t===\"E\").length,N=n+nv;\n  const M=Array.from({length:N},()=>new Float64Array(N+1));\n  const add=(r,c,v)=>{if(r>=0&&c>=0)M[r][c]+=v;};\n  for(let i=0;i<n;i++)M[i][i]+=1e-9;\n  let k=n;\n  for(const e of elems){\n    if(e.t===\"R\"){add(e.a,e.a,e.g);add(e.b,e.b,e.g);add(e.a,e.b,-e.g);add(e.b,e.a,-e.g);}\n    else if(e.t===\"I\"){if(e.p>=0)M[e.p][N]+=e.i;}\n    else if(e.t===\"V\"){add(e.p,k,1);add(k,e.p,1);M[k][N]=e.v;k++;}\n    else if(e.t===\"E\"){add(e.o,k,1);add(k,e.o,1);add(k,e.p,-e.A);add(k,e.m,e.A);M[k][k]+=1e-12;k++;}\n  }\n  return gauss(M,N);\n}\n\n/* Mô phỏng mạch một chiều với IC lí tưởng hoá có bão hoà */\nfunction simulate(vin,powerOn){\n  const R=buildNets(),src=srcMap(R);\n  const res=S.objs.filter(o=>o.type===\"res\").map(o=>({a:R(o.holes[0]),b:R(o.holes[1]),r:o.actual,o}));\n  const ics=S.objs.filter(o=>o.type===\"ic\").map(o=>{const p=[null];for(let n=1;n<=8;n++)p.push(R(pinHole(o,n)));return{o,p};});\n  let short=null;\n  const act=x=>powerOn||x===\"GND\"||x===\"VIN\";\n  for(const r in src){const a=[...src[r]].filter(act);if(a.length>1){short=a;break;}}\n  const isG=r=>!!(src[r]&&src[r].has(\"GND\"));\n  if(short)return{R,src,res,ics,short,V:()=>0,isG};\n  const idx=new Map();const gi=r=>{if(isG(r))return -1;if(!idx.has(r))idx.set(r,idx.size);return idx.get(r);};\n  const base=[];\n  for(const r in src){const s=src[r];if(s.has(\"VIN\"))base.push({t:\"V\",p:gi(r),v:vin});else if(powerOn&&s.has(\"V+\"))base.push({t:\"V\",p:gi(r),v:VP});else if(powerOn&&s.has(\"V-\"))base.push({t:\"V\",p:gi(r),v:VN});}\n  for(const x of res)base.push({t:\"R\",a:gi(x.a),b:gi(x.b),g:1/x.r});\n  const ops=[];\n  for(const ic of ics){\n    const p=ic.p;const s7=src[p[7]],s4=src[p[4]];\n    const powered=powerOn&&s7&&s7.has(\"V+\")&&s4&&s4.has(\"V-\");\n    if(powered&&!src[p[6]])ops.push({o:gi(p[6]),p:gi(p[3]),m:gi(p[2]),st:\"lin\"});\n  }\n  const n=idx.size;let x=null;\n  for(let it=0;it<4;it++){\n    const el=base.slice();\n    for(const op of ops){if(op.st===\"lin\")el.push({t:\"E\",o:op.o,p:op.p,m:op.m,A:AOL});else el.push({t:\"V\",p:op.o,v:op.st===\"hi\"?VSATP:VSATN});}\n    x=solve(n,el);\n    let changed=false;\n    for(const op of ops){if(op.st===\"lin\"&&op.o>=0){const v=x[op.o];if(v>VSATP){op.st=\"hi\";changed=true;}else if(v<VSATN){op.st=\"lo\";changed=true;}}}\n    if(!changed)break;\n  }\n  const V=r=>isG(r)?0:(idx.has(r)?x[idx.get(r)]:0);\n  return{R,src,res,ics,short:null,V,isG};\n}\nfunction ohms(red,black){\n  const R=buildNets();const rr=R(red),rb=R(black);if(rr===rb)return 0;\n  const idx=new Map();const gi=r=>{if(r===rb)return -1;if(!idx.has(r))idx.set(r,idx.size);return idx.get(r);};\n  const el=[];gi(rr);\n  for(const o of S.objs)if(o.type===\"res\")el.push({t:\"R\",a:gi(R(o.holes[0])),b:gi(R(o.holes[1])),g:1/o.actual});\n  el.push({t:\"I\",p:gi(rr),i:1e-3});\n  const x=solve(idx.size,el);return x[idx.get(rr)]/1e-3;\n}\n\n/* ---------- Kiểm tra mạch ---------- */\nfunction checkCircuit(task){\n  const R=buildNets(),src=srcMap(R);const out=[];let ok=true;\n  const has=(r,s)=>!!(src[r]&&src[r].has(s));\n  const fail=t=>{out.push({ok:false,t});ok=false;},pass=t=>out.push({ok:true,t});\n  for(const r in src)if(src[r].size>1){fail(\"Chập nguồn: \"+[...src[r]].map(s=>s===\"V-\"?\"−12 V\":s===\"V+\"?\"+12 V\":s===\"VIN\"?\"cực + của pin\":\"GND\").join(\" nối thẳng với \")+\".\");}\n  const ics=S.objs.filter(o=>o.type===\"ic\");\n  if(ics.length!==1){fail(ics.length?\"Trên bo chỉ cần 1 IC LM741.\":\"Chưa cắm IC LM741.\");return{ok:false,out};}\n  pass(\"Đã cắm IC LM741 vắt qua rãnh giữa.\");\n  const ic=ics[0],p=[null];for(let n=1;n<=8;n++)p.push(R(pinHole(ic,n)));\n  if(has(p[7],\"V-\")&&has(p[4],\"V+\"))fail(\"IC bị cấp nguồn ngược: chân 7 phải nối +12 V, chân 4 nối −12 V.\");\n  else{has(p[7],\"V+\")?pass(\"Chân 7 đã nối +12 V.\"):fail(\"Chân 7 chưa nối với thanh +12 V.\");\n       has(p[4],\"V-\")?pass(\"Ch able.castShadow=true;scene.add(pr.cable);\n}\n\n/* Linh kiện đã cắm */\nconst placed=new THREE.Group();scene.add(placed);\nfunction buildRes(o){\n  const A=hp(o.holes[0]),B=hp(o.holes[1]);const g=new THREE.Group();\n  const dx=B.x-A.x,dz=B.z-A.z,len=Math.hypot(dx,dz),ux=dx/len,uz=dz/len,h=.42,L=Math.min(2.0,len-0.9);\n  const mid=new V3((A.x+B.x)/2,h,(A.z+B.z)/2);\n  const e1=new V3(mid.x-ux*L/2,h,mid.z-uz*L/2),e2=new V3(mid.x+ux*L/2,h,mid.z+uz*L/2);\n  g.add(polyTube([A.clone().setY(-.25),A.clone().setY(h),e1],.045,MAT.lead,6));\n  g.add(polyTube([B.clone().setY(-.25),B.clone().setY(h),e2],.045,MAT.lead,6));\n  const bg=new THREE.Group();bg.position.copy(mid);bg.rotation.y=-Math.atan2(dz,dx);\n  const body=new THREE.Mesh(new THREE.CylinderGeometry(.26,.26,L*.82,20),MAT.resBody);body.rotation.z=Math.PI/2;bg.add(body);\n  for(const s of [-1,1]){const cap=new THREE.Mesh(new THREE.SphereGeometry(.3,16,12),MAT.resBody);cap.scale.set(.7,1,1);cap.position.x=s*L*.41;bg.add(cap);}\n  const pos=[-.3,-.16,-.02,.28];\n  LIB[o.key].bands.forEach((b,i)=>{const m=new THREE.Mesh(new THREE.CylinderGeometry(.272,.272,.11,20),bandMat[b]);m.rotation.z=Math.PI/2;m.position.x=pos[i]*L;bg.add(m);});\n  g.add(bg);return g;\n}\nfunction buildStand(o){\n  const A=hp(o.holes[0]),B=hp(o.holes[1]);const g=new THREE.Group();\n  const mid=new V3((A.x+B.x)/2,0,(A.z+B.z)/2);const d=new V3(B.x-A.x,0,B.z-A.z).normalize();\n  const isCap=o.type===\"cap\";const foot=isCap?.45:.35;\n  const fa=mid.clone().addScaledVector(d,-.16).setY(foot),fb=mid.clone().addScaledVector(d,.16).setY(foot);\n  g.add(polyTube([A.clone().setY(-.25),A.clone().setY(.2),fa],.04,MAT.lead,6));\n  g.add(polyTube([B.clone().setY(-.25),B.clone().setY(.2),fb],.04,MAT.lead,6));\n  if(isCap){const b=new THREE.Mesh(new THREE.CylinderGeometry(.48,.48,1.3,24),colorMat(\"#24407a\"));b.position.set(mid.x,foot+.65,mid.z);g.add(b);\n    const s=new THREE.Mesh(new THREE.CylinderGeometry(.485,.485,1.2,24,1,true,-0.5,1),colorMat(\"#c9d0da\"));s.position.copy(b.position);s.rotation.y=-Math.atan2(d.z,d.x)+Math.PI/2;g.add(s);\n    const t=new THREE.Mesh(new THREE.CylinderGeometry(.44,.44,.04,24),MAT.lead);t.position.set(mid.x,foot+1.31,mid.z);g.add(t);}\n  else{const m=new THREE.MeshStandardMaterial({color:0xd8261e,roughness:.2,transparent:true,opacity:.85});\n    const b=new THREE.Mesh(new THREE.CylinderGeometry(.27,.3,.5,20),m);b.position.set(mid.x,foot+.25,mid.z);\n    const dm=new THREE.Mesh(new THREE.SphereGeometry(.27,20,12,0,Math.PI*2,0,Math.PI/2),m);dm.position.set(mid.x,foot+.5,mid.z);g.add(b,dm);}\n  return g;\n}\nconst icLabel=canvasTex(256,128,(g,w,h)=>{g.fillStyle=\"#1d1d20\";g.fillRect(0,0,w,h);g.fillStyle=\"#cfd2d6\";g.font=\"600 34px 'JetBrains Mono', monospace\";g.textAlign=\"center\";g.fillText(\"LM741CN\",w/2+10,62);g.font=\"500 22px 'JetBrains Mono', monospace\";g.fillStyle=\"#9aa0a6\";g.fillText(\"2241\",w/2+10,98);});\nfunction buildIC(o){\n  const g=new THREE.Group();const x0=colX(o.col),x3=colX(o.col+3);const cx=(x0+x3)/2;\n  const body=new THREE.Mesh(new THREE.BoxGeometry(3.8,.55,2.1),MAT.icBody);body.position.set(cx,.62,0);g.add(body);\n  const lab=new THREE.Mesh(new THREE.PlaneGeometry(3.4,1.7),new THREE.MeshStandardMaterial({map:icLabel.tex,roughness:.7}));lab.rotation.x=-Math.PI/2;lab.position.set(cx,.902,0);g.add(lab);\n  const notch=new THREE.Mesh(new THREE.CircleGeometry(.28,20,-Math.PI/2,Math.PI),MAT.dark);notch.rotation.x=-Math.PI/2;notch.position.set(x0-1.9+0.001,.905,0);g.add(notch);\n  const dot=new THREE.Mesh(new THREE.CircleGeometry(.13,16),new THREE.MeshStandardMaterial({color:0x3a3a3e}));dot.rotation.x=-Math.PI/2;dot.position.set(x0-.15,.906,.62);g.add(dot);\n  for(let n=1;n<=8;n++){const h=HOLES.get(pinHole(o,n));const sz=Math.sign(h.z);\n    g.add(polyTube([new V3(h.x,.55,sz*1.0),new V3(h.x,.55,h.z),new V3(h.x,-.25,h.z)],.06,MAT.lead,4));}\n  return g;\n}\nfunction buildWire(o){\n  const A=hp(o.holes[0]),B=hp(o.holes[1]);const len=A.distanceTo(B);const g=new THREE. ctor2(),plane=new THREE.Plane(new V3(0,1,0),0);\nfunction setMouse(e){const r=canvas.getBoundingClientRect();mouse.set(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1);ray.setFromCamera(mouse,camera);}\nfunction holeAtRay(){const p=new V3();if(!ray.ray.intersectPlane(plane,p))return null;let best=null,bd=.5;for(const h of HOLE_LIST){const d=Math.hypot(h.x-p.x,h.z-p.z);if(d<bd){bd=d;best=h;}}return best;}\nlet down=null,hoverHole=null;\ncanvas.addEventListener(\"pointerdown\",e=>{down={x:e.clientX,y:e.clientY};});\ncanvas.addEventListener(\"pointermove\",e=>{\n  setMouse(e);const h=holeAtRay();hoverHole=h;\n  if(h){hoverM.position.set(h.x,.02,h.z);hoverM.visible=true;showNet(h.id);\n    const occ=occupied(h.id);\n    $(\"#hoverInfo\").textContent=h.rail?`Thanh nguồn ${RAIL_NAME[h.row]}, cột ${h.col} · cả hàng nối thông nhau`+(occ?` · đang cắm: ${occ}`:\"\"):\n      `Lỗ ${h.row}${h.col} · nối thông với các lỗ ${\"abcde\".includes(h.row)?\"a–e\":\"f–j\"} cùng cột ${h.col}`+(occ?` · đang cắm: ${occ}`:\"\");}\n  else{hoverM.visible=false;showNet(null);}\n});\ncanvas.addEventListener(\"pointerleave\",()=>{hoverM.visible=false;showNet(null);});\ncanvas.addEventListener(\"pointerup\",e=>{if(!down)return;const moved=Math.hypot(e.clientX-down.x,e.clientY-down.y);down=null;if(moved>6)return;setMouse(e);onClick();});\n\nfunction onClick(){\n  const h=holeAtRay();\n  if(S.locked&&S.tool!==\"select\"){setTool(\"select\");toast(\"Đã hết giờ, không thể thao tác thêm.\",true);return;}\n  if(S.tool===\"probe-red\"||S.tool===\"probe-black\"){\n    if(!h){toast(\"Đặt que đo vào một lỗ trên bo mạch.\");return;}\n    const k=S.tool===\"probe-red\"?\"red\":\"black\";S.probe[k]=h.id;placeProbe(k);setTool(\"select\");refresh();return;}\n  if(S.tool===\"place\"){\n    if(!h){toast(\"Bấm vào một lỗ trên bo mạch.\");return;}\n    const it=LIB[S.lib];\n    if(it.type===\"ic\")return placeIC(h);\n    if(!S.pending){const occ=occupied(h.id);if(occ){toast(`Lỗ ${h.id} đã có ${occ ceil((T.end-Date.now())/1000);\n  if(T.left===5*60)toast(\"Còn 5 phút! Hoàn thành phép đo và ghi kết quả.\");\n  if(T.left<=0){T.left=0;T.run=false;clearInterval(T.id);S.locked=true;setTool(\"select\");S.power=false;refresh();\n    $(\"#btnGrade\").click();toast(\"Hết 45 phút! Bài đã được chấm, thao tác lắp ráp đã khoá.\",true);}\n  drawTimer();\n}\n$(\"#tStart\").onclick=()=>{\n  if(T.left<=0)return;\n  if(T.run){T.run=false;clearInterval(T.id);T.left=Math.ceil((T.end-Date.now())/1000);}\n  else{T.run=true;T.end=Date.now()+T.left*1000;T.id=setInterval(tick,250);}\n  drawTimer();\n};\nlet resetArm=0;$(\"#tReset\").onclick=e=>{\n  if(Date.now()-resetArm>3000){resetArm=Date.now();e.target.textContent=\"Bấm lần nữa\";setTimeout(()=>e.target.textContent=\"Đặt lại\",3000);return;}\n  clearInterval(T.id);T.run=false;T.left=LIMIT;S.locked=false;resetArm=0;e.target.textContent=\"Đặt lại\";drawTimer();toast(\"Đã đặt lại thời gian 45 phút.\");\n};\nwindow.__autoStart=()=>{if(!T.run&&T.left===LIMIT&&!S.locked){$(\"#tStart\").click();toast(\"Bắt đầu tính giờ 45 phút.\");}};\ndrawTimer();\n\n/* ---------- Vòng vẽ ---------- */\nfunction resize(){const r=wrap.getBoundingClientRect();renderer.setSize(r.width,r.height,false);camera.aspect=r.width/Math.max(1,r.height);camera.updateProjectionMatrix();}\nnew ResizeObserver(resize).observe(wrap);resize();\nplaceProbe(\"red\");placeProbe(\"black\");refresh();\nconst redrawAll=()=>{boardTex.redraw();icLabel.redraw();labelTex.forEach(l=>l.redraw());refresh();};\nif(document.fonts&&document.fonts.ready)document.fonts.ready.then(redrawAll);setTimeout(redrawAll,1500);\n(function loop(t){requestAnimationFrame(loop);if(hintG.children.length)hintMat.opacity=.35+.3*Math.abs(Math.sin((t||0)/450));controls.update();renderer.render(scene,camera);})();\n})();\n<\/script>\n\n<\/body>\n<\/html>\n"};
var FILES=LESSONS;
var host=document.getElementById("lessons"),cur=null;
function show(k){
  if(!FILES[k])k="19";
  if(k===cur)return;cur=k;
  document.querySelectorAll(".tab").forEach(function(t){
    if(t.dataset.k===k)t.setAttribute("aria-current","page");else t.removeAttribute("aria-current");});
  host.innerHTML="";
  var f=document.createElement("iframe");
  f.srcdoc=FILES[k];f.title="Bài "+k;f.setAttribute("allow","fullscreen; autoplay");
  f.addEventListener("load",function(){theme(f);});
  host.appendChild(f);
}
