<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bài 20 – Các hệ thống trong động cơ đốt trong (Mô hình 3D)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/*
VOICE: xưởng thực hành kĩ thuật – mô hình là nhân vật chính, chữ tối thiểu.
IDEA: bàn trưng bày động cơ cắt bổ dưới đèn studio.
PICTURE: mô hình 3D chiếm trọn màn hình, bảng điều khiển là một khung nổi bên trái.
COLOUR and TYPE: nền studio sáng ấm, khung tím KNTT, cam động cơ cho nút chính; Be Vietnam Pro.
LAYOUT: thanh mục trên cùng; sân khấu 3D toàn màn hình; khung điều khiển trái ẩn/hiện; thanh bước ở đáy.
*/
:root{color-scheme:light dark;
--ink:light-dark(#1d1530,#ece8f2);--muted:light-dark(#6b6478,#a9a2b6);--line:light-dark(#e2dce8,#332d3d);
--panel:light-dark(#ffffff,#1d1a24);--soft:light-dark(#f5f1fa,#262130);
--side:light-dark(#241536,#18111f);--sideInk:#efe9f7;--sideMuted:#b9abcf;--sideLine:rgba(255,255,255,.1);--frame:#a77fe0;
--top:light-dark(#3a1d5a,#1e1029);--purple:light-dark(#6a2fa0,#c29df0);--orange:#ff7a1a;
--st1:light-dark(#fdfcfa,#2c2b33);--st2:light-dark(#d6d1c9,#0e0e11);--tagbg:light-dark(rgba(255,255,255,.93),rgba(30,26,38,.93))}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--st2);color:var(--ink);font:15px/1.5 "Be Vietnam Pro",system-ui,"Segoe UI",Roboto,Arial,sans-serif;overflow:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

#top{height:56px;background:var(--top);color:#fff;display:flex;align-items:center;gap:10px;padding:0 10px;position:relative;z-index:30}
.ib{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;min-width:40px;padding:0 10px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;font-weight:600;font-size:14px;white-space:nowrap}
.ib:hover{background:rgba(255,255,255,.16)}
.ib.off{background:var(--orange);border-color:var(--orange);color:#1b0f00}
@media (max-width:1360px){.brand h1{display:none}}
@media (max-width:1100px){#btnFull2 span,#btnSide span{display:none}}
.brand{display:flex;align-items:center;gap:10px;flex:none}
.brand .bai{background:var(--orange);color:#1b0f00;font-weight:700;font-size:13px;padding:4px 9px;border-radius:7px;white-space:nowrap}
.brand h1{font-size:16px;line-height:1.15;margin:0;font-weight:700;max-width:230px}
#secnav{display:flex;gap:4px;overflow-x:auto;flex:1;scrollbar-width:none;padding:0 4px}
#secnav::-webkit-scrollbar{display:none}
#secnav button{flex:none;height:38px;border-radius:9px;border:0;background:transparent;color:#e7dcf5;padding:0 11px;font-weight:600;font-size:14px;white-space:nowrap}
#secnav button b{color:#ffb27a;font-weight:700;margin-right:4px}
#secnav button:hover{background:rgba(255,255,255,.1)}
#secnav button.on{background:#fff;color:var(--top)}
#secnav button.on b{color:var(--orange)}

#app{position:relative;height:calc(100% - 56px)}
#stage{position:absolute;inset:0;overflow:hidden;background:radial-gradient(120% 95% at 55% 40%,var(--st1),var(--st2))}
#view{position:absolute;inset:0}
#view canvas{display:block;width:100%;height:100%;touch-action:none}

/* ---------- Khung bảng điều khiển (trái) ---------- */
#side{position:absolute;left:12px;top:12px;bottom:12px;width:310px;z-index:20;background:var(--side);color:var(--sideInk);
 border:2px solid var(--frame);border-radius:16px;box-shadow:0 0 0 4px rgba(167,127,224,.18),0 16px 36px rgba(20,8,40,.35);
 display:flex;flex-direction:column;overflow:hidden;transition:transform .3s ease,opacity .3s ease}
body.side-off #side{transform:translateX(calc(-100% - 30px));opacity:0;pointer-events:none}
.phead{display:flex;align-items:center;gap:8px;padding:10px 10px 10px 14px;background:linear-gradient(90deg,#4b2672,#3a1d5a);border-bottom:2px solid var(--frame);flex:none}
.phead b{flex:1;font-size:13px;letter-spacing:.02em}
.phead button{border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.1);color:#fff;border-radius:8px;height:32px;padding:0 10px;font-size:13px;font-weight:600}
.pbody{flex:1;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#5a456f transparent}
.sblock{padding:10px 12px;border-bottom:1px solid var(--sideLine)}
.shead{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--sideMuted);margin-bottom:7px}
.secTitle{font-size:16px;font-weight:700;line-height:1.25;margin:0}
.secTitle small{display:block;font-size:12px;color:#ffb27a;font-weight:600;margin-bottom:2px}
#figref{font-size:12.5px;color:var(--sideMuted);margin:8px 0 0}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{flex:1 1 auto;min-height:38px;border-radius:9px;border:1px solid var(--sideLine);background:rgba(255,255,255,.05);color:var(--sideInk);padding:6px 10px;font-size:13.5px;font-weight:600}
.seg button.on{background:#fff;color:var(--side);border-color:#fff}
.seg.bars{flex-direction:column;gap:5px}
.seg.bars button{display:flex;align-items:center;gap:9px;min-height:40px;text-align:left;font-size:14px;font-weight:600;padding:6px 10px;cursor:pointer}
.seg.bars button.on{background:rgba(255,122,26,.16);border-color:var(--orange);color:#fff}
.seg.bars button i{font-style:normal;flex:none;min-width:34px;height:24px;border-radius:6px;display:grid;place-items:center;background:rgba(255,255,255,.14);font-size:12.5px}
.seg.bars button.on i{background:var(--orange);color:#1b0f00}
.seg.bars button:not(.on):hover{background:rgba(255,255,255,.12)}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:36px;padding:0 11px;border-radius:9px;border:1px solid var(--sideLine);background:rgba(255,255,255,.07);color:var(--sideInk);font-weight:600;font-size:14px}
.btn:hover{background:rgba(255,255,255,.14)}
.btn.primary{background:var(--orange);border-color:var(--orange);color:#1b0f00}
.btn.wide{flex:1}
.btn.on{background:#3ddc84;border-color:#3ddc84;color:#062b16}
.ctl{margin:6px 0 8px}
.ctl .lab{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:500;margin-bottom:2px}
.ctl output{color:#ffb27a;font-weight:700;white-space:nowrap}
input[type=range]{width:100%;accent-color:var(--orange);height:22px}
.chk{display:flex;align-items:center;gap:8px;min-height:32px;font-size:13.5px;cursor:pointer;line-height:1.3}
.optgrid{display:grid;grid-template-columns:1fr 1fr;column-gap:8px}
.chk input{width:18px;height:18px;accent-color:var(--orange);flex:none;margin:0}
.radio{display:flex;flex-wrap:wrap;gap:5px}
.radio label{flex:1 1 calc(50% - 5px);display:flex;gap:7px;align-items:center;padding:6px 8px;border-radius:8px;border:1px solid var(--sideLine);font-size:13px;cursor:pointer;line-height:1.3}
.radio label:has(input:checked){background:rgba(255,122,26,.16);border-color:var(--orange)}
.radio input{accent-color:var(--orange);margin:2px 0 0;flex:none;width:17px;height:17px}
.note{font-size:12.5px;color:var(--sideMuted);margin:4px 0 0;line-height:1.45}
#partlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
#partlist button{width:100%;display:flex;gap:9px;align-items:center;text-align:left;border:0;background:transparent;color:var(--sideInk);padding:3px 6px;border-radius:8px;font-size:13.5px;line-height:1.3;min-height:32px}
#partlist button:hover{background:rgba(255,255,255,.08)}
#partlist button.on{background:rgba(255,178,122,.18)}
#partlist .n{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:#fff;color:var(--side);font-weight:700;font-size:12.5px}
#partlist button.on .n{background:var(--orange);color:#1b0f00}
#sideTab{position:absolute;left:0;top:50%;transform:translateY(-50%);z-index:21;border:2px solid var(--frame);border-left:0;background:var(--side);color:#fff;width:34px;height:150px;border-radius:0 12px 12px 0;display:none;place-items:center;writing-mode:vertical-rl;font-size:12px;font-weight:700;letter-spacing:.04em}
body.side-off #sideTab{display:grid}

/* ---------- Lớp phủ trên sân khấu ---------- */
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#leads{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
#leads line.h{stroke:#fff;stroke-width:4;stroke-linecap:round;opacity:.85}
#leads line.c{stroke:#3a1d5a;stroke-width:1.7;stroke-linecap:round}
#leads circle{fill:#3a1d5a;stroke:#fff;stroke-width:1.6}
#leads .lead.on line.c{stroke:var(--orange);stroke-width:2.6}
#leads .lead.on circle{fill:var(--orange)}
#leads .lead.dim{opacity:.25}
body.no-name.no-num #leads .lead:not(.hov){display:none}
.tag{position:absolute;left:0;top:0;display:flex;align-items:center;gap:5px;pointer-events:auto;cursor:pointer;white-space:nowrap;will-change:transform}
.tag .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:#fff;color:#3a1d5a;border:2px solid #3a1d5a;font-weight:700;font-size:12.5px;box-shadow:0 2px 6px rgba(0,0,0,.25);flex:none}
.tag .t{background:var(--tagbg);color:var(--ink);font-size:14px;font-weight:600;padding:4px 9px;border-radius:7px;box-shadow:0 2px 8px rgba(0,0,0,.15);border:1px solid var(--line)}
.tag.txt .n{display:none}
.tag.txt .t{background:rgba(29,21,48,.72);color:#fff;border-color:transparent;font-weight:500;font-size:12.5px;padding:2px 7px}
.tag.intk .t{background:#16a34a;color:#fff;font-weight:700}
.tag.on .n{background:var(--orange);border-color:#7a3300;color:#1b0f00;transform:scale(1.15)}
.tag.on .t{border-color:var(--orange)}
.tag.dim{opacity:.28}
body.no-num .tag .n{display:none}
body.no-name .tag:not(.intk):not(.hov){display:none}
body.no-name #leads .lead:not(.hov){display:none}
.tag.hov .n{background:var(--orange);border-color:#7a3300;color:#1b0f00;transform:scale(1.15)}
.tag.hov .t{border-color:var(--orange);box-shadow:0 0 0 2px rgba(255,140,40,.35),0 2px 8px rgba(0,0,0,.15)}
#leads .lead.hov line.c{stroke:var(--orange);stroke-width:2.6}
#leads .lead.hov circle{fill:var(--orange)}
body.no-name.hovering #tip{opacity:0!important}
body.no-name.no-num .tag:not(.hov){display:none}
#hud{display:flex;flex-direction:column;gap:7px}
.hc{background:rgba(255,255,255,.06);color:var(--sideInk);border:1px solid var(--sideLine);border-radius:10px;padding:7px 10px}
.hc .k{font-size:12px;color:var(--sideMuted);font-weight:600}
.hc .v{font-size:18px;font-weight:700;line-height:1.2;white-space:nowrap}
.hc .v small{font-size:12px;color:var(--sideMuted);font-weight:600;margin-left:3px}
.hc .bar{height:6px;border-radius:5px;background:rgba(255,255,255,.12);margin-top:5px;overflow:hidden;position:relative}
.hc .bar i{position:absolute;inset:0 auto 0 0;border-radius:5px;background:var(--orange);transition:width .2s}
.hc .s{font-size:12px;font-weight:600;margin-top:3px;line-height:1.35;filter:brightness(1.35)}
.hc canvas{display:block;width:100%;height:auto;aspect-ratio:13/6}
.eqrow{font-size:13px;padding:3px 6px;border-radius:6px;transition:background .3s;white-space:nowrap}
.eqrow.lit{background:rgba(61,220,132,.25)}
.eqrow sub{font-size:.75em}
.eqrow .cat{font-size:11px;color:var(--muted);vertical-align:super}
#legend{position:absolute;bottom:84px;display:flex;flex-wrap:wrap;gap:5px 12px;background:var(--tagbg);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:12.5px;font-weight:600;max-width:calc(100% - 360px)}
#legend:empty{display:none}
#legend span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
#legend i{width:22px;height:6px;border-radius:4px;display:inline-block}
#hint{position:absolute;top:12px;font-size:12.5px;color:var(--muted);background:var(--tagbg);border:1px solid var(--line);border-radius:9px;padding:5px 9px;pointer-events:none;transition:opacity .6s}
#tip{position:absolute;pointer-events:none;background:#1d1530;color:#fff;font-size:12.5px;font-weight:600;padding:4px 8px;border-radius:6px;opacity:0;transition:opacity .15s;white-space:nowrap;z-index:5}
#pcard{position:absolute;top:52px;background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--orange);border-radius:12px;padding:10px 40px 10px 12px;box-shadow:0 10px 30px rgba(0,0,0,.18);display:none;z-index:6;font-weight:700;font-size:15px}
#pcard.show{display:block}
#pcard b{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--orange);color:#1b0f00;font-size:13px;margin-right:8px}
#pcard .x{position:absolute;right:6px;top:6px;border:0;background:transparent;width:32px;height:32px;border-radius:8px;color:var(--muted)}
#caption{position:absolute;right:12px;bottom:12px;min-height:60px;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.14);display:flex;align-items:center;gap:8px;padding:8px}
#caption .cb{flex:none;width:44px;height:44px;border-radius:11px;border:1px solid var(--line);background:var(--soft);display:grid;place-items:center;color:var(--ink)}
#caption .cb:disabled{opacity:.35;cursor:default}
#caption .cb.play{background:var(--orange);border-color:var(--orange);color:#1b0f00}
#stText{flex:1;font-size:15px;line-height:1.4;padding:0 4px;font-weight:600}
#stText b{color:var(--purple)}
#stText .dots{display:flex;gap:4px;margin-top:5px}
#stText .dots i{width:16px;height:4px;border-radius:3px;background:var(--line)}
#stText .dots i.on{background:var(--orange)}
body.no-cap #caption{display:none}
body.no-cap #legend{bottom:12px}
#caption,#legend,#hint,#pcard{left:340px;transition:left .3s ease}
body.side-off #caption,body.side-off #legend,body.side-off #hint,body.side-off #pcard{left:12px}
body.side-off #legend{max-width:calc(100% - 24px)}
#view canvas{cursor:grab}
#view canvas:active{cursor:grabbing}
.namesBig{width:100%;margin:0 0 8px;min-height:38px;font-size:14px;justify-content:center;background:#0e9f8e;border-color:#0e9f8e;color:#fff}
.namesBig:hover{background:#12b5a2}
.namesBig.off{background:transparent;color:#5eead4;border-color:#14b8a6}
.help{margin:10px 0 0;font-size:12.5px;line-height:1.45;color:var(--muted)}
.help b{color:var(--ink)}
.tag.r .t{order:-1}
/* ---------- Trang đầu: sơ đồ tư duy ---------- */
#home{position:absolute;inset:0;z-index:30;display:none;overflow:auto;background:radial-gradient(120% 95% at 50% 0%,var(--st1),var(--st2));padding:26px clamp(14px,2.6vw,40px) 28px}
body.home #home{display:flex}
body.home #btnSide{visibility:hidden}
body.home #side,body.home #sideTab,body.home #caption,body.home #legend,body.home #labels,body.home #pcard,body.home #tip{display:none!important}
.mm{max-width:1560px;width:100%;margin:auto;display:flex;flex-direction:column;align-items:center}
.mmRoot{position:relative;text-align:center;background:linear-gradient(135deg,#3a1d5a,#6a2fa0);color:#fff;font-weight:800;font-size:clamp(19px,2.1vw,28px);letter-spacing:.02em;padding:16px 34px;border-radius:18px;box-shadow:0 12px 30px rgba(58,29,90,.32)}
.mmRoot span{display:block;font-size:13px;color:#ffb27a;letter-spacing:.1em;margin-bottom:4px}
.mmRoot::after{content:'';position:absolute;left:50%;bottom:-30px;width:4px;height:30px;margin-left:-2px;background:#8e7aae;border-radius:2px}
.mmCols{position:relative;width:100%;margin-top:30px;padding-top:28px;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:16px}
.mmCols::before{content:'';position:absolute;top:0;left:calc((100% - 80px) / 12);right:calc((100% - 80px) / 12);height:4px;background:#8e7aae;border-radius:2px}
.mmCol{position:relative;display:flex;flex-direction:column;gap:12px}
.mmCol::before{content:'';position:absolute;top:-28px;left:50%;width:4px;height:28px;margin-left:-2px;background:var(--c);border-radius:2px}
.mmHead{border:0;cursor:pointer;background:var(--c);color:#fff;border-radius:16px;padding:16px 10px 14px;display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:800;font-size:clamp(15px,1.25vw,18px);min-height:132px;box-shadow:0 10px 22px var(--c3);transition:transform .15s,box-shadow .15s}
.mmHead:hover{transform:translateY(-3px);box-shadow:0 14px 28px var(--c3)}
.mmHead svg.i{width:38px;height:38px;stroke:#fff;stroke-width:1.8}
.mmHead b{font-size:13px;background:rgba(255,255,255,.24);border-radius:7px;padding:2px 9px;letter-spacing:.04em}
.mmHead span{line-height:1.25;text-align:center}
.mmSub{position:relative;display:flex;flex-direction:column;gap:10px;margin-left:16px;padding-left:16px;border-left:4px solid var(--c2)}
.mmSub button{position:relative;cursor:pointer;text-align:left;display:flex;align-items:center;gap:8px;min-height:60px;padding:10px 11px;border-radius:12px;border:2px solid var(--c2);background:var(--c1);color:var(--ink);font-weight:650;font-size:15px;line-height:1.3;transition:background .15s,transform .15s}
.mmSub button::before{content:'';position:absolute;left:-20px;top:50%;width:18px;height:4px;margin-top:-2px;background:var(--c2)}
.mmSub button:hover{background:var(--c2);transform:translateX(3px)}
.mmSub button i{font-style:normal;flex:none;font-size:12px;font-weight:800;color:#fff;background:var(--c);border-radius:6px;padding:2px 7px}
#secnav button.homeBtn{display:inline-flex;align-items:center;gap:6px}
@media (max-width:1150px){.mmCols{grid-template-columns:repeat(3,minmax(0,1fr));row-gap:26px}.mmCols::before,.mmCol::before{display:none}.mmRoot::after{display:none}}
@media (max-width:640px){.mmCols{grid-template-columns:repeat(2,minmax(0,1fr))}.mmHead{min-height:100px}}
/* ---------- mô hình 2D (sơ đồ như SGK) ---------- */
#d2{position:absolute;left:346px;right:24px;top:14px;bottom:104px;display:none;z-index:2}
body.side-off #d2{left:20px}
body.no-cap #d2{bottom:24px}
body.d2 #d2{display:block}
body.d2 #view,body.d2 #labels{visibility:hidden}
body.d2 .chk:has(#optXray),body.d2 .chk:has(#optRot),body.d2 .chk:has(#optReal),body.d2 #btnView{display:none}
#d2 svg{width:100%;height:100%;overflow:visible;font-family:inherit}
#d2 .pt{cursor:pointer;transition:opacity .2s}
#d2 .pt.hl{filter:drop-shadow(0 0 3px #ff7a1a) drop-shadow(0 0 7px #ff9a3c)}
#d2.iso .pt:not(.sel),#d2.iso .wr,#d2.iso .gnd,#d2.iso .fl,#d2.iso .shaft,#d2.iso .lb:not(.sel),#d2.iso .arIn,#d2.iso .arOut{opacity:.13}
#d2 .lb{cursor:pointer}
#d2 .lb .ld{stroke:#5b5470;stroke-width:1.4}
#d2 .lb circle{fill:#fff;stroke:#3a1d5a;stroke-width:2.2}
#d2 .lb .num{font-weight:800;font-size:14px;fill:#3a1d5a;text-anchor:middle;dominant-baseline:central}
#d2 .lb .nm{font-weight:650;font-size:17px;fill:#1d1530;dominant-baseline:central;paint-order:stroke;stroke:#fbfaf8;stroke-width:5px;stroke-linejoin:round}
#d2 .lb.hl circle,#d2 .lb.sel circle{fill:#ff7a1a;stroke:#ff7a1a}#d2 .lb.hl .num,#d2 .lb.sel .num{fill:#fff}
body.no-name #d2 .lb .nm{display:none}
body.no-num #d2 .lb circle,body.no-num #d2 .lb .num{display:none}
body.no-flow #d2 .fl{display:none!important}
#d2 .wall{fill:none;stroke:#455a64;stroke-width:9;stroke-linejoin:round;stroke-linecap:round}
#d2 .fin{stroke:#8a939b;stroke-width:4.2;stroke-linecap:round}
#d2 .finEdge{fill:none;stroke:#6e7880;stroke-width:1.2}
#d2 .cylW{fill:#969ea6;stroke:#5c656d;stroke-width:2}

// ======================= I. HỆ THỐNG BÔI TRƠN CƯỠNG BỨC (Hình 20.2) =======================
function dialTex(max, red, unit) {
  return canvasTex(256, 256, (g) => {
    g.fillStyle = '#fbfbf8'; g.beginPath(); g.arc(128, 128, 122, 0, TAU); g.fill();
    g.lineWidth = 8; g.strokeStyle = '#2e2e33'; g.stroke();
    const A = v => (135 + v / max * 270) * Math.PI / 180;
    g.lineWidth = 14; g.strokeStyle = '#e53935'; g.beginPath(); g.arc(128, 128, 98, A(red), A(max)); g.stroke();
    g.fillStyle = '#222'; g.font = 'bold 26px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
    for (let i = 0; i <= max; i++) {
      const a = A(i); g.lineWidth = 4; g.strokeStyle = '#222'; g.beginPath();
      g.moveTo(128 + Math.cos(a) * 104, 128 + Math.sin(a) * 104); g.lineTo(128 + Math.cos(a) * 86, 128 + Math.sin(a) * 86); g.stroke();
      g.fillText(i, 128 + Math.cos(a) * 66, 128 + Math.sin(a) * 66);
    }
    g.font = 'bold 18px sans-serif'; g.fillText(unit, 128, 182);
  });
}
function gauge(p, x, y, z, max, red, unit) {
  const g = group(p, x, y, z);
  cyl(.38, .16, MT.black(), g, 0, 0, 0, 'z', 40); tor(.37, .03, MT.steel(), g, 0, 0, .08, 'z');
  M(new THREE.CircleGeometry(.33, 40), new THREE.MeshBasicMaterial({ map: dialTex(max, red, unit) }), g, 0, 0, .085);
  const nd = group(g, 0, 0, .1); box(.27, .025, .01, new THREE.MeshBasicMaterial({ color: 0xd32f2f }), nd, .11, 0, 0);
  cyl(.03, .03, MT.dark(0x111111), g, 0, 0, .1, 'z');
  return { g, set(v) { nd.rotation.z = -(135 + clamp(v, 0, max) / max * 270) * Math.PI / 180; } };
}

// van an toàn bơm dầu: kiểu pít tông (con trượt) – lò xo cứng – nút ren điều chỉnh áp suất mở
function reliefValve(p, x, y, z, flip) {
  const g = group(p, x, y, z), a = group(g, 0, 0, 0); if (flip) a.rotation.z = Math.PI;
  cyl(.15, .46, MT.glass(0xffffff, .3), a, 0, 0, 0, 'y', 24);                                        // lỗ xi lanh van trong thân bơm

function honeyTex(n, col, line, mode) {
  return canvasTex(256, 256, (g) => {
    g.fillStyle = col; g.fillRect(0, 0, 256, 256); g.strokeStyle = line; g.lineWidth = 2;

  });
}

const rgba = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; };
function buildHome() {
  $('#home').innerHTML = `<div class="mm"><div class="mmRoot"><span>BÀI 20</span>CÁC HỆ THỐNG TRONG ĐỘNG CƠ ĐỐT TRONG</div><div class="mmCols">` +
    SECTIONS.filter(s => s.models).map(s => `<div class="mmCol" style="--c:${s.color};--c1:${rgba(s.color, .1)};--c2:${rgba(s.color, .42)};--c3:${rgba(s.color, .35)}">
      <button class="mmHead" data-go="${s.id}"><svg class="i" viewBox="0 0 24 24">${s.icon}</svg><span>${esc(s.title)}</span></button>
      </div>`).join('') + `</div></div>`; // chỉ giữ 6 khối hệ thống, bỏ các mục chi tiết bên dưới
  $('#home').addEventListener('click', e => { const b = e.target.closest('[data-go]'); if (b) goHash(b.dataset.go); });
}
function goHash(h) { if (location.hash.slice(1) === h) route(); else location.hash = h; }
function route() {
  const h = (location.hash || '').slice(1);
  if (!h || h === 'so-do' || h === 'tong-quan') { document.body.classList.add('home'); $$('#secnav button').forEach(b => b.classList.toggle('on', b.dataset.sec === 'so-do')); $('#loading').classList.add('hide'); return; }
  document.body.classList.remove('home');
  let mk = null, sec = null;
  for (const k in MODELS) if (MODELS[k].hid === h) { mk = k; sec = SECTIONS.find(s => s.models && s.models.includes(k)); }
  if (!sec) sec = SECTIONS.find(s => s.id === h && s.models);
  if (!sec) { location.replace('#so-do'); return; }
  $$('#secnav button').forEach(b => b.classList.toggle('on', b.dataset.sec === sec.id));
  App.sec = sec;
  if (!window.THREE || !renderer) { $('#loading').classList.remove('hide'); return; }
  loadModel(mk || sec.models[0]);
}
function refit() { if (renderer) { resize(); setTimeout(resize, 320); } }
function wire() {
  const B = document.body;
  if (window.innerWidth < 760) B.classList.add('side-off');
  const toggleSide = on => { B.classList.toggle('side-off', on === undefined ? undefined : !on); refit(); };
  $('#btnSide').onclick = () => { B.classList.toggle('side-off'); refit(); };
  $('.brand').style.cursor = 'pointer'; $('.brand').onclick = () => goHash('so-do');
  $('#btnCloseSide').onclick = () => toggleSide(false);
  $('#sideTab').onclick = () => toggleSide(true);
  const setPlay = () => { $('#btnPlay').innerHTML = App.playing ? ICON_PAUSE + 'Tạm dừng' : ICON_PLAY + 'Chạy tiếp'; };
  setPlay();
  $('#btnPlay').onclick = () => { App.playing = !App.playing; setPlay(); };
  $('#btnReset').onclick = () => { if (App.mkey && App.model) loadModel(App.mkey); };
  $('#spd').oninput = e => { App.speed = +e.target.value; $('#spdOut').textContent = App.speed.toFixed(2).replace(/\.?0+$/, '') + '×'; };
  const setNames = on => { B.classList.toggle('no-name', !on); $('#names2Txt').textContent = on ? 'Ẩn tên chi tiết' : 'Hiện tên chi tiết'; $('#btnNames2').classList.toggle('off', !on); $('#btnNames2').setAttribute('aria-pressed', on); };
  $('#btnNames2').onclick = () => setNames(B.classList.contains('no-name'));
  setNames(false); // mặc định ẩn tên chi tiết; bấm nút để hiện khi cần
  $('#optNum').onchange = e => B.classList.toggle('no-num', !e.target.checked);
  $('#optFlow').onchange = e => { App.showFlow = e.target.checked; };
  $('#optXray').onchange = e => { App.xray = e.target.checked; if (root) applyXray(); };
  $('#optCap').onchange = e => { B.classList.toggle('no-cap', !e.target.checked); refit(); };
  $('#optRot').onchange = e => { if (controls) controls.autoRotate = e.target.checked; };
  $('#optReal').onchange = e => { App.realCrank = e.target.checked; if (App.mkey && App.model) loadModel(App.mkey); };
  $('#btnView').onclick = () => { if (App.model) setView(App.model.view); };
  const full = () => { try { if (document.fullscreenElement) document.exitFullscreen(); else { const p = document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); if (p && p.catch) p.catch(() => {}); } } catch (e) { } };
  $('#btnFull').onclick = full; $('#btnFull2').onclick = full;
  document.addEventListener('fullscreenchange', refit);
  $('#partlist').addEventListener('click', e => { const b = e.target.closest('button'); if (b) selectPart(+b.dataset.n); });
  $('#subnav').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; if (b.dataset.go) goHash(b.dataset.go); else if (b.dataset.m) goHash(MODELS[b.dataset.m].hid); });
  $('#pcX').onclick = () => { if (App.sel) selectPart(App.sel); };
  $('#stPrev').onclick = () => { App.auto = false; setStep(App.step - 1); };
  $('#stNext').onclick = () => { App.auto = false; setStep(App.step + 1); };
  $('#stAuto').onclick = () => { if (!App.model) return; App.auto = !App.auto; if (App.auto && (App.step < 0 || App.step >= (App.model.steps || []).length - 1)) setStep(0); App.autoT = 0; App.playing = true; setPlay(); renderCaption(); };
  document.addEventListener('keydown', e => {
    if (!App.model || document.body.classList.contains('home')) return;
    const tag = (document.activeElement && document.activeElement.tagName) || '';
    if (tag === 'INPUT' || tag === 'TEXTAREA') return;
    if (e.key === 'ArrowRight') { App.auto = false; setStep(App.step + 1); }
    if (e.key === 'ArrowLeft') { App.auto = false; setStep(App.step - 1); }
    if (e.key === 't' || e.key === 'T') $('#btnNames2').click();
  });
  window.addEventListener('hashchange', route);
}
function start() {
  try { initThree(); } catch (err) { console.error(err); $('#loading').classList.remove('hide'); $('#loading').textContent = 'Trình duyệt này không hiển thị được đồ hoạ 3D (WebGL). Hãy thử Chrome, Edge hoặc Firefox bản mới.'; return; }
  $('#loading').classList.add('hide');
  route(); animate();
}
buildNav(); wire();
window.__libs.then(start, () => { $('#loading').innerHTML = 'Không tải được thư viện 3D (three.js).<br>Hãy kiểm tra kết nối Internet rồi tải lại trang.'; route(); });
window.__gem = { App, MODELS, get parts() { return parts; }, get flows() { return flows; }, get cam() { return camera; }, setView };

}
