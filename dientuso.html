{const GC={AND:&quot;#0f9a8c&quot;,NAND:&quot;#2d7dd2&quot;,OR:&quot;#e08a1e&quot;,NOR:&quot;#d64f72&quot;,NOT:&quot;#7a5bd6&quot;};

/* ---------- Sơ đồ nguyên lí 2D ---------- */
function gateSVG(k){
  const AND=&#x27;&lt;path class=&quot;g&quot; d=&quot;M240 100 H285 A50 50 0 0 1 285 200 H240 Z&quot;/&gt;&#x27;;
  const OR=&#x27;&lt;path class=&quot;g&quot; d=&quot;M232 100 Q300 100 340 150 Q300 200 232 200 Q262 150 232 100 Z&quot;/&gt;&#x27;;
  const bub=x=&gt;`&lt;circle class=&quot;g&quot; cx=&quot;${x}&quot; cy=&quot;150&quot; r=&quot;7&quot;/&gt;`;
  switch(k){
    case&quot;AND&quot;:return{s:AND,tip:335,tx:278};
    case&quot;NAND&quot;:return{s:AND+bub(342),tip:349,tx:278};
    case&quot;OR&quot;:return{s:OR,tip:340,tx:282};
    case&quot;NOR&quot;:return{s:OR+bub(347),tip:354,tx:282};

/* ---------- Sơ đồ chân IC ---------- */
function renderPinout(){
  const g=GATES[S.gate],R=g.roles,P=g.pins;const used=new Set(Object.values(P));
  const px=i=&gt;92+i*56;

   &lt;rect x=&quot;58&quot; y=&quot;78&quot; width=&quot;404&quot; height=&quot;84&quot; rx=&quot;6&quot; fill=&quot;#1d1d21&quot;/&gt;&lt;path d=&quot;M58 106 a14 14 0 0 1 0 28&quot; fill=&quot;var(--paper)&quot;/&gt;
   &lt;circle cx=&quot;80&quot; cy=&quot;148&quot; r=&quot;5&quot; fill=&quot;#55555c&quot;/&gt;
   &lt;text x=&quot;260&quot; y=&quot;114&quot; text-anchor=&quot;middle&quot; style=&quot;fill:#e7e9ee;font-size:20px;font-weight:700&quot;&gt;${g.ic}&lt;/text&gt;
   &lt;text x=&quot;260&quot; y=&quot;140&quot; text-anchor=&quot;middle&quot; style=&quot;fill:#ffc34d;font-family:var(--f-body);font-size:13px;font-weight:600&quot;&gt;Bên trong có ${g.n} cổng ${g.vn} giống nhau&lt;/text&gt;`;
  for(let i=0;i&lt;7;i++){
    for(const[n,top]of[[i+1,false],[14-i,true]]){
      const x=px(i),role=R[n];const isU=used.has(n),isV=n===14,isG=n===7;
      const col=isV?&quot;var(--hi)&quot;:isG?&quot;var(--gnd)&quot;:isU?&quot;var(--accent)&quot;:&quot;var(--lo)&quot;;
      const y0=top?62:162;
      s+=`&lt;rect x=&quot;${x-7}&quot; y=&quot;${y0}&quot; width=&quot;14&quot; height=&quot;16&quot; fill=&quot;${col}&quot;/&gt;`;
      s+=`&lt;text x=&quot;${x}&quot; y=&quot;${top?54:194}&quot; text-anchor=&quot;middle&quot; style=&quot;font-size:14px;font-weight:700;fill:${isU||isV||isG?col:&quot;var(--muted)&quot;}&quot;&gt;${n}&lt;/text&gt;`;
      let tag=role;if(isU){tag=Object.keys(P).find(k=&gt;P[k]===n).toUpperCase();}
      s+=`&lt;text x=&quot;${x}&quot; y=&quot;${top?32:218}&quot; text-anchor=&quot;middle&quot; style=&quot;font-size:${isU?13:11}px;font-weight:${isU?700:500};fill:${isU||isV||isG?col:&quot;var(--muted)&quot;}&quot;&gt;${isU?tag+&quot; (&quot;+role+&quot;)&quot;:role===&quot;VCC&quot;?&quot;+5 V&quot;:role}&lt;/text&gt;`;
    }
  }
  $(&quot;#pinout&quot;).innerHTML=s+&quot;&lt;/svg&gt;&quot;;
  $(&quot;#pinTitle&quot;).textContent=g.ic+&quot; · nhìn từ trên, khuyết bên trái&quot;;
  $(&quot;#pinNote&quot;).innerHTML=`Bài này dùng cổng số 1: `+(g.one?`&lt;b&gt;chân ${P.a}&lt;/b&gt; vào (A), &lt;b&gt;chân ${P.y}&lt;/b&gt; ra (Y).`:`&lt;b&gt;chân ${P.a}, ${P.b}&lt;/b&gt; vào (A, B), &lt;b&gt;chân ${P.y}&lt;/b&gt; ra (Y).`)+
   (S.gate===&quot;NOR&quot;?&quot; Chú ý: 74HC02 khác các IC còn lại, chân ra nằm &lt;b&gt;trước&lt;/b&gt; hai chân vào.&quot;:&quot;&quot;)+` Chân 14 nối +5 V, chân 7 nối GND. Đếm chân từ chấm tròn, ngược chiều kim đồng hồ.`;
}

function renderTable(){

  for(const r of rows){
    const yy=lv(g.one?g.f(!!r[0]):g.f(!!r[0],!!r[1]));
    const cur=r[0]===lv(S.a)&amp;&amp;(g.one||r[1]===lv(S.b));const key=r.join(&quot;&quot;);
    let ycell,lcell;
    if(S.quiz){const v=S.guess[key];const cls=S.quizChecked&amp;&amp;v!==undefined?(v===yy?&quot;ok&quot;:&quot;no&quot;):&quot;&quot;;
      ycell=`&lt;td&gt;&lt;button class=&quot;qbtn ${cls}&quot; data-q=&quot;${key}&quot; aria-label=&quot;Đoán Y khi ${key}&quot;&gt;${v===undefined?&quot;?&quot;:v}&lt;/button&gt;&lt;/td&gt;`;lcell=`&lt;td&gt;&lt;span class=&quot;st&quot;&gt;?&lt;/span&gt;&lt;/td&gt;`;}
    else{ycell=`&lt;td class=&quot;${yy?&quot;y1&quot;:&quot;&quot;}&quot;&gt;${yy}&lt;/td&gt;`;lcell=`&lt;td&gt;&lt;span class=&quot;st&quot;&gt;${yy?L.on:L.off}&lt;/span&gt;&lt;/td&gt;`;}
    h+=`&lt;tr class=&quot;${cur?&quot;cur&quot;:&quot;&quot;}&quot;&gt;&lt;td&gt;${r[0]}&lt;/td&gt;${g.one?&quot;&quot;:`&lt;td&gt;${r[1]}&lt;/td&gt;`}${ycell}${lcell}&lt;/tr&gt;`;
  }
  $(&quot;#tt&quot;).innerHTML=h+&quot;&lt;/tbody&gt;&quot;;
  $(&quot;#tt&quot;).querySelectorAll(&quot;[data-q]&quot;).forEach(b=&gt;b.onclick=()=&gt;{const k=b.dataset.q;S.guess[k]=S.guess[k]===1?0:1;S.quizChecked=false;$(&quot;#qres&quot;).textContent=&quot;&quot;;renderTable();});
}
$(&quot;#quizBtn&quot;).onclick=()=&gt;{S.quiz=!S.quiz;S.guess={};S.quizChecked=false;$(&quot;#qres&quot;).textContent=&quot;&quot;;$(&quot;#quizBtn&quot;).textContent=S.quiz?&quot;Hiện đáp án&quot;:&quot;Tự đoán cột Y&quot;;$(&quot;#quizCheck&quot;).hidden=!S.quiz;renderTable();};
$(&quot;#quizCheck&quot;).onclick=()=&gt;{
  const g=GATES[S.gate];const rows=g.one?[&quot;0&quot;,&quot;1&quot;]:[&quot;00&quot;,&quot;01&quot;,&quot;10&quot;,&quot;11&quot;];
  let ok=0,miss=0;for(const k of rows){const v=S.guess[k];if(v===undefined){miss++;continue;}const yy=lv(g.one?g.f(k===&quot;1&quot;):g.f(k[0]===&quot;1&quot;,k[1]===&quot;1&quot;));if(v===yy)ok++;}
  S.quizChecked=true;renderTable();const q=$(&quot;#qres&quot;);
  if(miss){q.className=&quot;qres no&quot;;q.textContent=`Còn ${miss} ô chưa đoán.`;}
  else if(ok===rows.length){q.className=&quot;qres ok&quot;;q.textContent=`Đúng cả ${ok}/${rows.length}. Giỏi lắm!`;}
  else{q.className=&quot;qres no&quot;;q.textContent=`Đúng ${ok}/${rows.length}. Gạt công tắc trên mô hình để xem lại ô sai.`;}
};

function pushHist(){S.hist.push({A:S.a,B:S.b,Y:outY()});if(S.hist.length&gt;16)S.hist.shift();}
function renderTiming(){
  const g=GATES[S.gate],H=S.hist,sig=g.one?[&quot;A&quot;,&quot;Y&quot;]:[&quot;A&quot;,&quot;B&quot;,&quot;Y&quot;],box=$(&quot;#timing&quot;);
  const W=Math.max(420,box.clientWidth||600),Ht=Math.max(110,box.clientHeight||170);
  const x0=40,n=Math.max(H.length,12),sw=(W-x0-12)/n,rowH=(Ht-8)/sig.length,amp=Math.min(30,rowH*.55);
  let s=`&lt;svg viewBox=&quot;0 0 ${W} ${Ht}&quot; width=&quot;${W}&quot; height=&quot;${Ht}&quot; role=&quot;img&quot; aria-label=&quot;Giản đồ xung cổng ${g.vn}&quot;&gt;`;
  for(let i=1;i&lt;H.length;i++)s+=`&lt;line x1=&quot;${x0+i*sw}&quot; y1=&quot;4&quot; x2=&quot;${x0+i*sw}&quot; y2=&quot;${Ht-4}&quot; stroke=&quot;var(--line)&quot; stroke-dasharray=&quot;3 4&quot;/&gt;`;
  sig.forEach((k,r)=&gt;{const yb=r*rowH+rowH/2+amp/2+4,yt=yb-amp,isY=k===&quot;Y&quot;;
    s+=`&lt;text x=&quot;10&quot; y=&quot;${yb-amp/2+5}&quot; style=&quot;font-weight:700;font-size:16px;${isY?&quot;fill:var(--accent-2)&quot;:&quot;&quot;}&quot;&gt;${k}&lt;/text&gt;&lt;line x1=&quot;${x0}&quot; y1=&quot;${yb}&quot; x2=&quot;${W-6}&quot; y2=&quot;${yb}&quot; stroke=&quot;var(--line)&quot;/&gt;`;
    let d=&quot;&quot;;H.forEach((h,i)=&gt;{const y=h[k]?yt:yb,x=x0+i*sw;d+=(i?` L${x} ${y}`:`M${x} ${y}`)+` L${x+sw} ${y}`;});
    if(d)s+=`&lt;path d=&quot;${d}&quot; fill=&quot;none&quot; stroke=&quot;${isY?&quot;var(--accent-2)&quot;:&quot;var(--hi)&quot;}&quot; stroke-width=&quot;${isY?3:2.4}&quot; stroke-linejoin=&quot;round&quot;/&gt;`;});
  box.innerHTML=s+&quot;&lt;/svg&gt;&quot;;
}
new ResizeObserver(()=&gt;renderTiming()).observe($(&quot;#timing&quot;).parentElement);

let ac=null,gain=null;
function initAudio(){if(ac)return;try{ac=new (window.AudioContext||window.webkitAudioContext)();gain=ac.createGain();gain.gain.value=0;gain.connect(ac.destination);
  const osc=ac.createOscillator();osc.type=&quot;square&quot;;osc.frequency.value=2300;osc.connect(gain);osc.start();

function pinoutSVG(ic,hl,title){
  const R=ROLES[ic];const px=i=&gt;92+i*56;
  let s=`&lt;svg viewBox=&quot;0 0 520 236&quot; role=&quot;img&quot; aria-label=&quot;Sơ đồ chân ${ic}&quot;&gt;
   &lt;rect x=&quot;58&quot; y=&quot;78&quot; width=&quot;404&quot; height=&quot;84&quot; rx=&quot;6&quot; fill=&quot;#1d1d21&quot;/&gt;&lt;path d=&quot;M58 106 a14 14 0 0 1 0 28&quot; fill=&quot;var(--paper)&quot;/&gt;&lt;circle cx=&quot;80&quot; cy=&quot;148&quot; r=&quot;5&quot; fill=&quot;#55555c&quot;/&gt;
   &lt;text x=&quot;260&quot; y=&quot;114&quot; text-anchor=&quot;middle&quot; style=&quot;fill:#e7e9ee;font-size:20px;font-weight:700&quot;&gt;${ic}&lt;/text&gt;
   &lt;text x=&quot;260&quot; y=&quot;140&quot; text-anchor=&quot;middle&quot; style=&quot;fill:#ffc34d;font-family:var(--f-body);font-size:13px;font-weight:600&quot;&gt;${title}&lt;/text&gt;`;
  for(let i=0;i&lt;7;i++)for(const[n,top]of[[i+1,false],[14-i,true]]){
    const x=px(i),role=R[n],isV=n===14,isG=n===7,h=hl[n];
    const col=isV?&quot;var(--hi)&quot;:isG?&quot;var(--gnd)&quot;:h?&quot;var(--accent)&quot;:&quot;var(--lo)&quot;;const strong=isV||isG||h;
    s+=`&lt;rect x=&quot;${x-7}&quot; y=&quot;${top?62:162}&quot; width=&quot;14&quot; height=&quot;16&quot; fill=&quot;${col}&quot;/&gt;`;
    s+=`&lt;text x=&quot;${x}&quot; y=&quot;${top?54:194}&quot; text-anchor=&quot;middle&quot; style=&quot;font-size:14px;font-weight:700;fill:${strong?col:&quot;var(--muted)&quot;}&quot;&gt;${n}&lt;/text&gt;`;
    s+=`&lt;text x=&quot;${x}&quot; y=&quot;${top?30:216}&quot; text-anchor=&quot;middle&quot; style=&quot;font-size:${h?12:11}px;font-weight:${h?700:500};fill:${strong?col:&quot;var(--muted)&quot;}&quot;&gt;${h||(isV?&quot;+5 V&quot;:role)}&lt;/text&gt;`;
  }
  return`&lt;div class=&quot;pinout&quot;&gt;${s}&lt;/svg&gt;&lt;/div&gt;`;
}

  const ans=$(&quot;#ans&quot;);
  if(S.mode===&quot;cmp&quot;)ans.innerHTML=`&lt;h3&gt;Đầu ra C nối tải thế nào?&lt;/h3&gt;&lt;p&gt;Chân ra 74HC chỉ bảo đảm mức 1 khi lấy khoảng 4 mA (tối đa ±25 mA). &lt;b&gt;LED + 330 Ω&lt;/b&gt; (≈ 9 mA) nối thẳng được. &lt;b&gt;Bóng đèn, còi&lt;/b&gt; cần transistor: C → 1 kΩ → cực B; tải nối giữa +5 V và cực C; cực E nối GND.&lt;/p&gt;`;
  else if(S.mode===&quot;ffd&quot;)ans.innerHTML=`&lt;h3&gt;Thử nghiệm để hiểu “nhớ”&lt;/h3&gt;&lt;p&gt;1. Gạt D lên 1, &lt;b&gt;chưa bấm&lt;/b&gt; CLK: LED Q chưa sáng.&lt;br&gt;2. Bấm CLK: Q = 1, LED Q sáng.&lt;br&gt;3. Gạt D về 0, chưa bấm: Q vẫn = 1, Flip-Flop đang &lt;b&gt;nhớ&lt;/b&gt;.&lt;br&gt;4. Bấm CLK: Q = 0.&lt;/p&gt;&lt;p&gt;Chân PR̅ (đặt) và CLR̅ (xoá) tác động khi ở mức 0, nên nối +5 V. FF thứ hai không dùng: chân 10, 13 nối +5 V, chân 11, 12 nối GND để không bị nhiễu.&lt;/p&gt;`;
  else ans.innerHTML=`&lt;h3&gt;Vì sao mạch đếm được?&lt;/h3&gt;&lt;p&gt;Ở mỗi FF, D nối với Q̅ nên mỗi sườn lên CLK thì Q đảo trạng thái (chia đôi tần số). FF1 nhận xung từ Q̅0: Q̅0 có sườn lên đúng lúc Q0 chuyển 1 → 0. Q0 là bit thấp, Q1 là bit cao.&lt;/p&gt;&lt;p&gt;Nút &lt;b&gt;Xoá&lt;/b&gt; kéo chân CLR̅ (1 và 13) xuống 0 nên Q0 = Q1 = 0. Bình thường điện trở 10 kΩ giữ CLR̅ ở mức 1.&lt;/p&gt;`;
}

/* Layout: bench console — block diagram left, 3D board right, control strip below */
:root{
  --bg:#0b1033; --panel:#141b4d; --panel2:#1c2560; --line:#2d3a80; --wire:#5566b8;
  --fg:#f1f4ff; --muted:#a9b4e8; --sig:#ffd23f; --alarm:#ff4f6d; --ok:#3ee88f; --warn:#ff9f1c;
  --c1:#22d3ee; --c2:#a78bfa; --c3:#34d399; --c4:#fb923c; --c5:#f472b6;
  --f-ui:&quot;Be Vietnam Pro&quot;,system-ui,-apple-system,&quot;Segoe UI&quot;,sans-serif;
  --f-mono:&quot;JetBrains Mono&quot;,ui-monospace,&quot;SFMono-Regular&quot;,Consolas,monospace;
  color-scheme:dark;
}
html,body{background:radial-gradient(1200px 600px at 10% -10%,#2a1a6b 0%,transparent 60%),radial-gradient(1000px 600px at 110% 0%,#0b4a6b 0%,transparent 55%),var(--bg);background-attachment:fixed;color:var(--fg)}
body{font-family:var(--f-ui);font-size:14px;line-height:1.5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 28px}
.wrap{max-width:1360px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between;padding:16px 20px;border-radius:14px;background:linear-gradient(115deg,#ff5f3d 0%,#ff2e74 45%,#8b3dff 100%);box-shadow:0 10px 30px -12px rgba(255,60,110,.6)}
.lesson{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#3b1200;background:#ffd23f;padding:3px 10px;border-radius:999px;margin-bottom:6px}
h1{margin:0;font-size:clamp(18px,2.3vw,25px);font-weight:800;letter-spacing:-.01em;line-height:1.3;color:#fff;text-wrap:balance;text-shadow:0 2px 10px rgba(60,0,40,.35)}
header .pill{background:rgba(255,255,255,.95)}
.sub{margin:2px 0 0;color:var(--muted);font-size:13px}
.pill{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;font-weight:600;font-size:13px;border:1px solid var(--line);background:var(--panel)}
.pill i{width:9px;height:9px;border-radius:50%;background:var(--muted)}
.pill.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent)} .pill.ok i{background:var(--ok)}
.pill.fire{color:var(--alarm);border-color:var(--alarm);background:color-mix(in srgb,var(--alarm) 14%,var(--panel))} .pill.fire i{background:var(--alarm);animation:blink .5s steps(2) infinite}
.pill.warn{color:var(--warn);border-color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,var(--panel))} .pill.warn i{background:var(--warn);animation:blink .5s steps(2) infinite}
.pill.high{color:#fff;border-color:var(--alarm);background:var(--alarm)} .pill.high i{background:#fff;animation:blink .25s steps(2) infinite}
@keyframes blink{50%{opacity:.15}}

.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.ph{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.ph h2{margin:0;font-size:12.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--acc,var(--c1));display:flex;align-items:center;gap:8px}
.ph h2::before{content:&quot;&quot;;width:10px;height:10px;border-radius:3px;background:var(--acc,var(--c1));box-shadow:0 0 10px var(--acc,var(--c1))}
.panel{border-top:3px solid var(--acc,var(--c1))}
.ph{background:linear-gradient(90deg,color-mix(in srgb,var(--acc,var(--c1)) 16%,transparent),transparent 70%)}
.split .panel:nth-child(1){--acc:var(--c1)} .split .panel:nth-child(2){--acc:var(--c2)}
.strip .panel:nth-child(1){--acc:var(--c3)} .strip .panel:nth-child(2){--acc:var(--c4)} .strip .panel:nth-child(3){--acc:var(--c5)}
.ph span{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.diag{padding:12px;overflow-x:auto;flex:1;display:flex;align-items:center}
.swipe{display:none;margin:10px 16px 0;font-size:12px;color:var(--muted)}
@media (max-width:620px){.swipe{display:block}}
.diag svg{width:100%;min-width:560px;height:auto;display:block}
#stage{position:relative;height:500px;cursor:grab;touch-action:none}
#stage:active{cursor:grabbing}
#stage canvas{display:block}
.hint{position:absolute;left:12px;bottom:12px;font-size:12px;color:var(--muted);background:color-mix(in srgb,var(--bg) 80%,transparent);padding:5px 10px;border-radius:6px;pointer-events:none}
.tools{position:absolute;right:12px;top:12px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tools button{background:color-mix(in srgb,var(--panel) 85%,transparent)}


/* diagram */
svg text{font-family:var(--f-ui);fill:var(--fg)}
.colh{font-size:11px;font-weight:700;letter-spacing:.12em;fill:var(--muted)}
.blk{cursor:pointer}
.blk rect,.blk .g{fill:var(--panel2);stroke:var(--wire);stroke-width:1.5;transition:fill .2s,stroke .2s}
.blk .t{font-size:13px;font-weight:600}
.blk .s{font-size:10.5px;fill:var(--muted);font-family:var(--f-mono)}
.blk.on rect,.blk.on .g{stroke:var(--sig)}
.blk.alarm rect{fill:color-mix(in srgb,var(--alarm) 30%,var(--panel2));stroke:var(--alarm)}
.blk.alarm.y rect{fill:color-mix(in srgb,var(--warn) 28%,var(--panel2));stroke:var(--warn)}
.blk.sel rect,.blk.sel .g{stroke:var(--fg);stroke-width:2.5}
.blk:focus-visible{outline:none}
.blk:focus-visible rect,.blk:focus-visible .g{stroke:var(--fg);stroke-dasharray:4 3}
.w{fill:none;stroke:var(--wire);stroke-width:2.2;stroke-linejoin:round}
.w.on{stroke:var(--sig);stroke-dasharray:7 5;animation:flow .6s linear infinite}
@keyframes flow{to{stroke-dashoffset:-12}}
.j{fill:var(--wire)} .j.on{fill:var(--sig)}
.zone{fill:none;stroke:var(--line);stroke-dasharray:5 5;stroke-width:1.2}
.tag{font-family:var(--f-mono)!important;font-size:11px;fill:var(--muted)!important}
.tag.on{fill:var(--sig)!important;font-weight:600}

/* lower strip */
.strip{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) minmax(0,1fr);gap:16px}
.body{padding:16px;display:flex;flex-direction:column;gap:16px}
.sens{display:flex;flex-direction:column;gap:6px}
.sens .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sens label{font-weight:600}
.val{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:600}
.val b{font-weight:600;padding:1px 6px;border-radius:4px;margin-left:6px;font-size:11px;background:var(--panel2);color:var(--muted)}
.val b.hi{background:var(--sig);color:#1b1404}
input[type=range]{width:100%;accent-color:var(--sig)}
.scale{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);font-family:var(--f-mono)}
.btns{display:flex;flex-wrap:wrap;gap:8px}
button{font:inherit;font-weight:600;font-size:13px;color:var(--fg);background:var(--panel2);border:1px solid var(--wire);border-radius:7px;padding:8px 12px;cursor:pointer}
button:hover{border-color:var(--muted)}
button:focus-visible,input:focus-visible{outline:2px solid var(--sig);outline-offset:2px}
button[aria-pressed=true]{background:var(--sig);color:#1b1404;border-color:var(--sig)}
button.danger[aria-pressed=true]{background:var(--alarm);border-color:var(--alarm);color:#fff}
table{width:100%;border-collapse:collapse;font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:12.5px}
th,td{padding:7px 8px;text-align:center;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600;font-size:11px}
td:last-child,th:last-child{text-align:left;font-family:var(--f-ui)}
tr.cur td{background:color-mix(in srgb,var(--sig) 16%,transparent);color:var(--fg)}
.one{color:var(--sig);font-weight:600}
.eq{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.info h3{margin:0;font-size:17px}
.info .k{font-family:var(--f-mono);font-size:11px;color:var(--sig);letter-spacing:.06em;text-transform:uppercase}
.info p{margin:0;color:#dfe4ff;max-width:60ch}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{font-size:11px;font-family:var(--f-mono);padding:2px 8px;border:1px solid var(--line);border-radius:999px;color:var(--muted)}

@media (max-width:980px){.split{grid-template-columns:minmax(0,1fr)}.strip{grid-template-columns:minmax(0,1fr)}#stage{height:420px}}
@media (prefers-reduced-motion:reduce){.w.on{animation:none}.pill i{animation:none!important}}
/* ===== Gọn trong một màn hình (máy tính, máy chiếu) ===== */
@media (min-width:981px){
  body{margin:0;padding-block:10px;box-sizing:border-box}
  .wrap{height:calc(100vh - 24px);min-height:560px;gap:10px}
  header{padding:9px 16px;border-radius:12px;flex:none}
  .lesson{font-size:10.5px;padding:2px 9px;margin-bottom:3px}
  h1{font-size:clamp(17px,1.7vw,22px)}
  header .pill{padding:5px 12px}
  .split{flex:1 1 0;min-height:0;gap:10px}
  .split .panel{min-height:0}
  .ph{padding:7px 14px}
  .diag{padding:6px 10px;min-height:0}
  .diag svg{height:100%;max-height:100%;min-width:0}
  #stage{flex:1 1 0;height:auto;min-height:0}
  .hint{bottom:8px;left:8px;padding:3px 8px;font-size:11px}
  .tools{top:8px;right:8px}.tools button{padding:5px 10px;font-size:12px}
  .strip{flex:none;gap:10px;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr) minmax(0,.95fr)}
  .strip .body{padding:9px 14px;gap:7px}
  .sens{gap:1px}
  .sens label,.val{font-size:13px}
  .scale{font-size:10px}
  .btns{gap:6px}
  .btns button{padding:5px 10px;font-size:12px}
  th,td{padding:3px 6px}
  table{font-size:12px}
  .eq{font-size:11px;line-height:1.35}
  .info h3{font-size:15px}
  .info p{font-size:13px;line-height:1.45}
  .chips span{font-size:10.5px}
}
/* màn hình thấp: thu thêm */
@media (min-width:981px) and (max-height:820px){
  .sens .scale{display:none}
  .strip .body{gap:5px}
  .info p{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
}

          &lt;input type=&quot;range&quot; id=&quot;led&quot; min=&quot;5&quot; max=&quot;100&quot; value=&quot;40&quot;&gt;
          &lt;div class=&quot;scale&quot;&gt;&lt;span&gt;mờ&lt;/span&gt;&lt;span&gt;sáng&lt;/span&gt;&lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;btns&quot;&gt;
          &lt;button id=&quot;pwr&quot; aria-pressed=&quot;true&quot;&gt;Nguồn: bật&lt;/button&gt;
          &lt;button id=&quot;test&quot; class=&quot;danger&quot; aria-pressed=&quot;false&quot;&gt;Thử báo cháy&lt;/button&gt;
          &lt;button id=&quot;snd&quot; aria-pressed=&quot;true&quot;&gt;Âm thanh còi: bật&lt;/button&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;section class=&quot;panel&quot;&gt;
      &lt;div class=&quot;ph&quot;&gt;&lt;h2&gt;Bảng chân lý&lt;/h2&gt;&lt;span&gt;N = H̅ · Y₁ = S·N · Y₂ = S + N&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;body&quot;&gt;
        &lt;table&gt;
          &lt;thead&gt;&lt;tr&gt;&lt;th&gt;S&lt;/th&gt;&lt;th&gt;H&lt;/th&gt;&lt;th&gt;N&lt;/th&gt;&lt;th&gt;Y₁ LED&lt;/th&gt;&lt;th&gt;Y₂ còi&lt;/th&gt;&lt;th&gt;Kết quả&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
          &lt;tbody id=&quot;tt&quot;&gt;&lt;/tbody&gt;
        &lt;/table&gt;
        &lt;div class=&quot;eq&quot;&gt;H = 1 khi chưa cháy, H = 0 khi ≥ 60 °C&lt;br&gt;N = H̅ (qua cổng NOT) · S = 1 khi khói ≥ 50 %&lt;/div&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;section class=&quot;panel info&quot;&gt;
      &lt;div class=&quot;ph&quot;&gt;&lt;h2&gt;Linh kiện đang chọn&lt;/h2&gt;&lt;/div&gt;
      &lt;div class=&quot;body&quot;&gt;
        &lt;div&gt;&lt;div class=&quot;k&quot; id=&quot;ik&quot;&gt;&lt;/div&gt;&lt;h3 id=&quot;ih&quot;&gt;&lt;/h3&gt;&lt;/div&gt;
        &lt;p id=&quot;ip&quot;&gt;&lt;/p&gt;
        &lt;div class=&quot;chips&quot; id=&quot;ic&quot;&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/section&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;script&gt;
const $=id=&gt;document.getElementById(id);
const TH_T=60, TH_S=50;
const st={temp:25,smoke:10,power:true,test:false,sound:true,led:40,sel:&#x27;or&#x27;};

const INFO={
  power:{k:&#x27;Khối nguồn&#x27;,h:&#x27;Pin 9 V + ổn áp 7805&#x27;,p:&#x27;Cấp điện cho toàn mạch. Pin 9 V qua IC ổn áp 7805 tạo Vcc = 5 V cho cảm biến và IC số. Khi tắt nguồn, mọi tín hiệu về mức 0 và mạch không báo.&#x27;,c:[&#x27;Vcc 5 V&#x27;,&#x27;7805&#x27;,&#x27;GND chung&#x27;]},
  temp:{k:&#x27;Khối cảm biến&#x27;,h:&#x27;Cảm biến nhiệt (lối ra DO)&#x27;,p:&#x27;Theo SGK, lối ra DO của một số cảm biến nhiệt ở mức cao (H = 1) khi chưa có tín hiệu cháy và xuống mức 0 khi nhiệt độ vượt ngưỡng. Nếu nối thẳng vào cổng AND, OR thì còi hoặc LED sẽ luôn kêu/sáng, nên phải mắc thêm cổng NOT.&#x27;,c:[&#x27;lối ra DO&#x27;,&#x27;H = 0 khi ≥ 60 °C&#x27;]},
  smoke:{k:&#x27;Khối cảm biến&#x27;,h:&#x27;Cảm biến khói MQ-2&#x27;,p:&#x27;Khi có khói, điện trở lớp cảm ứng SnO₂ giảm nên điện áp ra tăng. S = 1 khi khói từ 50 % trở lên. Tín hiệu S đi vào cả cổng AND và cổng OR.&#x27;,c:[&#x27;MQ-2&#x27;,&#x27;đầu ra S&#x27;,&#x27;ngưỡng 50 %&#x27;]},
  not:{k:&#x27;Khối xử lý&#x27;,h:&#x27;Cổng NOT · IC 74HC04&#x27;,p:&#x27;Mắc với lối ra cảm biến nhiệt để đảo tín hiệu: N = H̅. Khi chưa cháy H = 1 nên N = 0; khi nóng H = 0 nên N = 1. Đầu ra N đi vào cả cổng AND và cổng OR.&#x27;,c:[&#x27;74HC04&#x27;,&#x27;N = H̅&#x27;]},
  and:{k:&#x27;Khối xử lý&#x27;,h:&#x27;Cổng AND · IC 74HC08&#x27;,p:&#x27;Y₁ = S · N. Khi có đồng thời tín hiệu báo khói và báo cháy (nhiệt độ), lối ra lên mức logic 1 làm LED phát sáng.&#x27;,c:[&#x27;74HC08&#x27;,&#x27;điều khiển LED&#x27;,&#x27;Y₁ = S·N&#x27;]},
  or:{k:&#x27;Khối xử lý&#x27;,h:&#x27;Cổng OR · IC 74HC32&#x27;,p:&#x27;Y₂ = S + N. Khi có một trong hai tín hiệu báo khói hoặc báo cháy, hoặc cả hai, lối ra lên mức logic 1 làm còi kêu.&#x27;,c:[&#x27;74HC32&#x27;,&#x27;điều khiển còi&#x27;,&#x27;Y₂ = S + N&#x27;]},
  power:{k:&#x27;Nguồn (chỉ có trên mô hình 3D)&#x27;,h:&#x27;Pin 9 V + ổn áp 7805&#x27;,p:&#x27;Hình 23.1 không vẽ khối nguồn, nhưng mạch thật cần nguồn: pin 9 V qua IC ổn áp 7805 tạo 5 V cho cảm biến và các IC. Tắt nguồn thì mọi tín hiệu về 0.&#x27;,c:[&#x27;Vcc 5 V&#x27;,&#x27;7805&#x27;]},
  amp:{k:&#x27;Linh kiện phụ (chỉ có trên mô hình 3D)&#x27;,h:&#x27;Transistor C1815&#x27;,p:&#x27;Hình 23.1 không vẽ transistor. Trên mạch thật, dòng ra của cổng OR chỉ vài mA nên thường thêm transistor để cấp đủ dòng cho còi.&#x27;,c:[&#x27;NPN&#x27;,&#x27;điện trở gốc 1 kΩ&#x27;]},
  buzzer:{k:&#x27;Khối chấp hành&#x27;,h:&#x27;Còi&#x27;,p:&#x27;Kêu khi Y₂ = S + N = 1, tức là có khói, hoặc nhiệt độ cao, hoặc cả hai.&#x27;,c:[&#x27;buzzer 5 V&#x27;,&#x27;nối cổng OR&#x27;]},
  ledR:{k:&#x27;Khối chấp hành&#x27;,h:&#x27;Đèn LED&#x27;,p:&#x27;Sáng khi Y₁ = S · N = 1, tức là có khói và nhiệt độ cao cùng lúc. Nối tiếp điện trở hạn dòng 330 Ω.&#x27;,c:[&#x27;LED 5 mm&#x27;,&#x27;330 Ω&#x27;,&#x27;nối cổng AND&#x27;]}
};

function logic(){
  const P=st.power;
  const hot=st.test||st.temp&gt;=TH_T;
  const S=P&amp;&amp;(st.test||st.smoke&gt;=TH_S);
  const H=P&amp;&amp;!hot;          // lối ra DO cảm biến nhiệt: 1 khi chưa cháy, 0 khi nóng
  const N=P&amp;&amp;hot;           // sau cổng NOT
  return {P,H,N,S,AND:S&amp;&amp;N,OR:S||N};
}

/* ---------- truth table ---------- */
const RES=[&#x27;Bình thường&#x27;,&#x27;Còi kêu&#x27;,&#x27;Còi kêu&#x27;,&#x27;Còi kêu + LED sáng&#x27;];
function renderTT(L){
  const rows=[[0,1],[1,1],[0,0],[1,0]];
  $(&#x27;tt&#x27;).innerHTML=rows.map(([sv,h],i)=&gt;{
    const n=1-h,y1=sv&amp;n,y2=sv|n,cur=L.P&amp;&amp;(+L.S===sv&amp;&amp;+L.H===h);
    const c=v=&gt;&#x27;&lt;td class=&quot;&#x27;+(v?&#x27;one&#x27;:&#x27;&#x27;)+&#x27;&quot;&gt;&#x27;+v+&#x27;&lt;/td&gt;&#x27;;
    return &#x27;&lt;tr class=&quot;&#x27;+(cur?&#x27;cur&#x27;:&#x27;&#x27;)+&#x27;&quot;&gt;&#x27;+c(sv)+c(h)+c(n)+c(y1)+c(y2)+&#x27;&lt;td&gt;&#x27;+RES[i]+&#x27;&lt;/td&gt;&lt;/tr&gt;&#x27;;
  }).join(&#x27;&#x27;);
}

/* ---------- UI sync ---------- */
function sync(){
  const L=logic();
  $(&#x27;tempv&#x27;).textContent=st.temp+&#x27; °C&#x27;;
  $(&#x27;smokev&#x27;).textContent=st.smoke+&#x27; %&#x27;;
  $(&#x27;tb&#x27;).textContent=&#x27;H=&#x27;+(+L.H); $(&#x27;tb&#x27;).classList.toggle(&#x27;hi&#x27;,L.N);
  $(&#x27;sb&#x27;).textContent=&#x27;S=&#x27;+(+L.S); $(&#x27;sb&#x27;).classList.toggle(&#x27;hi&#x27;,L.S);
  document.querySelectorAll(&#x27;[data-sig]&#x27;).forEach(el=&gt;{
    const on=!!L[el.dataset.sig];
    el.classList.toggle(&#x27;on&#x27;,on);
    if(el.classList.contains(&#x27;blk&#x27;)) el.classList.toggle(&#x27;alarm&#x27;,on&amp;&amp;el.dataset.alarm===&#x27;1&#x27;);
  });
  const tags={H:&#x27;H&#x27;,N:&#x27;N&#x27;,S:&#x27;S&#x27;,AND:&#x27;Y₁&#x27;,OR:&#x27;Y₂&#x27;};
  document.querySelectorAll(&#x27;.tag&#x27;).forEach(t=&gt;t.textContent=tags[t.dataset.sig]+&#x27;=&#x27;+(+L[t.dataset.sig]));
  const s=$(&#x27;status&#x27;);
  s.className=&#x27;pill &#x27;+(!L.P?&#x27;&#x27;:L.AND?&#x27;high&#x27;:L.OR?&#x27;fire&#x27;:&#x27;ok&#x27;);
  s.querySelector(&#x27;span&#x27;).textContent=!L.P?&#x27;Mất nguồn&#x27;:L.AND?&#x27;Cháy: còi + LED&#x27;:L.OR?&#x27;Báo động: còi kêu&#x27;:&#x27;An toàn&#x27;;
  renderTT(L);
}
function select(key){
  st.sel=key;
  document.querySelectorAll(&#x27;.blk&#x27;).forEach(b=&gt;b.classList.toggle(&#x27;sel&#x27;,b.dataset.key===key));
  const d=INFO[key];
  $(&#x27;ik&#x27;).textContent=d.k; $(&#x27;ih&#x27;).textContent=d.h; $(&#x27;ip&#x27;).textContent=d.p;
  $(&#x27;ic&#x27;).innerHTML=d.c.map(x=&gt;&#x27;&lt;span&gt;&#x27;+x+&#x27;&lt;/span&gt;&#x27;).join(&#x27;&#x27;);
  if(window.focus3D) focus3D(key);
}
document.querySelectorAll(&#x27;.blk&#x27;).forEach(b=&gt;{
  b.addEventListener(&#x27;click&#x27;,()=&gt;select(b.dataset.key));
  b.addEventListener(&#x27;keydown&#x27;,e=&gt;{if(e.key===&#x27;Enter&#x27;||e.key===&#x27; &#x27;){e.preventDefault();select(b.dataset.key)}});
});
$(&#x27;temp&#x27;).addEventListener(&#x27;input&#x27;,e=&gt;{st.temp=+e.target.value;sync()});
$(&#x27;smoke&#x27;).addEventListener(&#x27;input&#x27;,e=&gt;{st.smoke=+e.target.value;sync()});
$(&#x27;led&#x27;).addEventListener(&#x27;input&#x27;,e=&gt;{st.led=+e.target.value;$(&#x27;ledv&#x27;).textContent=st.led+&#x27; %&#x27;});
$(&#x27;pwr&#x27;).addEventListener(&#x27;click&#x27;,e=&gt;{st.power=!st.power;e.target.setAttribute(&#x27;aria-pressed&#x27;,st.power);e.target.textContent=&#x27;Nguồn: &#x27;+(st.power?&#x27;bật&#x27;:&#x27;tắt&#x27;);sync()});
$(&#x27;test&#x27;).addEventListener(&#x27;click&#x27;,e=&gt;{st.test=!st.test;e.target.setAttribute(&#x27;aria-pressed&#x27;,st.test);e.target.textContent=st.test?&#x27;Dừng thử&#x27;:&#x27;Thử báo cháy&#x27;;sync()});

/* ---------- sound ---------- */
/* Còi chạy độc lập với mô hình 3D. Trình duyệt chỉ cho phát âm sau lần chạm/bấm đầu tiên,
   nên âm thanh được mở khóa ở lần tương tác đầu tiên bất kỳ trên trang. */
let ac=null,gain=null,osc=null;
function ensureAudio(){
  try{
    if(!ac){
      const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
      ac=new AC();
      osc=ac.createOscillator(); osc.type=&#x27;square&#x27;; osc.frequency.value=2800;
      const tone=ac.createBiquadFilter(); tone.type=&#x27;lowpass&#x27;; tone.frequency.value=5000;
      gain=ac.createGain(); gain.gain.value=0;
      osc.connect(tone); tone.connect(gain); gain.connect(ac.destination); osc.start();
    }
    if(ac.state!==&#x27;running&#x27;) ac.resume();
  }catch(err){}
}
[&#x27;pointerdown&#x27;,&#x27;keydown&#x27;,&#x27;touchend&#x27;].forEach(ev=&gt;window.addEventListener(ev,()=&gt;{if(st.sound)ensureAudio()},{capture:true,passive:true}));
function setSoundBtn(){const b=$(&#x27;snd&#x27;);b.setAttribute(&#x27;aria-pressed&#x27;,st.sound);b.textContent=&#x27;Âm thanh còi: &#x27;+(st.sound?&#x27;bật&#x27;:&#x27;tắt&#x27;)}
$(&#x27;snd&#x27;).addEventListener(&#x27;click&#x27;,()=&gt;{st.sound=!st.sound;setSoundBtn();if(st.sound)ensureAudio()});
setInterval(()=&gt;{
  if(!gain) return;
  const L=logic(), now=ac.currentTime;
  const on=st.sound&amp;&amp;L.OR&amp;&amp;ac.state===&#x27;running&#x27;;
  const ph=Math.floor(now*4)%2===0;
  gain.gain.setTargetAtTime(on&amp;&amp;ph?0.25:0,now,0.004);
  },40);
setSoundBtn();

sync(); select(&#x27;or&#x27;);

/* ---------- 3D ---------- */
(function(){
  if(!window.THREE){$(&#x27;stage&#x27;).insertAdjacentHTML(&#x27;beforeend&#x27;,&#x27;&lt;div class=&quot;hint&quot; style=&quot;top:12px;bottom:auto&quot;&gt;Không tải được thư viện 3D.&lt;/div&gt;&#x27;);return}
  const wrap=$(&#x27;stage&#x27;);
  const renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setClearColor(0x0d1440);
  renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  renderer.outputEncoding=THREE.sRGBEncoding;
  wrap.prepend(renderer.domElement);

  const scene=new THREE.Scene();
  scene.fog=new THREE.Fog(0x0d1440,20,38);
  const camera=new THREE.PerspectiveCamera(38,1,0.1,100);
  const HOME=new THREE.Vector3(0,10.5,11.5);
  camera.position.copy(HOME);
  // Xoay tự do mọi hướng: kéo để lật bo mạch, xem cả mặt dưới
  const controls=new THREE.TrackballControls(camera,renderer.domElement);
  controls.rotateSpeed=3.2; controls.zoomSpeed=1.2; controls.panSpeed=.8;
  controls.staticMoving=false; controls.dynamicDampingFactor=.14;
  controls.minDistance=4; controls.maxDistance=26;
  const goal=new THREE.Vector3(0,0,0.3); controls.target.copy(goal);

  scene.add(new THREE.HemisphereLight(0xdcefe6,0x6b78b8,0.8));
  const sun=new THREE.DirectionalLight(0xffffff,0.95); sun.position.set(5,11,7); sun.castShadow=true;
  sun.shadow.mapSize.set(1024,1024); Object.assign(sun.shadow.camera,{left:-8,right:8,top:8,bottom:-8});
  scene.add(sun);
  const alarmLight=new THREE.PointLight(0xff4030,0,18); alarmLight.position.set(3,4,0); scene.add(alarmLight);

  // ground + board
  const ground=new THREE.Mesh(new THREE.PlaneGeometry(60,60),new THREE.MeshStandardMaterial({color:0x0a0f35,roughness:1}));
  ground.rotation.x=-Math.PI/2; ground.position.y=-0.6; ground.receiveShadow=true; scene.add(ground);
  const board=new THREE.Mesh(new THREE.BoxGeometry(12.4,0.3,8),new THREE.MeshStandardMaterial({color:0x0e3a26,roughness:0.55}));
  board.receiveShadow=true; scene.add(board);
  const Y=0.15;
  // mounting holes
  [[-5.9,-3.6],[5.9,-3.6],[-5.9,3.6],[5.9,3.6]].forEach(([x,z])=&gt;{
    const r=new THREE.Mesh(new THREE.RingGeometry(0.12,0.22,24),new THREE.MeshStandardMaterial({color:0xc9a35c,metalness:.8,roughness:.3}));
    r.rotation.x=-Math.PI/2; r.position.set(x,Y+0.005,z); scene.add(r);
  });
  // silkscreen
  function silk(text,x,z,w,size){
    const c=document.createElement(&#x27;canvas&#x27;); c.width=1024; c.height=128;
    const g=c.getContext(&#x27;2d&#x27;); g.fillStyle=&#x27;rgba(235,245,240,.85)&#x27;; g.font=&#x27;600 &#x27;+(size||64)+&#x27;px &quot;JetBrains Mono&quot;, monospace&#x27;;
    g.textBaseline=&#x27;middle&#x27;; g.fillText(text,8,64);
    const t=new THREE.CanvasTexture(c); t.encoding=THREE.sRGBEncoding;
    const m=new THREE.Mesh(new THREE.PlaneGeometry(w,w/8),new THREE.MeshBasicMaterial({map:t,transparent:true,depthWrite:false}));
    m.rotation.x=-Math.PI/2; m.position.set(x,Y+0.006,z); scene.add(m);
  }

  const comps={};
  const pickables=[];
  function reg(key,group,labelText,labelY){
    group.traverse(o=&gt;{if(o.isMesh){o.castShadow=true;o.userData.key=key;pickables.push(o)}});
    scene.add(group); comps[key]={group,labelY};
    const lab=label(labelText); lab.position.set(group.position.x,labelY,group.position.z); scene.add(lab); comps[key].label=lab;
  }
  function label(text){
    const c=document.createElement(&#x27;canvas&#x27;); c.width=512; c.height=112;
    const g=c.getContext(&#x27;2d&#x27;);
    g.font=&#x27;600 46px &quot;Be Vietnam Pro&quot;, system-ui, sans-serif&#x27;;
    const w=Math.min(500,g.measureText(text).width+48);
    g.fillStyle=&#x27;rgba(12,19,17,.86)&#x27;; g.strokeStyle=&#x27;rgba(139,163,153,.55)&#x27;; g.lineWidth=3;
    const x0=(512-w)/2; g.beginPath(); g.roundRect?g.roundRect(x0,10,w,92,20):g.rect(x0,10,w,92); g.fill(); g.stroke();
    g.fillStyle=&#x27;#f1f4ff&#x27;; g.textAlign=&#x27;center&#x27;; g.textBaseline=&#x27;middle&#x27;; g.fillText(text,256,58);
    const t=new THREE.CanvasTexture(c); t.encoding=THREE.sRGBEncoding;
    const s=new THREE.Sprite(new THREE.SpriteMaterial({map:t,depthTest:false,transparent:true}));
    s.scale.set(2.3,0.5,1); s.renderOrder=10; return s;
  }
  const M=(color,o)=&gt;new THREE.MeshStandardMaterial(Object.assign({color,roughness:.5},o||{}));
  const metal=M(0xc8ccd0,{metalness:.85,roughness:.3});
  function leg(x,z,h){const m=new THREE.Mesh(new THREE.CylinderGeometry(.025,.025,h,8),metal);m.position.set(x,h/2,z);return m}

  // battery
  {const g=new THREE.Group(); g.position.set(-5.05,Y,0.2);
    const body=new THREE.Mesh(new THREE.BoxGeometry(1.1,0.85,2.3),M(0x24282e)); body.position.y=.425; g.add(body);
    const band=new THREE.Mesh(new THREE.BoxGeometry(1.12,0.86,0.9),M(0xd6a23a)); band.position.set(0,.425,0.5); g.add(band);
    const t1=new THREE.Mesh(new THREE.CylinderGeometry(.15,.15,.18,6),metal); t1.position.set(-.25,.94,-.8); g.add(t1);
    const t2=new THREE.Mesh(new THREE.CylinderGeometry(.18,.18,.18,16),metal); t2.position.set(.25,.94,-.8); g.add(t2);
    const reg7805=new THREE.Mesh(new THREE.BoxGeometry(.4,.55,.15),M(0x111214)); reg7805.position.set(-.25,.3,-1.55); g.add(reg7805);
    const tab=new THREE.Mesh(new THREE.BoxGeometry(.4,.3,.04),metal); tab.position.set(-.25,.7,-1.63); g.add(tab);
    reg(&#x27;power&#x27;,g,&#x27;Nguồn 9 V&#x27;,1.7);}
  // thermistor
  let bead; const COLD=new THREE.Color(0x2a5fc6), HOT=new THREE.Color(0x7a1a08);
  {const g=new THREE.Group(); g.position.set(-3.5,Y,1.8);
    g.add(leg(-.07,0,.55)); g.add(leg(.07,0,.55));
    bead=new THREE.Mesh(new THREE.SphereGeometry(.22,24,16),M(0x2a5fc6,{roughness:.35,emissive:0xff3a10,emissiveIntensity:0}));
    bead.scale.set(1,1.15,.65); bead.position.y=.72; g.add(bead);
    const pad=new THREE.Mesh(new THREE.BoxGeometry(.6,.02,.35),M(0xc9a35c,{metalness:.8,roughness:.3})); pad.position.y=.01; g.add(pad);
    reg(&#x27;temp&#x27;,g,&#x27;NTC (T)&#x27;,1.55);}
  // smoke sensor
  const SMOKE_POS=new THREE.Vector3(-3.5,Y,-1.5);
  {const g=new THREE.Group(); g.position.copy(SMOKE_POS);
