\/div>\n    <div class=\"tip3d\">Bấm vào cần gạt A, B trên mô hình. Kéo để xoay, lăn chuột để phóng to.<\/div>\n    <div class=\"vbtn\"><button id=\"vTop\">Nhìn từ trên<\/button><button id=\"vSide\">Góc nghiêng<\/button><button class=\"mute\" id=\"mute\" aria-pressed=\"false\">Tiếng còi: bật<\/button><\/div>\n    <div class=\"result off\" id=\"result\">Đèn TẮT<\/div>\n  <\/section>\n<\/main>\n\n<section class=\"learn\">\n  <section class=\"card\">\n    <h2>Bảng sự thật <small>dòng tô màu = trạng thái đang bật<\/small><\/h2>\n    <div style=\"overflow-x:auto\"><table class=\"tt\" id=\"tt\"><\/table><\/div>\n    <div class=\"row\">\n      <button class=\"btn\" id=\"quizBtn\">Tự đoán cột Y<\/button>\n      <button class=\"btn primary\" id=\"quizCheck\" hidden>Kiểm tra đáp án<\/button>\n      <span class=\"qres\" id=\"qres\"><\/span>\n    <\/div>\n    <p class=\"note\" id=\"quizHint\">Muốn tự kiểm tra: bấm “Tự đoán cột Y”, bấm vào từng ô để chọn 0 hoặc 1, rồi gạt công tắc trên mô hình để thử.<\/p>\n  <\/section>\n  <section class=\"card\">\n    <h2>Hiểu nhanh cổng <span id=\"gName\">VÀ (AND)<\/span><\/h2>\n    <div class=\"expr\" id=\"expr\">Y = A · B<\/div>\n    <p class=\"say\" id=\"say\"><\/p>\n    <div class=\"life\"><span>💡<\/span><div id=\"life\"><\/div><\/div>\n    <div><div class=\"lbl\" style=\"margin-bottom:6px\">Các tải có thể nối ở đầu ra<\/div>\n      <div class=\"loads\" id=\"loadInfo\"><\/div><\/div>\n    <p class=\"note\" id=\"drvNote\"><\/p>\n  <\/section>\n<\/section>\n<\/div>\n\n<script src=\"https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js\"><\/script>\n<script src=\"https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js\"><\/script>\n<script>\n(function(){\n\"use strict\";\nconst $=s=>document.querySelector(s);\n\n/* ---------- Dữ liệu cổng ---------- */\nconst GATES={\n AND:{vn:\"VÀ\",ic:\"74HC08\",f:(a,b)=>a&&b,one:false,expr:\"Y = A · B\",\n   say:\"Tải chỉ hoạt động khi A <b>VÀ<\/b> B cùng bật.\",\n   life:\"<b>Máy dập an toàn:<\/b> người thợ phải bấm cả hai nút bằng hai tay thì máy mới chạy, nên tay không thể ở dưới khuôn.\"},\n OR:{vn:\"HOẶC\",ic:\"74HC32\",f:(a,b)=>a||b,one:false,expr:\"Y = A + B\",\n   say:\"Tải hoạt động khi A <b>HOẶC<\/b> B bật (bật một cái hay cả hai đều được).\",\n   life:\"<b>Chuông cửa hai nút:<\/b> khách bấm nút cửa trước hoặc cửa sau thì chuông đều kêu.\"},\n NOT:{vn:\"ĐẢO (KHÔNG)\",ic:\"74HC04\",f:a=>!a,one:true,expr:'Y = <span class=\"ov\">A<\/span>',\n   say:\"Đầu ra luôn <b>ngược<\/b> với A. Cổng này chỉ dùng một đầu vào A.\",\n   life:\"<b>Đèn đường tự động:<\/b> cảm biến ánh sáng báo trời sáng (A = 1) thì đèn tắt, trời tối (A = 0) thì đèn sáng.\"},\n NAND:{vn:\"VÀ – ĐẢO\",ic:\"74HC00\",f:(a,b)=>!(a&&b),one:false,expr:'Y = <span class=\"ov\">A · B<\/span>',\n   say:\"Ngược với cổng VÀ: tải chỉ <b>tắt<\/b> khi A và B cùng bật.\",\n   life:\"<b>Đèn báo cửa xe:<\/b> đèn tắt khi cả hai cửa đều đóng; còn một cửa mở là đèn sáng nhắc nhở.\"},\n NOR:{vn:\"HOẶC – ĐẢO\",ic:\"74HC02\",f:(a,b)=>!(a||b),one:false,expr:'Y = <span class=\"ov\">A + B<\/span>',\n   say:\"Ngược với cổng HOẶC: tải chỉ hoạt động khi A và B <b>đều tắt<\/b>.\",\n   life:\"<b>Đèn “phòng trống”:<\/b> chỉ sáng khi không có cảm biến nào (A, B) phát hiện người.\"},\n XOR:{vn:\"HOẶC LOẠI TRỪ\",ic:\"74HC86\",f:(a,b)=>a!==b,one:false,expr:\"Y = A ⊕ B\",\n   say:\"Tải hoạt động khi A và B <b>khác nhau<\/b> (một bật, một tắt).\",\n   life:\"<b>Đèn cầu thang hai công tắc:<\/b> gạt công tắc ở chân cầu thang hay đầu cầu thang đều đổi được trạng thái đèn.\"}\n};\nconst LOADS={\n bulb:{vn:\"Bóng đèn\",short:\"Đèn\",on:\"SÁNG\",off:\"TẮT\",drv:true,info:\"Đèn sợi đốt nhỏ 5 V. Sáng khi Y = 1.\"},\n led:{vn:\"Đèn LED\",short:\"LED\",on:\"SÁNG\",off:\"TẮT\",drv:false,info:\"Nối qua điện trở 330 Ω để hạn dòng.\"},\n buzzer:{vn:\"Còi báo\",short:\"Còi\",on:\"KÊU\",off:\"IM\",drv:true,info:\"Còi chíp 5 V, kêu “bíp” khi Y = 1.\"},\n fan:{vn:\"Quạt (động cơ)\",short:\"Quạt\",on:\"QUAY\",off:\"ĐỨNG\",drv:true,info:\"Động cơ một chiều 5 V gắn cánh quạt.\"}\n};\nconst S={a:false,b:false,gate:\"AND\",load:\"bulb\",quiz:false,guess:{},muted:false};\nconst lv=x=>x?1:0;\nconst outY=()=>{const g=GATES[S.gate];return g.one?!!g.f(S.a):!!g.f(S.a,S.b);};\n\n/* ---------- Chọn cổng / tải ---------- */\n{const el=$(\"#gates\");for(const k in GATES){const b=document.createElement(\"button\");b.className=\"chip\";b.dataset.k=k;\n  b.innerHTML=`${GATES[k].vn}<small>${k} · ${GATES[k].ic}<\/small>`;b.onclick=()=>{S.gate=k;S.guess={};S.quizChecked=false;update();};el.appendChild(b);}}\n{const el=$(\"#loadSel\");for(const k in LOADS){const b=document.createElement(\"button\");b.className=\"chip\";b.dataset.k=k;\n  b.innerHTML=`${LOADS[k].vn}<small>${LOADS[k].drv?\"qua transistor\":\"qua điện trở 330 Ω\"}<\/small>`;b.onclick=()=>{S.load=k;update();};el.appendChild(b);}}\n$(\"#loadInfo\").innerHTML=Object.entries(LOADS).map(([k,l])=>`<div data-k=\"${k}\"><b>${l.vn}<\/b>${l.info}<\/div>`).join(\"\");\n\n/* ---------- Sơ đồ 2D ---------- */\nfunction gateSVG(k){\n  const AND='<path class=\"g\" d=\"M240 100 H285 A50 50 0 0 1 285 200 H240 Z\"/>';\n  const OR='<path class=\"g\" d=\"M232 100 Q300 100 340 150 Q300 200 232 200 Q262 150 232 100 Z\"/>';\n  const bub=x=>`<circle class=\"g\" cx=\"${x}\" cy=\"150\" r=\"7\"/>`;\n  switch(k){\n    case\"AND\":return{s:AND,tip:335,tx:278};\n    case\"NAND\":return{s:AND+bub(342),tip:349,tx:278};\n    case\"OR\":return{s:OR,tip:340,tx:282};\n    case\"NOR\":return{s:OR+bub(347),tip:354,tx:282};\n    case\"XOR\":return{s:OR+'<path class=\"gs\" d=\"M220 100 Q250 150 220 200\"/>',tip:340,tx:284};\n    case\"NOT\":return{s:'<path class=\"g\" d=\"M245 105 L320 150 L245 195 Z\"/>'+bub(327),tip:334,tx:270};\n  }\n}\nfunction badge(x,y,on){return`<g class=\"badge ${on?\"on\":\"off\"}\"><circle cx=\"${x}\" cy=\"${y}\" r=\"11\"/><text x=\"${x}\" y=\"${y+4.5}\" text-anchor=\"middle\">${on?1:0}<\/text><\/g>`;}\nfunction swSym(y,on,id,label){\n  const lever=on?`M70 ${y} L120 ${y}`:`M70 ${y} L114 ${y-26}`;\n  return`<g class=\"swh\" data-sw=\"${id}\" role=\"button\" aria-label=\"Công tắc ${label}\"><rect class=\"hit\" x=\"56\" y=\"${y-36}\" width=\"80\" height=\"52\" rx=\"8\"/>\n   <circle class=\"dot\" cx=\"70\" cy=\"${y}\" r=\"4\"/><circle cx=\"120\" cy=\"${y}\" r=\"4\" fill=\"var(--panel)\" stroke=\"var(--ink)\" stroke-width=\"2\"/>\n   <path class=\"w ${on?\"on\":\"off\"}\" d=\"${lever}\"/><text x=\"95\" y=\"${y+28}\" text-anchor=\"middle\" style=\"font-weight:700\">Công tắc ${label}<\/text><\/g>`;\n}\nfunction loadSVG(k,on){\n  const x=505;\n  if(k===\"bulb\")return`<circle class=\"lamp ${on?\"on\":\"off\"}\" cx=\"${x}\" cy=\"150\" r=\"22\" stroke=\"var(--ink)\" stroke-width=\"2.2\"/><path class=\"gs\" d=\"M${x-15} 135 L${x+15} 165 M${x+15} 135 L${x-15} 165\"/>`+(on?rays(x):\"\");\n  if(k===\"led\")return`<path class=\"lamp ${on?\"on\":\"off\"}\" d=\"M${x-16} 132 L${x+16} 132 L${x} 160 Z\" stroke=\"var(--ink)\" stroke-width=\"2.2\"/><path class=\"gs\" d=\"M${x-16} 160 H${x+16} M${x} 128 V132 M${x} 160 V172\"/><path class=\"gs\" d=\"M${x+20} 140 l12 -10 m-6 0 h6 v6 M${x+20} 152 l12 -10 m-6 0 h6 v6\" style=\"stroke:${on?\"var(--hi)\":\"var(--lo)\"}\"/>`;\n  if(k===\"buzzer\")return`<path class=\"lamp ${on?\"on\":\"off\"}\" d=\"M${x-20} 160 A20 20 0 0 1 ${x+20} 160 Z\" stroke=\"var(--ink)\" stroke-width=\"2.2\"/><path class=\"gs\" d=\"M${x-8} 160 V172 M${x+8} 160 V172 M${x} 128 V140\"/>`+(on?`<path class=\"gs\" style=\"stroke:var(--hi)\" d=\"M${x+28} 132 q8 12 0 24 M${x+36} 126 q12 18 0 36\"/>`:\"\");\n  return`<circle class=\"lamp ${on?\"on\":\"off\"}\" cx=\"${x}\" cy=\"150\" r=\"22\" stroke=\"var(--ink)\" stroke-width=\"2.2\"/><text x=\"${x}\" y=\"157\" text-anchor=\"middle\" style=\"font-family:var(--f-display);font-weight:700;font-size:20px\">M<\/text>`+(on?`<path class=\"gs\" style=\"stroke:var(--hi)\" d=\"M${x+30} 138 a14 14 0 0 1 0 24\"/><path style=\"fill:var(--hi)\" d=\"M${x+26} 158 l6 7 l4 -8z\"/>`:\"\");  class=\"btn\" id=\"quizBtn\">Tự đoán cột C<\/button>\n      <button class=\"btn primary\" id=\"quizCheck\" hidden>Kiểm tra đáp án<\/button>\n      <span class=\"qres\" id=\"qres\"><\/span>\n    <\/div>\n    <div id=\"timingBox\" hidden>\n      <h2 style=\"margin-bottom:8px\">Giản đồ xung <small>ghi lại các lần em bấm<\/small><\/h2>\n      <div class=\"timing\" id=\"timing\"><\/div>\n      <div class=\"row\" style=\"margin-top:8px\"><button class=\"btn\" id=\"tClear\">Xoá giản đồ<\/button><\/div>\n    <\/div>\n    <h2>Sơ đồ chân IC <small>nhìn từ trên, khuyết bên trái<\/small><\/h2>\n    <div class=\"pins3\" id=\"pinout\"><\/div>\n  <\/section>\n  <section class=\"card\">\n    <h2 id=\"gName\"><\/h2>\n    <div class=\"expr\" id=\"expr\"><\/div>\n    <p class=\"say\" id=\"say\"><\/p>\n    <div class=\"life\"><span>💡<\/span><div id=\"life\"><\/div><\/div>\n    <div class=\"ans\" id=\"ans\"><\/div>\n  <\/section>\n<\/section>\n<\/div>\n\n<script src=\"https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js\"><\/script>\n<script src=\"https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js\"><\/script>\n<script>\n(function(){\n\"use strict\";\nconst $=s=>document.querySelector(s);\nconst OV=t=>`<span class=\"ov\">${t}<\/span>`;\nconst OS=t=>`<tspan style=\"text-decoration:overline\">${t}<\/tspan>`;\n\n/* ================= Dữ liệu ================= */\nconst ROLES={\n \"74HC04\":{1:\"1A\",2:\"1Y\",3:\"2A\",4:\"2Y\",5:\"3A\",6:\"3Y\",7:\"GND\",8:\"4Y\",9:\"4A\",10:\"5Y\",11:\"5A\",12:\"6Y\",13:\"6A\",14:\"VCC\"},\n \"74HC08\":{1:\"1A\",2:\"1B\",3:\"1Y\",4:\"2A\",5:\"2B\",6:\"2Y\",7:\"GND\",8:\"3Y\",9:\"3A\",10:\"3B\",11:\"4Y\",12:\"4A\",13:\"4B\",14:\"VCC\"},\n \"74HC74\":{1:\"1CLR̅\",2:\"1D\",3:\"1CLK\",4:\"1PR̅\",5:\"1Q\",6:\"1Q̅\",7:\"GND\",8:\"2Q̅\",9:\"2Q\",10:\"2PR̅\",11:\"2CLK\",12:\"2D\",13:\"2CLR̅\",14:\"VCC\"}\n};\nROLES[\"74HC32\"]=ROLES[\"74HC08\"];\nconst MODES={\n cmp:{name:\"Mạch so sánh\",sub:\"Mạch tổ hợp · 74HC04, 08, 32\",color:\"#0f9a8c\",ic:\"74HC04 · 74HC08 · 74HC32\",\n   title:\"Mạch so sánh hai số A, B\",expr:`C = ${OV(\"A\")}·${OV(\"B\")} + A·B`,\n   say:\"Đầu ra C = 1 khi A và B <b>bằng nhau<\/b> (cùng 0 hoặc cùng 1). A khác B thì C = 0. Mạch gồm 2 cổng NOT, 2 cổng AND và 1 cổng OR. Đầu ra chỉ phụ thuộc đầu vào hiện tại nên đây là <b>mạch tổ hợp<\/b>.\",\n   life:\"<b>Khoá số:<\/b> két sắt chỉ mở khi số em nhập <b>bằng<\/b> số đã cài. Mạch so sánh kiểm tra từng bit, tất cả bằng nhau thì khoá mở.\"},\n ffd:{name:\"Flip-Flop D\",sub:\"Mạch dãy · 74HC74\",color:\"#2d7dd2\",ic:\"74HC74 (dùng FF thứ nhất)\",\n   title:\"Flip-Flop D: phần tử nhớ 1 bit\",expr:`Khi CLK ↑ : Q = D`,\n   say:\"Flip-Flop D chỉ “chép” D sang Q đúng lúc có <b>sườn lên của xung CLK<\/b> (CLK chuyển từ 0 lên 1). Lúc khác, dù gạt D bao nhiêu lần, Q vẫn <b>giữ nguyên<\/b>. Q và Q̅ luôn ngược nhau. Đầu ra phụ thuộc cả trạng thái trước nên đây là <b>mạch dãy<\/b>.\",\n   life:\"<b>Máy ảnh:<\/b> cảnh trước ống kính (D) thay đổi liên tục, nhưng chỉ khi bấm nút chụp (xung CLK) thì hình mới được lưu lại (Q).\"},\n cnt:{name:\"Mạch đếm 2 bit\",sub:\"Mạch dãy · 74HC74\",color:\"#7a5bd6\",ic:\"74HC74 (dùng cả 2 FF)\",\n   title:\"Mạch đếm nhị phân 2 bit\",expr:\"00 → 01 → 10 → 11 → 00\",\n   say:\"Mỗi xung CLK, số đếm (Q1 Q0) tăng thêm 1. <b>FF0<\/b> có D nối Q̅0 nên Q0 đổi trạng thái sau mỗi xung. <b>FF1<\/b> lấy xung từ Q̅0, nên Q1 chỉ đổi khi Q0 chuyển từ 1 về 0. Đếm tới 3 (11), xung thứ 4 quay về 0.\",\n   life:\"<b>Đếm sản phẩm trên băng chuyền:<\/b> mỗi hộp đi qua cảm biến tạo một xung, mạch đếm cộng thêm 1. Mạch đếm còn dùng để chia tần số và tạo xung nhịp trong máy tính.\"}\n};\nconst LOADS={\n led:{vn:\"Đèn LED\",on:\"SÁNG\",off:\"TẮT\",drv:false,info:\"qua điện trở 330 Ω\"},\n bulb:{vn:\"Bóng đèn\",on:\"SÁNG\",off:\"TẮT\",drv:true,info:\"qua transistor\"},\n buzzer:{vn:\"Còi báo\",on:\"KÊU\",off:\"IM\",drv:true,info:\"qua transistor\"}\n};\nconst S={mode:\"cmp\",a:false,b:false,load:\"led\",d:false,q:false,clk:false,q0:false,q1:false,rst:false,auto:false,last:\"none\",hist:[],quiz:false,guess:{},muted:false};\nconst lv=x=>x?1:0;\nfunction nets(){\n  if(S.mode===\"cmp\"){const A=S.a,B=S.b,nA=!A,nB=!B,g1=nA&&nB,g2=A&&B;return{A,B,nA,nB,g1,g2,C:g1||g2};}\n  if(S.mode===\"ffd\")return{D:S.d,CLK:S.clk,Q:S.q,nQ:!S.q};\n  return{CLK:S.clk,RST:!S.rst,Q0:S.q0,nQ0:!S.q0,Q1:S.q1,nQ1:!S.q1};\n}\n\n/* ================= Hành động ================= */\nfunction pushHist(){const n=nets();S.hist.push(S.mode===\"ffd\"?{CLK:n.CLK,D:n.D,Q:n.Q}:{CLK:n.CLK,Q0:n.Q0,Q1:n.Q1,N:lv(S.q1)*2+lv(S.q0)});if(S.hist.length>22)S.hist.shift();}\nfunction toggle(k){if(k===\"a\"||k===\"b\"||k===\"d\"){S[k]=!S[k];if(S.mode===\"ffd\")S.last=\"hold\";if(S.mode!==\"cmp\")pushHist();initAudio();update();}}\nlet clkT=null;\nfunction pulse(){\n  if(S.clk)return;\n  S.clk=true;\n  if(S.mode===\"ffd\"){S.q=S.d;S.last=S.d?\"set\":\"reset\";}\n  else if(S.mode===\"cnt\"&&!S.rst){const old=S.q0;S.q0=!S.q0;if(old&&!S.q0)S.q1=!S.q1;}\n  pushHist();update();\n  clearTimeout(clkT);clkT=setTimeout(()=>{S.clk=false;pushHist();update();},320);\n}\nlet rstT=null;\nfunction reset(){S.rst=true;S.q0=S.q1=false;pushHist();update();clearTimeout(rstT);rstT=setTimeout(()=>{S.rst=false;pushHist();update();},320);}\nlet autoT=null;\nfunction setAuto(on){S.auto=on;clearInterval(autoT);if(on)autoT=setInterval(pulse,1000);update();}\n\n/* ================= Thanh chọn mạch ================= */\n{const el=$(\"#modes\");for(const k in MODES){const m=MODES[k];const b=document.createElement(\"button\");b.className=\"gbtn\";b.dataset.k=k;b.style.setProperty(\"--gc\",m.color);\n  b.innerHTML=`<b>${m.name}<\/b><small>${m.sub}<\/small>`;b.onclick=()=>{if(S.mode===k)return;S.mode=k;setAuto(false);S.a=S.b=S.d=S.q=S.q0=S.q1=S.clk=S.rst=false;S.last=\"none\";clearTimeout(clkT);clearTimeout(rstT);if(window.__resetView)window.__resetView();S.hist=[];S.quiz=false;S.guess={};$(\"#qres\").textContent=\"\";pushHist();renderInputs();update(true);};el.appendChild(b);}}\n{const el=$(\"#loadSel\");for(const k in LOADS){const b=document.createElement(\"button\");b.className=\"lchip\";b.dataset.k=k;\n  b.innerHTML=`${LOADS[k].vn}<small>${LOADS[k].info}<\/small>`;b.onclick=()=>{S.load=k;update(true);};el.appendChild(b);}}\n\nfunction swBtn(k,label){return`<button class=\"sw\" data-t=\"${k}\" aria-pressed=\"false\"><span class=\"knob\"><\/span><span><b>${label}<\/b><small data-s=\"${k}\">Tắt · 0 V<\/small><\/span><span class=\"lv\" data-l=\"${k}\">0<\/span><\/button>`;}\nfunction renderInputs(){\n  const el=$(\"#inputs\");\n  if(S.mode===\"cmp\")el.innerHTML=swBtn(\"a\",\"A\")+swBtn(\"b\",\"B\");\n  else if(S.mode===\"ffd\")el.innerHTML=swBtn(\"d\",\"D\")+`<button class=\"pbtn\" data-p=\"clk\"><span class=\"cap\"><\/span><span>Bấm xung CLK<small>tạo 1 sườn lên ↑<\/small><\/span><\/button>`;\n  else el.innerHTML=`<button class=\"pbtn\" data-p=\"clk\"><span class=\"cap\"><\/span><span>Bấm xung CLK<small>mỗi lần bấm đếm thêm 1<\/small><\/span><\/button>\n    <button class=\"pbtn rst\" data-p=\"rst\"><span class=\"cap\"><\/span><span>Nút Xoá (Reset)<small>đưa CLR̅ về 0 → số đếm = 0<\/small><\/span><\/button>\n    <button class=\"pbtn auto\" data-p=\"auto\" aria-pressed=\"false\"><span class=\"cap\" style=\"background:radial-gradient(circle at 40% 35%,#ffe28a,#e0a21e);box-shadow:0 4px 0 #8a5c06\"><\/span><span>Tự phát xung<small>1 xung mỗi giây<\/small><\/span><\/button>`;\n  el.querySelectorAll(\"[data-t]\").forEach(b=>b.onclick=()=>toggle(b.dataset.t));\n  el.querySelectorAll(\"[data-p]\").forEach(b=>b.onclick=()=>{const p=b.dataset.p;initAudio();if(p===\"clk\")pulse();else if(p===\"rst\")reset();else setAuto(!S.auto);});\n}\n\n/* ================= Sơ đồ 2D ================= */\nconst gnd=(x,y)=>`<path class=\"gnd\" d=\"M${x} ${y-8} V${y} M${x-12} ${y} H${x+12} M${x-8} ${y+5} H${x+8} M${x-4} ${y+10} H${x+4}\"/>`;\nconst vcc=(x,y)=>`<circle cx=\"${x}\" cy=\"${y}\" r=\"5\" fill=\"var(--hi)\"/><text x=\"${x+9}\" y=\"${y+4}\" style=\"font-weight:700;font-size:11px\">+5 V<\/text>`;\nconst badge=(x,y,on)=>`<g class=\"badge ${on?\"on\":\"off\"}\"><circle cx=\"${x}\" cy=\"${y}\" r=\"10\"/><text x=\"${x}\" y=\"${y+4.5}\" text-anchor=\"middle\">${on?1:0}<\/text><\/g>`;\nconst W=(on,d,extra=\"\")=>`<path class=\"w ${on?\"on\":\"off\"}\" d=\"${d}\" ${extra}/>`;\nconst pin=(x,y,n,anchor=\"middle\")=>`<text class=\"pin-n\" x=\"${x}\" y=\"${y}\" text-anchor=\"${anchor}\">${n}<\/text>`;\nconst dot=(x,y)=>`<circle class=\"dot\" cx=\"${x}\" cy=\"${y}\" r=\"3.5\"/>`;\nfunction swSym(x,y,on,id,label){const lever=on?`M${x} ${y} L${x+44} ${y}`:`M${x} ${y} L${x+38} ${y-22}`;\n  return`<g class=\"swh\" data-sw=\"${id}\" role=\"button\" aria-label=\"Công tắc ${label}\"><rect class=\"hit\" x=\"${x-12}\" y=\"${y-32}\" width=\"72\" height=\"46\" rx=\"8\"/>\n   <circle class=\"dot\" cx=\"${x}\" cy=\"${y}\" r=\"3.5\"/><circle cx=\"${x+44}\" cy=\"${y}\" r=\"3.5\" fill=\"var(--panel)\" stroke=\"var(--ink)\" stroke-width=\"2\"/>\n   ${W(on,lever)}<text x=\"${x+22}\" y=\"${y+24}\" text-anchor=\"middle\" style=\"font-weight:700;font-size:11.5px\">${label}<\/text><\/g>`;}\nfunction btnSym(x,y,held,id,label){const py=held?y-4:y-13;\n  return`<g class=\"swh\" data-pb=\"${id}\" role=\"button\" aria-label=\"${label}\"><rect class=\"hit\" x=\"${x-12}\" y=\"${y-34}\" width=\"72\" height=\"48\" rx=\"8\"/>\n   <circle class=\"dot\" cx=\"${x}\" cy=\"${y}\" r=\"3.5\"/><circle class=\"dot\" cx=\"${x+44}\" cy=\"${y}\" r=\"3.5\"/>\n   <path class=\"gs\" d=\"M${x-2} ${py} H${x+46} M${x+22} ${py} V${py-12}\"/><path class=\"gs\" d=\"M${x+14} ${py-12} H${x+30}\"/>\n   <text x=\"${x+22}\" y=\"${y+24}\" text-anchor=\"middle\" style=\"font-weight:700;font-size:11.5px\">${label}<\/text><\/g>`;}\nfunction resH(x,y,label){return`<rect x=\"${x}\" y=\"${y-7}\" width=\"34\" height=\"14\" fill=\"var(--panel)\" stroke=\"var(--ink)\" stroke-width=\"2\"/><text class=\"t-m\" x=\"${x+17}\" y=\"${y-11}\" text-anchor=\"middle\">${label}<\/text>`;}\nfunction resV(x,y,label,right=true){return`<rect x=\"${x-7}\" y=\"${y}\" width=\"14\" height=\"26\" fill=\"var(--panel)\" stroke=\"var(--ink)\" stroke-width=\"2\"/><text class=\"t-m\" x=\"${right?x+11:x-11}\" y=\"${y+17}\" text-anchor=\"${right?\"start\":\"end\"}\">${label}<\/text>`;}\nfunction ledV(x,y,on,col){return`<path class=\"lamp\" style=\"fill:${on?col:\"var(--panel)\"}\" d=\"M${x-12} ${y} H${x+12} L${x} ${y+20} Z\" stroke=\"var(--ink)\" stroke-width=\"2\"/><path class=\"gs\" d=\"M${x-12} ${y+20} H${x+12}\"/>\n  <path class=\"gs\" style=\"stroke:${on?col:\"var(--lo)\"};stroke-width:1.8\" d=\"M${x+15} ${y+4} l10 -7 m-5 -1 h5 v5 M${x+15} ${y+14} l10 -7 m-5 -1 h5 v5\"/>`;}\nconst andG=(x,cy)=>`<path class=\"g\" d=\"M${x} ${cy-24} H${x+24} A24 24 0 0 1 ${x+24} ${cy+24} H${x} Z\"/>`;\nconst orG=(x,cy)=>`<path class=\"g\" d=\"M${x-6} ${cy-24} Q${x+34} ${cy-24} ${x+52} ${cy} Q${x+34} ${cy+24} ${x-6} ${cy+24} Q${x+10} ${cy} ${x-6} ${cy-24} Z\"/>`;\nconst notG=(x,cy)=>`<path class=\"g\" d=\"M${x} ${cy-16} L${x+34} ${cy} L${x} ${cy+16} Z\"/><circle class=\"g\" cx=\"${x+39}\" cy=\"${cy}\" r=\"5\"/>`;\nconst hopH=(on,x1,x2,y,hx)=>W(on,`M${x1} ${y} H${hx-6} a6 6 0 0 1 12 0 H${x2}`);\n\nfunction schemCmp(){\n  const n=nets(),L=LOADS[S.load];\n  let s=`${vcc(26,30)}${W(1,\"M26 35 V230 M26 60 H60 M26 230 H60\",\"class=\\\"w pwr\\\"\")}\n   ${swSym(60,60,n.A,\"a\",\"A\")}${swSym(60,230,n.B,\"b\",\"B\")}\n   ${W(n.A,\"M104 60 H180 V140\")}${dot(130,60)}${W(0,\"M130 60 V72\")}${resV(130,72,\"10 kΩ\",false)}${W(0,\"M130 98 V104\")}${gnd(130,112)}\n   ${W(n.B,\"M104 230 H180 V170\")}${dot(130,230)}${W(0,\"M130 230 V242\")}${resV(130,242,\"10 kΩ\",false)}${W(0,\"M130 268 V274\")}${gnd(130,282)}\n   ${dot(180,82)}${W(n.A,\"M180 82 H214\")}${dot(180,140)}${W(n.A,\"M180 140 H252\")}\n   ${dot(180,208)}${W(n.B,\"M180 208 H214\")}${dot(180,170)}${W(n.B,\"M180 170 H252\")}\n   ${notG(214,82)}${notG(214,208)}${andG(252,155)}\n   ${pin(206,77,1,\"end\")}${pin(262,77,2,\"start\")}${pin(206,20 ">NOT<\/text><\/g>\n          <g class=\"blk\" role=\"button\" data-key=\"and\" data-sig=\"AND\" tabindex=\"0\" transform=\"translate(380 55)\"><path class=\"g\" d=\"M0 0 H25 A25 25 0 0 1 25 50 H0 Z\"/><text class=\"t\" x=\"21\" y=\"29\" text-anchor=\"middle\" style=\"font-size:11px\">AND<\/text><\/g>\n          <g class=\"blk\" role=\"button\" data-key=\"or\" data-sig=\"OR\" tabindex=\"0\" transform=\"translate(380 179)\"><path class=\"g\" d=\"M0 0 Q15 25 0 50 Q40 50 60 25 Q40 0 0 0 Z\"/><text class=\"t\" x=\"27\" y=\"29\" text-anchor=\"middle\" style=\"font-size:11px\">OR<\/text><\/g>\n          <g class=\"blk\" role=\"button\" data-key=\"ledR\" data-sig=\"AND\" data-alarm=\"1\" tabindex=\"0\"><rect x=\"560\" y=\"53\" width=\"110\" height=\"54\" rx=\"7\"/><text class=\"t\" x=\"615\" y=\"77\" text-anchor=\"middle\">Đèn LED<\/text><text class=\"s\" x=\"615\" y=\"95\" text-anchor=\"middle\">Y₁ = S·N<\/text><\/g>\n          <g class=\"blk\" role=\"button\" data-key=\"buzzer\" data-sig=\"OR\" data-alarm=\"1\" tabindex=\"0\"><rect x=\"560\" y=\"177\" width=\"110\" height=\"54\" rx=\"7\"/><text class=\"t\" x=\"615\" y=\"201\" text-anchor=\"middle\">Còi<\/text><text class=\"s\" x=\"615\" y=\"219\" text-anchor=\"middle\">Y₂ = S + N<\/text><\/g>\n        <\/svg>\n      <\/div>\n    <\/section>\n\n    <section class=\"panel\">\n      <div class=\"ph\"><h2>Mô hình 3D<\/h2><span id=\"fps\">bo mạch 124 × 80 mm<\/span><\/div>\n      <div id=\"stage\">\n        <button class=\"reset\" id=\"reset\">Xem toàn mạch<\/button>\n        <div class=\"hint\">Kéo để xoay · cuộn để phóng to · chạm linh kiện để xem<\/div>\n      <\/div>\n    <\/section>\n  <\/div>\n\n  <div class=\"strip\">\n    <section class=\"panel\">\n      <div class=\"ph\"><h2>Cảm biến và điều khiển<\/h2><\/div>\n      <div class=\"body\">\n        <div class=\"sens\">\n          <div class=\"row\"><label for=\"temp\">Nhiệt độ phòng<\/label><span class=\"val\"><span id=\"tempv\">25 °C<\/span><b id=\"tb\">H=1<\/b><\/span><\/div>\n          <input type=\"range\" id=\"temp\" min=\"20\" max=\"90\" value=\"25\">\n          <div class=\"scale\"><span>20 °C<\/span><span>ngưỡng 60 °C<\/span><span>90 °C<\/span><\/div>\n        <\/div>\n        <div class=\"sens\">\n          <div class=\"row\"><label for=\"smoke\">Nồng độ khói<\/label><span class=\"val\"><span id=\"smokev\">10 %<\/span><b id=\"sb\">S=0<\/b><\/span><\/div>\n          <input type=\"range\" id=\"smoke\" min=\"0\" max=\"100\" value=\"10\">\n          <div class=\"scale\"><span>0 %<\/span><span>ngưỡng 50 %<\/span><span>100 %<\/span><\/div>\n        <\/div>\n        <div class=\"sens\">\n          <div class=\"row\"><label for=\"led\">Độ sáng đèn LED<\/label><span class=\"val\" id=\"ledv\">40 %<\/span><\/div>\n          <input type=\"range\" id=\"led\" min=\"5\" max=\"100\" value=\"40\">\n          <div class=\"scale\"><span>mờ<\/span><span>sáng<\/span><\/div>\n        <\/div>\n        <div class=\"btns\">\n          <button id=\"pwr\" aria-pressed=\"true\">Nguồn: bật<\/button>\n          <button id=\"test\" class=\"danger\" aria-pressed=\"false\">Thử báo cháy<\/button>\n          <button id=\"snd\" aria-pressed=\"true\">Âm thanh còi: bật<\/button>\n        <\/div>\n      <\/div>\n    <\/section>\n\n    <section class=\"panel\">\n      <div class=\"ph\"><h2>Bảng chân lý<\/h2><span>N = H̅ · Y₁ = S·N · Y₂ = S + N<\/span><\/div>\n      <div class=\"body\">\n        <table>\n          <thead><tr><th>S<\/th><th>H<\/th><th>N<\/th><th>Y₁ LED<\/th><th>Y₂ còi<\/th><th>Kết quả<\/th><\/tr><\/thead>\n          <tbody id=\"tt\"><\/tbody>\n        <\/table>\n        <div class=\"eq\">H = 1 khi chưa cháy, H = 0 khi ≥ 60 °C<br>N = H̅ (qua cổng NOT) · S = 1 khi khói ≥ 50 %<\/div>\n      <\/div>\n    <\/section>\n\n    <section class=\"panel info\">\n      <div class=\"ph\"><h2>Linh kiện đang chọn<\/h2><\/div>\n      <div class=\"body\">\n        <div><div class=\"k\" id=\"ik\"><\/div><h3 id=\"ih\"><\/h3><\/div>\n        <p id=\"ip\"><\/p>\n        <div class=\"chips\" id=\"ic\"><\/div>\n      <\/div>\n    <\/section>\n  <\/div>\n<\/div>\n\n<script>\nconst $=id=>document.getElementById(id);\nconst TH_T=60, TH_S=50;\nconst st={temp:25,smoke:10,power:true,test:false,sound:true,led:40,sel:'or'};\n\nconst INFO={\n  power:{k:'Khối nguồn',h:'Pin 9 V + ổn áp 7805',p:'Cấp điện cho toàn mạch. Pin 9 V qua IC ổn áp 7805 tạo Vcc = 5 V cho cảm biến và IC số. Khi tắt nguồn, mọi tín hiệu về mức 0 và mạch không báo.',c:['Vcc 5 V','7805','GND chung']},\n  temp:{k:'Khối cảm biến',h:'Cảm biến nhiệt (lối ra DO)',p:'Theo SGK, lối ra DO của một số cảm biến nhiệt ở mức cao (H = 1) khi chưa có tín hiệu cháy và xuống mức 0 khi nhiệt độ vượt ngưỡng. Nếu nối thẳng vào cổng AND, OR thì còi hoặc LED sẽ luôn kêu/sáng, nên phải mắc thêm cổng NOT.',c:['lối ra DO','H = 0 khi ≥ 60 °C']},\n  smoke:{k:'Khối cảm biến',h:'Cảm biến khói MQ-2',p:'Khi có khói, điện trở lớp cảm ứng SnO₂ giảm nên điện áp ra tăng. S = 1 khi khói từ 50 % trở lên. Tín hiệu S đi vào cả cổng AND và cổng OR.',c:['MQ-2','đầu ra S','ngưỡng 50 %']},\n  not:{k:'Khối xử lý',h:'Cổng NOT · IC 74HC04',p:'Mắc với lối ra cảm biến nhiệt để đảo tín hiệu: N = H̅. Khi chưa cháy H = 1 nên N = 0; khi nóng H = 0 nên N = 1. Đầu ra N đi vào cả cổng AND và cổng OR.',c:['74HC04','N = H̅']},\n  and:{k:'Khối xử lý',h:'Cổng AND · IC 74HC08',p:'Y₁ = S · N. Khi có đồng thời tín hiệu báo khói và báo cháy (nhiệt độ), lối ra lên mức logic 1 làm LED phát sáng.',c:['74HC08','điều khiển LED','Y₁ = S·N']},\n  or:{k:'Khối xử lý',h:'Cổng OR · IC 74HC32',p:'Y₂ = S + N. Khi có một trong hai tín hiệu báo khói hoặc báo cháy, hoặc cả hai, lối ra lên mức logic 1 làm còi kêu.',c:['74HC32','điều khiển còi','Y₂ = S + N']},\n  power:{k:'Nguồn (chỉ có trên mô hình 3D)',h:'Pin 9 V + ổn áp 7805',p:'Hình 23.1 không vẽ khối nguồn, nhưng mạch thật cần nguồn: pin 9 V qua IC ổn áp 7805 tạo 5 V cho cảm biến và các IC. Tắt nguồn thì mọi tín hiệu về 0.',c:['Vcc 5 V','7805']},\n  amp:{k:'Linh kiện phụ (chỉ có trên mô hình 3D)',h:'Transistor C1815',p:'Hình 23.1 không vẽ transistor. Trên mạch thật, dòng ra của cổng OR chỉ vài mA nên thường thêm transistor để cấp đủ dòng cho còi.',c:['NPN','điện trở gốc 1 kΩ']},\n  buzzer:{k:'Khối chấp hành',h:'Còi',p:'Kêu khi Y₂ = S + N = 1, tức là có khói, hoặc nhiệt độ cao, hoặc cả hai.',c:['buzzer 5 V','nối cổng OR']},\n  ledR:{k:'Khối chấp hành',h:'Đèn LED',p:'Sáng khi Y₁ = S · N = 1, tức là có khói và nhiệt độ cao cùng lúc. Nối tiếp điện trở hạn dòng 330 Ω.',c:['LED 5 mm','330 Ω','nối cổng AND']}\n};\n\nfunction logic(){\n  const P=st.power;\n  const hot=st.test||st.temp>=TH_T;\n  const S=P&&(st.test||st.smoke>=TH_S);\n  const H=P&&!hot;          // lối ra DO cảm biến nhiệt: 1 khi chưa cháy, 0 khi nóng\n  const N=P&&hot;           // sau cổng NOT\n  return {P,H,N,S,AND:S&&N,OR:S||N};\n}\n\n/* ---------- truth table ---------- */\nconst RES=['Bình thường','Còi kêu','Còi kêu','Còi kêu + LED sáng'];\nfunction renderTT(L){\n  const rows=[[0,1],[1,1],[0,0],[1,0]];\n  $('tt').innerHTML=rows.map(([sv,h],i)=>{\n    const n=1-h,y1=sv&n,y2=sv|n,cur=L.P&&(+L.S===sv&&+L.H===h);\n    const c=v=>'<td class=\"'+(v?'one':'')+'\">'+v+'<\/td>';\n    return '<tr class=\"'+(cur?'cur':'')+'\">'+c(sv)+c(h)+c(n)+c(y1)+c(y2)+'<td>'+RES[i]+'<\/td><\/tr>';\n  }).join('');\n}\n\n/* ---------- UI sync ---------- */\nfunction sync(){\n  const L=logic();\n  $('tempv').textContent=st.temp+' °C';\n  $('smokev').textContent=st.smoke+' %';\n  $('tb').textContent='H='+(+L.H); $('tb').classList.toggle('hi',L.N);\n  $('sb').textContent='S='+(+L.S); $('sb').classList.toggle('hi',L.S);\n  document.querySelectorAll('[data-sig]').forEach(el=>{\n    const on=!!L[el.dataset.sig];\n    el.classList.toggle('on',on);\n    if(el.classList.contains('blk')) el.classList.toggle('alarm',on&&el.dataset.alarm==='1');\n  });\n  const tags={H:'H',N:'N',S:'S',AND:'Y₁',OR:'Y₂'};\n  document.querySelectorAll('.tag').forEach(t=>t.textContent=tags[t.dataset.sig]+'='+(+L[t.dataset.sig]));\n  const s=$('status');\n  s.className='pill '+(!L.P?'':L.AND?'high':L.OR?'fire':'ok');\n  s.querySelector('span').textContent=!L.P?'Mất nguồn':L.AND?'Cháy: còi + LED':L.OR?'Báo động: còi kêu':'An toàn';\n  renderTT(L);\n}\nfunction select(key){\n  st.sel=key;\n  document.querySelectorAll('.blk').forEach(b=>b.classList.toggle('sel',b.dataset.key===key));\n  const d=INFO[key];\n  $('ik').textContent=d.k; $('ih').textContent=d.h; $('ip').textContent=d.p;\n  $('ic').innerHTML=d.c.map(x=>'<span>'+x+'<\/span>').join('');\n  if(window.focus3D) focus3D(key);\n}\ndocument.querySelectorAll('.blk').forEach(b=>{\n  b.addEventListener('click',()=>select(b.dataset.key));\n  b.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select(b.dataset.key)}});\n});\n$('temp').addEventListener('input',e=>{st.temp=+e.target.value;sync()});\n$('smoke').addEventListener('input',e=>{st.smoke=+e.target.value;sync()});\n$('led').addEventListener('input',e=>{st.led=+e.target.value;$('ledv').textContent=st.led+' %'});\n$('pwr').addEventListener('click',e=>{st.power=!st.power;e.target.setAttribute('aria-pressed',st.power);e.target.textContent='Nguồn: '+(st.power?'bật':'tắt');sync()});\n$('test').addEventListener('click',e=>{st.test=!st.test;e.target.setAttribute('aria-pressed',st.test);e.target.textContent=st.test?'Dừng thử':'Thử báo cháy';sync()});\n\n/* ---------- sound ---------- */\n/* Còi chạy độc lập với mô hình 3D. Trình duyệt chỉ cho phát âm sau lần chạm/bấm đầu tiên,\n   nên âm thanh được mở khóa ở lần tương tác đầu tiên bất kỳ trên trang. */\nlet ac=null,gain=null,osc=null;\nfunction ensureAudio(){\n  try{\n    if(!ac){\n      const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;\n      ac=new AC();\n      osc=ac.createOscillator(); osc.type='square'; osc.frequency.value=2800;\n      const tone=ac.createBiquadFilter(); tone.type='lowpass'; tone.frequency.value=5000;\n      gain=ac.createGain(); gain.gain.value=0;\n      osc.connect(tone); tone.connect(gain); gain.connect(ac.destination); osc.start();\n    }\n    if(ac.state!=='running') ac.resume();\n  }catch(err){}\n}\n['pointerdown','keydown','touchend'].forEach(ev=>window.addEventListener(ev,()=>{if(st.sound)ensureAudio()},{capture:true,passive:true}));\nfunction setSoundBtn(){const b=$('snd');b.setAttribute('aria-pressed',st.sound);b.textContent='Âm thanh còi: '+(st.sound?'bật':'tắt')}\n$('snd').addEventListener('click',()=>{st.sound=!st.sound;setSoundBtn();if(st.sound)ensureAudio()});\nsetInterval(()=>{\n  if(!gain) return;\n  const L=logic(), now=ac.currentTime;\n  const on=st.sound&&L.OR&&ac.state==='running';\n  const ph=Math.floor(now*4)%2===0;\n  gain.gain.setTargetAtTime(on&&ph?0.25:0,now,0.004);\n  },40);\nsetSoundBtn();\n\nsync(); select('or');\n\n/* ---------- 3D ---------- */\n(function(){\n  if(!window.THREE){$('stage').insertAdjacentHTML('beforeend','<div class=\"hint\" style=\"top:12px;bottom:auto\">Không tải được thư viện 3D.<\/div>');return}\n  const wrap=$('stage');\n  const renderer=new THREE.WebGLRenderer({antialias:true});\n  renderer.setPixelRatio(Math.min(devicePixelRatio,2));\n  const benchCol=()=>new THREE.Color((getComputedStyle(document.documentElement).getPropertyValue('--bench')||'#d9e3dc').trim());\n  renderer.setClearColor(benchCol());\n  renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;\n  renderer.outputEncoding=THREE.sRGBEncoding;\n  wrap.prepend(renderer.domElement);\n\n  const scene=new THREE.Scene();\n  scene.fog=new THREE.Fog(benchCol(),24,44);\n  const camera=new THREE.PerspectiveCamera(38,1,0.1,100);\n  const HOME=new THREE.Vector3(0,10.5,11.5);\n  camera.position.copy(HOME);\n  const controls=new THREE.OrbitControls(camera,renderer.domElement);\n  controls.enableDamping=true; controls.maxPolarAngle=Math.PI*0.47; controls.minDistance=4; controls.maxDistance=26;\n  const goal=new THREE.Vector3(0,0,0.3); controls.target.copy(goal);\n\n  scene.add(new THREE.HemisphereLight(0xdcefe6,0x0b1510,0.75));\n  const sun=new THREE.DirectionalLight(0xffffff,0.95); sun.position.set(5,11,7); sun.castShadow=true;\n  sun.shadow.mapSize.set(1024,1024); Object.assign(sun.shadow.camera,{left:-8,right:8,top:8,bottom:-8});\n  scene.add(sun);\n  const alarmLight=new THREE.PointLight(0xff4030,0,18); alarmLight.position.set(3,4,0); scene.add(alarmLight);\n\n  // ground + board\n  const ground=new THREE.Mesh(new THREE.PlaneGeometry(60,60),new THREE.MeshStandardMaterial({color:benchCol(),roughness:1}));\n  function syncBench(){const c=benchCol();renderer.setClearColor(c);scene.fog.color.copy(c);ground.material.color.copy(c)}\n  matchMedia('(prefers-color-scheme: dark)').addEventListener('change',syncBench);\n  new MutationObserver(syncBench).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});\n  ground.rotation.x=-Math.PI/2; ground.position.y=-0.6; ground.receiveShadow=true; scene.add(ground);\n  const board=new THREE.Mesh(new THREE.BoxGeometry(12.4,0.3,8),new THREE.MeshStandardMaterial({color:0x0e3a26,roughness:0.55}));\n  board.receiveShadow=true; scene.add(board);\n  const Y=0.15;\n  // mounting holes\n  [[-5.9,-3.6],[5.9,-3.6],[-5.9,3.6],[5.9,3.6]].forEach(([x,z])=>{\n    const r=new THREE.Mesh(new THREE.RingGeometry(0.12,0.22,24),new THREE.MeshStandardMaterial({color:0xc9a35c,metalness:.8,roughness:.3}));\n    r.rotation.x=-Math.PI/2; r.position.set(x,Y+0.005,z); scene.add(r);\n  });\n  // silkscreen\n  function silk(text,x,z,w,size){\n    const c=document.createElement('canvas'); c.width=1024; c.height=128;\n    const g=c.getContext('2d'); g.fillStyle='rgba(235,245,240,.85)'; g.font='600 '+(size||64)+'px \"JetBrains Mono\", monospace';\n    g.textBaseline='middle'; g.fillText(text,8,64);\n    const t=new THREE.CanvasTexture(c); t.encoding=THREE.sRGBEncoding;\n    const m=new THREE.Mesh(new THREE.PlaneGeometry(w,w/8),new THREE.MeshBasicMaterial({map:t,transparent:true,depthWrite:false}));\n    m.rotation.x=-Math.PI/2; m.position.set(x,Y+0.006,z); scene.add(m);\n  }\n\n  const comps={};\n  const pickables=[];\n  function reg(key,group,labelText,labelY){\n    group.traverse(o=>{if(o.isMesh){o.castShadow=true;o.userData.key=key;pickables.push(o)}});\n    scene.add(group); comps[key]={group,labelY};\n    const lab=label(labelText); lab.position.set(group.position.x,labelY,group.position.z); scene.add(lab); comps[key].label=lab;\n  }\n  function label(text){\n    const c=document.createElement('canvas'); c.width=512; c.height=112;\n    const g=c.getContext('2d');\n    g.font='600 46px \"Be Vietnam Pro\", system-ui, sans-serif';\n    const w=Math.min(500,g.measureText(text).width+48);\n    g.fillStyle='rgba(12,19,17,.86)'; g.strokeStyle='rgba(139,163,153,.55)'; g.lineWidth=3;\n    const x0=(512-w)/2; g.beginPath(); g.roundRect?g.roundRect(x0,10,w,92,20):g.rect(x0,10,w,92); g.fill(); g.stroke();\n    g.fillStyle='#e5eee9'; g.textAlign='center'; g.textBaseline='middle'; g.fillText(text,256,58);\n    const t=new THREE.CanvasTexture(c); t.encoding=THREE.sRGBEncoding;\n    const s=new THREE.Sprite(new THREE.SpriteMaterial({map:t,depthTest:false,transparent:true}));\n    s.scale.set(2.3,0.5,1); s.renderOrder=10; return s;\n  }\n  const M=(color,o)=>new THREE.MeshStandardMaterial(Object.assign({color,roughness:.5},o||{}));\n  const metal=M(0xc8ccd0,{metalness:.85,roughness:.3});\n  function leg(x,z,h){const m=new THREE.Mesh(new THREE.CylinderGeometry(.025,.025,h,8),metal);m.position.set(x,h/2,z);return m}\n\n  // battery\n  {const g=new THREE.Group(); g.position.set(-5.05,Y,0.2);\n    const body=new THREE.Mesh(new THREE.BoxGeometry(1.1,0.85,2.3),M(0x24282e)); body.position.y=.425; g.add(body);\n    const band=new THREE.Mesh(new THREE.BoxGeometry(1.12,0.86,0.9),M(0xd6a23a)); band.position.set(0,.425,0.5); g.add(band);\n    const t1=new THREE.Mesh(new THREE.CylinderGeometry(.15,.15,.18,6),metal); t1.position.set(-.25,.94,-.8); g.add(t1);\n    const t2=new THREE.Mesh(new THREE.CylinderGeometry(.18,.18,.18,16),metal); t2.position.set(.25,.94,-.8); g.add(t2);\n    const reg7805=new THREE.Mesh(new THREE.BoxGeometry(.4,.55,.15),M(0x111214)); reg7805.position.set(-.25,.3,-1.55); g.add(reg7805);\n    const tab=new THREE.Mesh(new THREE.BoxGeometry(.4,.3,.04),metal); tab.position.set(-.25,.7,-1.63); g.add(tab);\n    reg('power',g,'Nguồn 9 V',1.7);}\n  // thermistor\n  let bead; const COLD=new THREE.Color(0x2a5fc6), HOT=new THREE.Color(0x7a1a08);\n  {const g=new THREE.Group(); g.position.set(-3.5,Y,1.8);\n    g.add(leg(-.07,0,.55)); g.add(leg(.07,0,.55));\n    bead=new THREE.Mesh(new THREE.SphereGeometry(.22,24,16),M(0x2a5fc6,{roughness:.35,emissive:0xff3a10,emissiveIntensity:0}));\n    bead.scale.set(1,1.15,.65); bead.position.y=.72; g.add(bead);\n    const pad=new THREE.Mesh(new THREE.BoxGeometry(.6,.02,.35),M(0xc9a35c,{metalness:.8,roughness:.3})); pad.position.y=.01; g.add(pad);\n    reg('temp',g,'NTC (T)',1.55);}\n  // smoke sensor\n  const SMOKE_POS=new THREE.Vector3(-3.5,Y,-1.5);\n  {const g=new THREE.Group(); g.position.copy(SMOKE_POS);\n    const base=new THREE.Mesh(new THREE.BoxGeometry(1.25,.12,1.25),M(0x1d4ea6)); base.position.y=.18; g.add(base);\n    [[-.5,-.5],[.5,-.5],[-.5,.5],[.5,.5]].forEach(([x,z])=>g.add(leg(x*0.6,z*0.6,.2)));\n    const can=new THREE.Mesh(new THREE.CylinderGeometry(.45,.45,.15,32),M(0x9aa2a9,{metalness:.7,roughness:.35})); can.position.y=.32; g.add(can);\n    const mesh=new THREE.Mesh(new THREE.CylinderGeometry(.42,.44,.5,32,4,true),new THREE.MeshStandardMaterial({color:0xd7dde2,wireframe:true,metalness:.6,roughness:.4})); mesh.position.y=.62; g.add(mesh);\n    const top=new THREE.Mesh(new THREE.CircleGeometry(.42,32),new THREE.MeshStandardMaterial({color:0xd7dde2,wireframe:true})); top.rotation.x=-Math.PI/2; top.position.y=.87; g.add(top);\n    const core=new THREE.Mesh(new THREE.CylinderGeometry(.18,.18,.4,16),M(0x8a5a2b)); core.position.y=.6; g.add(core);\n    const pot=new THREE.Mesh(new THREE.BoxGeometry(.25,.2,.25),M(0x3d6fe0)); pot.position.set(.45,.34,.45); g.add(pot);\n    reg('smoke',g,'MQ-2 (S)',1.65);}\n  // ICs\n  function ic(key,x,z,name,lab){\n    const g=new THREE.Group(); g.position.set(x,Y,z);\n    const body=new THREE.Mesh(new THREE.BoxGeometry(1.6,.26,.7),M(0x141618,{roughness:.7})); body.position.y=.25; g.add(body);\n    for(let i=0;i<7;i++){for(const s of [-1,1]){const p=new THREE.Mesh(new THREE.BoxGeometry(.08,.26,.2),metal);p.position.set(-.66+i*.22,.12,s*.42);g.add(p)}}\n    const notch=new THREE.Mesh(new THREE.CylinderGeometry(.08,.08,.02,16,1,false,0,Math.PI),M(0x050505)); notch.position.set(-.8,.39,0); g.add(notch);\n    const c=document.createElement('canvas'); c.width=256; c.height=96; const t=c.getContext('2d');\n    t.fillStyle='#bfc7c3'; t.font='600 44px \"JetBrains Mono\", monospace'; t.textAlign='center'; t.textBaseline='middle'; t.fillText(name,128,50);\n    const tx=new THREE.CanvasTexture(c); tx.encoding=THREE.sRGBEncoding;\n    const pl=new THREE.Mesh(new THREE.PlaneGeometry(1.2,.45),new THREE.MeshBasicMaterial({map:tx,transparent:true})); pl.rotation.x=-Math.PI/2; pl.position.y=.385; g.add(pl);\n    reg(key,g,lab,1.25);\n  }\n  ic('not',-1.6,1.9,'74HC04','Cổng NOT');\n  ic('and',1.0,-1.2,'74HC08','Cổng AND');\n  ic('or',1.0,1.9,'74HC32','Cổng OR');\n  // transistor\n  {const g=new THREE.Group(); g.position.set(2.5,Y,1.48);\n    [-.1,0,.1].forEach(x=>g.add(leg(x,0,.35)));\n    const b=new THREE.Mesh(new THREE.CylinderGeometry(.22,.22,.45,24,1,false,0,Math.PI),M(0x111214)); b.position.y=.55; g.add(b);\n    const f=new THREE.Mesh(new THREE.PlaneGeometry(.44,.45),M(0x111214,{side:THREE.DoubleSide})); f.position.y=.55; f.rotation.y=Math.PI/2; g.add(f);\n    reg('amp',g,'Transistor',1.3);}\n  // buzzer\n  let buzz;\n  {const g=new THREE.Group(); g.position.set(4.7,Y,1.48);\n    buzz=new THREE.Mesh(new THREE.CylinderGeometry(.58,.58,.55,40),M(0x121315,{roughness:.6})); buzz.position.y=.28; g.add(buzz);\n    const hole=new THREE.Mesh(new THREE.CylinderGeometry(.1,.1,.02,16),M(0x000000)); hole.position.y=.56; g.add(hole);\n    const ring=new THREE.Mesh(new THREE.TorusGeometry(.3,.02,8,32),M(0x2a2c30)); ring.rotation.x=Math.PI/2; ring.position.y=.56; g.add(ring);\n    reg('buzzer',g,'Còi báo',1.35);}\n  // LEDs\n  const leds={};\n  function led(key,x,z,color,lab){\n    const g=new THREE.Group(); g.position.set(x,Y,z);\n    g.add(leg(-.05,0,.4)); g.add(leg(.05,0,.4));\n    const mat=new THREE.MeshStandardMaterial({color,roughness:.15,transparent:true,opacity:.8,emissive:color,emissiveIntensity:0});\n    const cyl=new THREE.Mesh(new THREE.CylinderGeometry(.17,.19,.32,24),mat); cyl.position.y=.56; g.add(cyl);\n    const dome=new THREE.Mesh(new THREE.SphereGeometry(.17,24,12,0,Math.PI*2,0,Math.PI/2),mat); dome.position.y=.72; g.add(dome);\n    const rim=new THREE.Mesh(new THREE.CylinderGeometry(.21,.21,.05,24),mat); rim.position.y=.41; g.add(rim);\n    const res=new THREE.Mesh(new THREE.CylinderGeometry(.07,.07,.4,12),M(0xd8c39a)); res.rotation.z=Math.PI/2; res.position.set(-.6,.12,0); g.add(res);\n    const light=new THREE.PointLight(color,0,3.5); light.position.y=.9; g.add(light);\n    leds[key]={mat,light};\n    reg(key,g,lab,1.35);\n  }\n  led('ledR',4.5,-0.78,0xff2a1a,'Đèn LED');\n\n  // traces\n  const traces=[];\n  const P=(x,z)=>new THREE.Vector3(x,Y+0.012,z);\n  function trace(sig,pts){\n    const mat=new THREE.MeshStandardMaterial({color:0xb87333,metalness:.75,roughness:.35,emissive:0xffb347,emissiveIntensity:0});\n    const v=pts.map(p=>P(p[0],p[1])); let len=0; const segs=[];\n    for(let i=0;i<v.length-1;i++){\n      const a=v[i],b=v[i+1],d=a.distanceTo(b);\n      const m=new THREE.Mesh(new THREE.BoxGeometry(d+.13,.025,.13),mat);\n      m.position.copy(a).add(b).multiplyScalar(.5);\n      m.rotation.y=-Math.atan2(b.z-a.z,b.x-a.x); m.receiveShadow=true; scene.add(m);\n      segs.push({a,b,d,start:len}); len+=d;\n    }\n    [v[0],v[v.length-1]].forEach(p=>{const pad=new THREE.Mesh(new THREE.CylinderGeometry(.11,.11,.03,16),mat);pad.position.copy(p);scene.add(pad)});\n    const dots=[];\n    const n=Math.max(1,Math.round(len/1.6));\n    for(let i=0;i<n;i++){const d=new THREE.Mesh(new THREE.SphereGeometry(.075,12,8),new THREE.MeshBasicMaterial({color:0xffe08a}));d.visible=false;scene.add(d);dots.push(d)}\n    traces.push({sig,mat,segs,len,dots});\n  }\n  trace('P',[[-4.4,0.2],[-4.4,-1.5],[-4.1,-1.5]]);\n  trace('P',[[-4.4,0.2],[-4.4,1.8],[-3.75,1.8]]);\n  trace('P',[[-4.7,-1.0],[-4.7,-3.3],[1.66,-3.3],[1.66,-1.62]]);\n  trace('H',[[-3.25,1.8],[-2.6,1.8],[-2.6,2.32],[-2.26,2.32]]);\n  trace('N',[[-0.94,2.32],[0.34,2.32]]);\n  trace('N',[[-0.75,2.32],[-0.75,-0.78],[0.34,-0.78]]);\n  trace('S',[[-2.9,-1.5],[-0.2,-1.5],[-0.2,-1.62],[0.34,-1.62]]);\n  trace('S',[[-0.5,-1.5],[-0.5,1.48],[0.34,1.48]]);\n  trace('AND',[[1.66,-0.78],[3.9,-0.78]]);\n  trace('OR',[[1.66,1.48],[2.3,1.48]]);\n  trace('OR',[[2.7,1.48],[4.1,1.48]]);\n  silk('MẠCH BÁO CHÁY · CN12',-1.8,3.55,4.2,60);\n  silk('+9V',-5.6,-1.7,1.2,90);\n  function pointAt(tr,dist){\n    for(const s of tr.segs){if(dist<=s.start+s.d) return s.a.clone().lerp(s.b,(dist-s.start)/s.d)}\n    const l=tr.segs[tr.segs.length-1]; return l.b.clone();\n  }\n\n  // smoke particles\n  const N=180, pos=new Float32Array(N*3), life=new Float32Array(N), vel=[];\n  for(let i=0;i<N;i++){life[i]=-1;pos[i*3+1]=-50;vel.push(new THREE.Vector3())}\n  const sg=new THREE.BufferGeometry(); sg.setAttribute('position',new THREE.BufferAttribute(pos,3));\n  const pc=document.createElement('canvas'); pc.width=pc.height=64; const pg=pc.getContext('2d');\n  const grd=pg.createRadialGradient(32,32,0,32,32,32); grd.addColorStop(0,'rgba(255,255,255,1)'); grd.addColorStop(1,'rgba(255,255,255,0)');\n  pg.fillStyle=grd; pg.fillRect(0,0,64,64);\n  const smokeMat=new THREE.PointsMaterial({size:.7,map:new THREE.CanvasTexture(pc),color:0xaab4b0,transparent:true,opacity:.0,depthWrite:false});\n  const smokePts=new THREE.Points(sg,smokeMat); smokePts.frustumCulled=false; scene.add(smokePts);\n\n  // selection ring\n  const selRing=new THREE.Mesh(new THREE.RingGeometry(.85,.97,48),new THREE.MeshBasicMaterial({color:0xf2c14e,transparent:true,opacity:.9,side:THREE.DoubleSide}));\n  selRing.rotation.x=-Math.PI/2; scene.add(selRing);\n\n  let focusing=0;\n  window.focus3D=key=>{\n    const c=comps[key]; if(!c) return;\n    selRing.position.set(c.group.position.x,Y+0.02,c.group.position.z);\n    goal.set(c.group.position.x*0.6,0,c.group.position.z*0.6+0.2); focusing=60;\n  };\n  focus3D(st.sel);\n  $('reset').addEventListener('click',()=>{goal.set(0,0,0.3);camera.position.copy(homePos());focusing=0;controls.target.copy(goal);moved=false});\n\n  // picking\n  const ray=new THREE.Raycaster(), mv=new THREE.Vector2(); let down=null;\n  renderer.domElement.addEventListener('pointerdown',e=>{down=[e.clientX,e.clientY];focusing=0});\n  renderer.domElement.addEventListener('pointerup',e=>{\n    if(!down||Math.hypot(e.clientX-down[0],e.clientY-down[1])>6) return;\n    const r=renderer.domElement.getBoundingClientRect();\n    mv.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);\n    ray.setFromCamera(mv,camera);\n    const hit=ray.intersectObjects(pickables,false)[0];\n    if(hit) select(hit.object.userData.key);\n  });\n\n  let moved=false;\n  renderer.domElement.addEventListener('pointerdown',()=>{moved=true});\n  renderer.domElement.addEventListener('wheel',()=>{moved=true},{passive:true});\n  function homePos(){return HOME.clone().multiplyScalar(Math.max(1,1.4/camera.aspect))}\n  function resize(){const w=wrap.clientWidth,h=wrap.clientHeight;if(!w||!h)return;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();if(!moved)camera.position.copy(homePos())}\n  new ResizeObserver(resize).observe(wrap); resize();\n\n  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;\n  const clock=new THREE.Clock(); let emitAcc=0, pi=0;\n  function frame(){\n    const dt=Math.min(clock.getDelta(),.05), t=clock.elapsedTime;\n    const L=logic();\n    // traces\n    for(const tr of traces){\n      const on=!!L[tr.sig];\n      tr.mat.emissiveIntensity+=((on?.55:0)-tr.mat.emissiveIntensity)*.15;\n      tr.dots.forEach((d,i)=>{\n        d.visible=on&&!reduce;\n        if(d.visible){const dist=((t*1.4)+i*tr.len/tr.dots.length)%tr.len;d.position.copy(pointAt(tr,dist));d.position.y+=.05}\n      });\n    }\n    // thermistor glow\n    const heat=st.power?Math.max(0,(st.test?80:st.temp)-35)/55:0;\n    bead.material.emissiveIntensity=heat*1.2; bead.material.color.copy(COLD).lerp(HOT,Math.min(1,heat));\n    // smoke\n    const dens=(st.test?75:st.smoke)/100;\n    emitAcc+=dens*dt*70;\n    while(emitAcc>1){emitAcc--;const i=pi++%N;life[i]=0;\n      pos[i*3]=SMOKE_POS.x+(Math.random()-.5)*.5; pos[i*3+1]=Y+.9; pos[i*3+2]=SMOKE_POS.z+(Math.random()-.5)*.5;\n      vel[i].set((Math.random()-.5)*.25,.55+Math.random()*.4,(Math.random()-.5)*.25)}\n    for(let i=0;i<N;i++){if(life[i]<0)continue;life[i]+=dt;\n      if(life[i]>4){life[i]=-1;pos[i*3+1]=-50;continue}\n      pos[i*3]+=vel[i].x*dt+Math.sin(t+i)*.004; pos[i*3+1]+=vel[i].y*dt; pos[i*3+2]+=vel[i].z*dt}\n    sg.attributes.position.needsUpdate=true;\n    smokeMat.opacity=.15+dens*.45;\n    // actuators\n    const blink=Math.floor(t*4)%2===0;\n    const rOn=L.AND;\n    const k=st.led/100; leds.ledR.mat.emissiveIntensity=rOn?2.2*k:0; leds.ledR.light.intensity=rOn?2.2*k:0;\n    alarmLight.intensity=(L.AND?(blink?1.1:.3):L.OR?(blink?.45:0):0)*k;\n    const vib=L.OR&&!reduce?Math.sin(t*90)*.015:0;\n    buzz.scale.set(1+vib,1,1+vib);\n    // selection ring pulse + focus\n    selRing.material.opacity=.55+Math.sin(t*3)*.35;\n    if(focusing>0){controls.target.lerp(goal,.08);focusing--}\n    controls.update();\n    renderer.render(scene,camera);\n    requestAnimationFrame(frame);\n  }\n  frame();\n  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{\n    for(const k in comps){const c=comps[k];const txt={power:'Nguồn 9 V',temp:'NTC (T)',smoke:'MQ-2 (S)',not:'Cổng NOT',or:'Cổng OR',and:'Cổng AND',amp:'Transistor',buzzer:'Còi báo',ledR:'Đèn LED'}[k];\n      const n=label(txt); n.position.copy(c.label.position); scene.remove(c.label); scene.add(n); c.label=n;}\n  });\n})();\n<\/script>\n\n<\/body>\n<\/html>\n"};
const TITLE={"21":"Bài 21. Tín hiệu số và các cổng logic","22":"Bài 22. Một số mạch xử lí tín hiệu trong điện tử số","23":"Bài 23. Thực hành: Mạch báo cháy sử dụng cổng logic cơ bản"};
