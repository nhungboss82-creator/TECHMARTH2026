<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bài 9. Hình chiếu vuông góc – SmarttechCN 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* SmarttechCN 2026 – giao diện "giấy bản vẽ": xanh bản vẽ kĩ thuật + vàng an toàn xưởng cơ khí */
:root{
  --bg:#f3f6fa; --card:#ffffff; --ink:#132033; --muted:#5a6a80; --line:#e0e6ef; --line2:#cfd8e5;
  --brand:#123a86; --brand2:#1f5bd6; --brand-ink:#ffffff; --info-soft:#e9f0fe;
  --accent:#f2a516; --accent-soft:#fff3d6; --accent-ink:#3d2700;
  --ok:#11845a; --ok-soft:#e3f5ec; --bad:#cf3f36; --bad-soft:#fdeceb;
  --r:16px; --r-sm:12px; --r-lg:22px;
  --shadow:0 1px 2px rgba(19,32,51,.05),0 6px 18px -8px rgba(19,32,51,.12);
  --grid:rgba(255,255,255,.09);
  --top:56px; --tab:66px;
  --font:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1420; --card:#151f2e; --ink:#e7edf6; --muted:#97a6bb; --line:#243145; --line2:#2f3e55;
  --brand:#0f2c66; --brand2:#6b9bff; --brand-ink:#0b1424; --info-soft:#18284a;
  --accent:#f5b53b; --accent-soft:#3a2d12; --accent-ink:#2b1c00;
  --ok:#3ec98f; --ok-soft:#123326; --bad:#ff7a70; --bad-soft:#3a1c1b;
  --shadow:none; --grid:rgba(255,255,255,.07);
 color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0d1420; --card:#151f2e; --ink:#e7edf6; --muted:#97a6bb; --line:#243145; --line2:#2f3e55;
  --brand:#0f2c66; --brand2:#6b9bff; --brand-ink:#0b1424; --info-soft:#18284a;
  --accent:#f5b53b; --accent-soft:#3a2d12; --accent-ink:#2b1c00;
  --ok:#3ec98f; --ok-soft:#123326; --bad:#ff7a70; --bad-soft:#3a1c1b;
  --shadow:none; --grid:rgba(255,255,255,.07);
 color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.55}
body{min-height:100vh;-webkit-tap-highlight-color:transparent}
img{max-width:100%;height:auto}
a{color:var(--brand2)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--brand2);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- Khung app: thanh trên + thanh điều hướng ---------- */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;height:calc(var(--top) + env(safe-area-inset-top));
  padding:env(safe-area-inset-top) 16px 0;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;color:var(--ink);text-decoration:none;font-weight:800;font-size:17px;letter-spacing:-.2px}
.brand img{width:30px;height:30px;border-radius:9px}
.brand b{color:var(--brand2);font-weight:800;margin-left:2px}
.top-right{display:flex;align-items:center;gap:10px}
.net{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);font-weight:600}
.net::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok)}
.net.off{color:#8a5a00}
.net.off::before{background:var(--accent)}
@media (prefers-color-scheme:dark){.net.off{color:var(--accent)}}
.icon-btn{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line2);background:var(--card);color:var(--brand2);font-weight:800;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.menu{position:fixed;right:12px;top:calc(var(--top) + env(safe-area-inset-top) + 6px);z-index:40;background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:0 18px 40px -12px rgba(19,32,51,.28);min-width:250px;padding:6px}
.menu .who{padding:12px;border-bottom:1px solid var(--line);font-size:13.5px;color:var(--muted);margin-bottom:4px}
.menu .who b{display:block;color:var(--ink);font-size:15.5px}
.menu a,.menu button{display:block;width:100%;text-align:left;padding:10px 12px;border:0;background:none;border-radius:10px;text-decoration:none;color:var(--ink);cursor:pointer;font-size:15px}
.menu a:hover,.menu button:hover{background:var(--info-soft)}
.menu [data-out]{color:var(--bad)}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:25;display:grid;grid-template-columns:repeat(4,1fr);height:calc(var(--tab) + env(safe-area-inset-bottom));
  padding:4px 6px env(safe-area-inset-bottom);background:var(--card);border-top:1px solid var(--line)}
.tabbar a{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-decoration:none;color:var(--muted);font-size:11.5px;font-weight:600;border-radius:14px}
.tabbar svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabbar a.on{color:var(--brand2)}
.tabbar a.on .tico{background:var(--info-soft)}
.tabbar .tico{display:flex;align-items:center;justify-content:center;width:52px;height:30px;border-radius:15px;transition:background .2s}
.tabbar .dot{position:absolute;top:4px;left:calc(50% + 10px);min-width:17px;height:17px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:10.5px;line-height:17px;text-align:center}
body.focus .tabbar{display:none}
body.focus .view{padding-bottom:28px}

.view{max-width:880px;margin:0 auto;padding:16px 16px calc(var(--tab) + 34px)}
@media (min-width:980px){
  .tabbar{top:calc(var(--top) + env(safe-area-inset-top));bottom:0;right:auto;width:96px;height:auto;grid-template-columns:1fr;grid-auto-rows:78px;align-content:start;
    padding:14px 8px;border-top:0;border-right:1px solid var(--line);background:transparent}
  body:not(.focus) .view,body:not(.focus) .menu-shift{margin-left:max(112px,calc((100vw - 880px) / 2))}
  .view{padding-bottom:40px}
}
.loading{padding:60px 0;text-align:center;color:var(--muted)}

/* ---------- Chữ ---------- */
h1{font-size:24px;margin:4px 0 6px;line-height:1.25;letter-spacing:-.4px;font-weight:800}
h2{font-size:18px;margin:26px 0 10px;letter-spacing:-.2px;font-weight:700}
h3{font-size:16px;margin:14px 0 6px}
.sub{color:var(--muted);margin:0 0 16px;font-size:14.5px}
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:26px 0 10px}
.sechead h2{margin:0}
.sechead a{font-size:14px;font-weight:600;text-decoration:none}

/* ---------- Khối nội dung ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.tile{display:flex;flex-direction:column;gap:4px;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);padding:16px;box-shadow:var(--shadow);cursor:pointer;text-align:left;width:100%;transition:border-color .15s,transform .15s}
.tile:hover{border-color:var(--brand2)}
.tile:active{transform:scale(.985)}
.tile .ic{font-size:24px;width:44px;height:44px;border-radius:13px;background:var(--info-soft);display:flex;align-items:center;justify-content:center;margin-bottom:6px}
.tile b{font-size:15.5px}
.tile span{color:var(--muted);font-size:13.5px}

/* Thẻ chào – nền lưới giấy vẽ kĩ thuật (điểm nhấn của app) */
.hero{position:relative;overflow:hidden;background-color:var(--brand);color:#fff;border-radius:var(--r-lg);padding:20px;margin-bottom:16px;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px),
    linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);
  background-size:40px 40px,40px 40px,8px 8px,8px 8px;background-position:-1px -1px}
.hero h1{color:#fff}
.hero .sub{color:rgba(255,255,255,.82);margin:0}
.hero a{color:#fff}
.stats{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.stat{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:8px 12px;min-width:92px}
.stat b{display:block;font-size:20px}
.stat span{font-size:12px;opacity:.85}
/* Đường kích thước: tiến độ mục tiêu trong ngày */
.dim{margin-top:18px}
.dim .lbl{display:flex;justify-content:space-between;font-size:12.5px;color:rgba(255,255,255,.85);margin-bottom:6px}
.dim .lbl b{color:#fff;font-size:13.5px}
.dim .line{position:relative;height:14px}
.dim .line::before{content:"";position:absolute;left:0;right:0;top:6px;height:1.5px;background:rgba(255,255,255,.45)}
.dim .line::after{content:"";position:absolute;left:0;right:0;top:0;bottom:0;border-left:1.5px solid rgba(255,255,255,.6);border-right:1.5px solid rgba(255,255,255,.6)}
.dim .fill{position:absolute;left:0;top:4px;height:6px;border-radius:3px;background:var(--accent);max-width:100%;transition:width .6s}
.greet{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.streak{flex:none;display:flex;align-items:center;gap:6px;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:6px 12px;font-weight:800;font-size:14px}

/* Lối tắt trang chủ */
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (min-width:640px){.quick{grid-template-columns:repeat(6,1fr)}}
.qa{display:flex;flex-direction:column;align-items:center;gap:7px;padding:14px 6px 12px;border-radius:var(--r);background:var(--card);border:1px solid var(--line);
  text-decoration:none;color:var(--ink);font-size:13px;font-weight:600;text-align:center;line-height:1.25;cursor:pointer;transition:border-color .15s,transform .15s}
.qa:hover{border-color:var(--brand2)}
.qa:active{transform:scale(.97)}
.qa .ic{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:23px;background:var(--info-soft)}
.qa.amber .ic{background:var(--accent-soft)}
.qa.green .ic{background:var(--ok-soft)}
.qa.red .ic{background:var(--bad-soft)}

/* Danh sách dạng hàng (trang Ôn luyện, Việc cần làm) */
.rows{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.rows > a,.rows > button,.rows > .r{display:flex;align-items:center;gap:14px;width:100%;padding:13px 14px;text-decoration:none;color:var(--ink);background:none;border:0;
  border-top:1px solid var(--line);text-align:left;cursor:pointer;font-size:15px}
.rows > :first-child{border-top:0}
.rows > a:hover,.rows > button:hover{background:var(--info-soft)}
.rows .ic{flex:none;width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:21px;background:var(--info-soft)}
.rows .ic.amber{background:var(--accent-soft)}
.rows .ic.green{background:var(--ok-soft)}
.rows .ic.red{background:var(--bad-soft)}
.rows .tx{flex:1;min-width:0}
.rows .tx b{display:block;font-weight:700}
.rows .tx span{display:block;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.rows .chev{color:var(--line2);font-size:22px;flex:none}
.rows .go{flex:none}

/* ---------- Nút & biểu mẫu ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:var(--r-sm);padding:11px 18px;cursor:pointer;
  background:var(--brand2);color:#fff;font-weight:700;text-decoration:none;min-height:46px;transition:filter .15s,transform .1s}
@media (prefers-color-scheme:dark){.btn{color:var(--brand-ink)}}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:var(--card);color:var(--brand2);border:1.5px solid var(--line2)}
.btn.accent{background:var(--accent);color:var(--accent-ink)}
.btn.danger{background:var(--bad);color:#fff}
.btn.sm{padding:6px 12px;min-height:36px;font-size:14px;border-radius:10px}
.btn.block{width:100%}
.btn.sm.on{background:var(--brand2);color:#fff;border-color:var(--brand2)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.spacer{flex:1}
label{display:block;font-size:14px;font-weight:600;margin:14px 0 6px}
input[type=text],input[type=password],input[type=email],input[type=number],input[type=datetime-local],select,textarea{
  width:100%;padding:11px 13px;border:1.5px solid var(--line2);border-radius:var(--r-sm);background:var(--card);min-height:46px}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand2);box-shadow:0 0 0 3px var(--info-soft)}
.hint{font-size:13px;color:var(--muted);margin-top:4px}
.tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);padding:4px;border-radius:14px;margin-bottom:14px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1;border:0;background:transparent;padding:9px 12px;border-radius:10px;cursor:pointer;font-weight:600;color:var(--muted);white-space:nowrap;font-size:14.5px}
.tabs button.on{background:var(--info-soft);color:var(--brand2)}
.auth{max-width:440px;margin:8px auto}
.err{background:var(--bad-soft);color:var(--bad);padding:10px 12px;border-radius:10px;font-size:14px;margin-top:10px}
.okmsg{background:var(--ok-soft);color:var(--ok);padding:10px 12px;border-radius:10px;font-size:14px;margin-top:10px}
.pill{display:inline-block;font-size:12px;padding:2px 9px;border-radius:999px;background:var(--info-soft);color:var(--brand2);font-weight:700}
.pill.warn{background:var(--accent-soft);color:#7a4c00}
@media (prefers-color-scheme:dark){.pill.warn{color:var(--accent)}}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-decoration:none;color:var(--ink)}
a.item:hover{border-color:var(--brand2)}
.item .meta{font-size:13px;color:var(--muted)}
.item .grow{flex:1;min-width:0}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.chk{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line2);border-radius:var(--r-sm);padding:8px 12px;cursor:pointer;font-weight:500;font-size:14px;margin:0;background:var(--card)}
.chk input{width:18px;height:18px;accent-color:var(--brand2)}
.chk:has(input:checked){border-color:var(--brand2);background:var(--info-soft)}

/* ---------- Làm bài ---------- */
.qbar{position:sticky;top:calc(var(--top) + env(safe-area-inset-top));z-index:10;background:var(--bg);padding:10px 0;display:flex;align-items:center;gap:10px}
.qbar .title{font-weight:700;font-size:15px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer{font-variant-numeric:tabular-nums;font-weight:800;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 10px}
.timer.low{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.progress{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-bottom:12px}
.progress i{display:block;height:100%;background:var(--brand2);transition:width .25s}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.qhead{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:12px;font-size:13px;color:var(--muted)}
.qnum{font-weight:800;color:var(--brand2);font-size:15px}
.stem{font-size:17px;line-height:1.6}
.stem img.pic,.opt img.pic,.expl img.pic{display:block;margin:10px auto;border-radius:6px;background:#fff}
img.f{display:inline-block;vertical-align:middle;margin:0 2px;background:#fff;border-radius:3px;max-width:100%}
@media (prefers-color-scheme:dark){img.pic,img.f{filter:invert(.92) hue-rotate(180deg)}}
.opts{display:flex;flex-direction:column;gap:9px;margin-top:16px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--card);border:1.5px solid var(--line2);
  border-radius:14px;padding:12px 14px;cursor:pointer;min-height:52px;transition:border-color .12s,background .12s}
.opt:hover{border-color:var(--brand2)}
.opt .L{flex:none;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;background:var(--info-soft);color:var(--brand2)}
.opt .tx{flex:1;padding-top:3px;min-width:0;overflow-wrap:anywhere}
.opt.sel{border-color:var(--brand2);background:var(--info-soft)}
.opt.sel .L{background:var(--brand2);color:#fff}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .L{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .L{background:var(--bad);color:#fff}
.tf{display:flex;flex-direction:column;gap:9px;margin-top:16px}
.tfi{border:1.5px solid var(--line2);border-radius:14px;padding:12px 14px}
.tfi .tx{margin-bottom:8px;overflow-wrap:anywhere}
/* Đúng/Sai gọn: nội dung bên trái, 2 ô Đ – S nhỏ bên phải */
.tf{gap:7px}
.tfi{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;column-gap:12px;padding:9px 10px 9px 14px}
.tfi .tx{margin-bottom:0}
.tfi .tfb{gap:6px}
.tfi .tfb button{flex:0 0 auto;width:44px;min-height:38px;padding:0;font-size:16px}
.tfi .hint{grid-column:1/-1;margin-top:4px}
.tfi .tx b.k{color:var(--brand2);margin-right:4px}
.tfb{display:flex;gap:8px}
.tfb button{flex:1;border:1.5px solid var(--line2);background:var(--card);border-radius:10px;padding:8px;cursor:pointer;font-weight:700;min-height:42px}
.tfb button.on.d{background:var(--ok);border-color:var(--ok);color:#fff}
.tfb button.on.s{background:var(--bad);border-color:var(--bad);color:#fff}
.tfi.right{border-color:var(--ok);background:var(--ok-soft)}
.tfi.wrong{border-color:var(--bad);background:var(--bad-soft)}
.nav{display:flex;gap:10px;margin-top:14px}
.nav .btn{flex:1}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px;margin-top:16px}
.pal button{border:1.5px solid var(--line2);background:var(--card);border-radius:10px;height:40px;cursor:pointer;font-weight:700;font-size:14px}
.pal button.done{background:var(--info-soft);border-color:var(--brand2);color:var(--brand2)}
.pal button.cur{outline:2.5px solid var(--accent);outline-offset:1px}
.pal button.flag{background:var(--accent-soft);border-color:var(--accent)}
.pal button.r{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.pal button.w{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.secttl{font-size:14px;font-weight:700;color:var(--brand2);margin:16px 0 0}
.expl{margin-top:12px;border-left:4px solid var(--accent);background:var(--accent-soft);padding:10px 12px;border-radius:0 12px 12px 0;font-size:15px}
.expl.ans{border-color:var(--ok);background:var(--ok-soft)}
.expl.ai{border-left-color:var(--brand2);background:var(--info-soft)}
.expl b.t{display:block;margin-bottom:2px}

/* ---------- Kết quả ---------- */
.score{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.ring{--p:0;width:118px;height:118px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
  background:conic-gradient(var(--accent) calc(var(--p)*1%),rgba(255,255,255,.18) 0)}
.ring div{width:94px;height:94px;border-radius:50%;background:var(--brand);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff}
.ring b{font-size:28px;line-height:1}
.ring span{font-size:12px;opacity:.85}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12.5px;color:var(--muted);font-weight:600}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.me td{background:var(--accent-soft);font-weight:700}
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.medal{font-size:18px}
.empty{text-align:center;color:var(--muted);padding:28px 10px}
.bars{display:flex;flex-direction:column;gap:7px}
.bar{display:grid;grid-template-columns:minmax(120px,40%) 1fr 44px;gap:10px;align-items:center;font-size:14px}
.bar .tr{height:10px;background:var(--line);border-radius:6px;overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--bad)}
.bar .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.kpi b{display:block;font-size:22px;font-variant-numeric:tabular-nums;letter-spacing:-.3px}
.kpi span{font-size:12.5px;color:var(--muted)}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:22px;font-weight:800;letter-spacing:3px;color:var(--brand2)}
.toast{position:fixed;left:50%;bottom:calc(var(--tab) + 18px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(200px);background:#132033;color:#fff;padding:11px 18px;
  border-radius:12px;z-index:50;transition:transform .25s;max-width:calc(100% - 32px);font-size:14.5px;box-shadow:0 10px 30px -10px rgba(0,0,0,.4)}
.toast.show{transform:translateX(-50%) translateY(0)}
.preview{border:1px dashed var(--line2);border-radius:12px;padding:12px;margin-top:8px}
.demo{background:var(--accent-soft);border:1px solid var(--accent);border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:14px}
@media (max-width:520px){
  .view{padding:12px 14px calc(var(--tab) + 30px)}
  h1{font-size:22px}
  .stem{font-size:16.5px}
}

/* ---------- Tự luận, chọn dạng câu, bài được giao ---------- */
textarea.essay{width:100%;min-height:170px;margin-top:12px;line-height:1.6;font-size:16px}
.essay-ans{margin-top:10px;padding:10px 12px;border:1px dashed var(--line2);border-radius:12px;white-space:pre-wrap;background:var(--bg)}
.essay-ans .lbl{font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:4px;white-space:normal}
.ok-list{margin-top:6px;color:var(--ok);font-size:14.5px}
.miss-list{margin-top:4px;color:var(--bad);font-size:14.5px}
.card.note{background:var(--accent-soft);border-color:transparent;font-size:15px;box-shadow:none}
.typegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:4px}
.tycard{display:flex;flex-direction:column;gap:2px;padding:12px;border:1.5px solid var(--line2);border-radius:14px;cursor:pointer;background:var(--card);position:relative}
.tycard input{position:absolute;opacity:0;pointer-events:none}
.tycard .ic{font-size:22px}
.tycard.on{border-color:var(--brand2);background:var(--info-soft)}
.tycard.none{opacity:.6}
.tycard:focus-within{outline:2px solid var(--brand2);outline-offset:2px}
.pickinfo{margin-top:12px;padding:9px 12px;border-radius:12px;background:var(--info-soft);font-size:14.5px}
.asgtabs button{display:flex;align-items:center;justify-content:center;gap:6px}
.asgtabs .badge{background:var(--bad);color:#fff;border-radius:20px;font-size:12px;padding:0 7px;line-height:18px}
.asgtabs .cnt{font-size:12px;color:var(--muted);font-weight:500}
.sgklink{display:inline-block;margin-top:8px;font-size:14.5px;font-weight:600;text-decoration:none}
.sgklink:hover{text-decoration:underline}
.pdfbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.pdfbar select{min-width:0;flex:1}
.pdfbar .pg{display:flex;align-items:center;gap:6px;font-size:14.5px}
.pdfbar .pg input{width:64px;padding:6px 8px}
.pdfwrap{background:#e6ebf2;border-radius:var(--r);overflow:auto;min-height:60vh;text-align:center;padding:6px;touch-action:pan-y pinch-zoom}
.pdfwrap canvas{display:block;margin:0 auto;background:#fff;box-shadow:var(--shadow)}
.pdfwrap .hint{padding:10px}
@media (prefers-color-scheme:dark){.pdfwrap{background:#0a111c}}
.pdfwrap.drive{padding:0;min-height:0;height:72vh}
.pdfwrap.drive iframe{width:100%;height:100%;border:0;border-radius:var(--r);background:#fff}
.pagehint{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.pagehint .btn{margin-left:auto}
@media (max-width:520px){.asgtabs button{font-size:13px;padding:8px 6px}}

/* Trang tự chọn ôn luyện: nút bắt đầu ở trên, danh sách bài gọn */
.startbar{position:sticky;top:calc(var(--top) + env(safe-area-inset-top));z-index:9;display:flex;gap:10px;align-items:center;background:var(--bg);padding:8px 0 10px;margin-bottom:6px}
.startbar .pickinfo{margin:0;font-size:13px;padding:8px 10px;line-height:1.35}
.startbar .btn{white-space:nowrap;flex:none}
.lessonlist{display:flex;flex-direction:column;gap:3px;margin-top:6px;max-height:min(46vh,420px);overflow:auto;border:1px solid var(--line);border-radius:12px;padding:4px;background:var(--card)}
.lchk{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:500;line-height:1.3;margin:0}
.lchk input{width:16px;height:16px;flex:none;accent-color:var(--brand2)}
.lchk .n{font-size:11.5px;color:var(--muted);flex:none}
.lchk:has(input:checked){background:var(--info-soft);color:var(--brand2)}
.lchk:hover{background:var(--info-soft)}
.list.compact .item{padding:8px 12px;gap:8px}
.list.compact .item b{font-size:14px}
.list.compact .item .meta{font-size:12px}
.list.compact .item{flex-wrap:wrap;row-gap:6px}
.list.compact .item .grow{flex:1 1 220px;min-width:0}
.list.compact .item>.row{margin-left:auto;gap:6px;flex-wrap:nowrap}
.list.compact .item .btn.sm{padding:6px 10px;font-size:13px}
/* Bảng điểm lớp */
.bdgrp{margin-top:10px}
.bdhead{background:var(--info-soft);font-size:13.5px}
.bdtable th,.bdtable td{font-size:13px;padding:6px 8px;white-space:nowrap}
.bdtable td:nth-child(2),.bdtable th:nth-child(2){position:sticky;left:0;background:var(--card);z-index:1}
/* Giao bài: số câu theo mức, bảng ma trận theo bài */
.lvgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-top:6px}
.lvgrid label{margin-top:6px}
.lvgrid .hint{display:block;margin-top:2px}
.mttable{font-size:13.5px}
.mttable td,.mttable th{padding:4px 6px;vertical-align:middle}
.mttable td:first-child{min-width:180px;line-height:1.3}
.mttable input{width:52px;padding:5px 4px;text-align:center;font-size:14px;min-height:0}
.mttable input.over{border-color:var(--bad);background:var(--bad-soft)}
.mttable small{display:block;color:var(--muted);font-size:11px}
.mttable tr.on td{background:var(--info-soft)}
.mttable tfoot th{border-top:2px solid var(--line2);font-size:14px}
@media (max-width:560px){.mttable td:first-child{min-width:130px}.mttable input{width:42px}}
/* Xem trước đề + mã QR bài giao */
.pvq{padding:8px 0;border-bottom:1px solid var(--line)}
.pvq:last-child{border-bottom:0}
.pvq .q{margin:0}
.pvq .ops{display:grid;grid-template-columns:1fr 1fr;gap:2px 16px;margin-top:4px}
.pvq img{max-width:100%;max-height:260px}
.pvact{display:flex;gap:4px;flex-shrink:0}
.sec{margin:12px 0 4px}
.qrbox{width:190px;flex-shrink:0;background:#fff;padding:6px;border-radius:10px;border:1px solid var(--line)}
.qrbox svg{width:100%;height:auto;display:block}
.qrcard.fresh{border-color:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}
.qrfull{position:fixed;inset:0;z-index:999;background:#fff;color:#000;display:flex;align-items:center;justify-content:center;text-align:center;padding:16px}
.qrfull h2{font-size:clamp(20px,4vw,40px);margin:0 0 4px}.qrfull p{font-size:clamp(14px,2.4vw,24px);margin:0 0 10px;color:#333}
.qrfull .qrbig svg{width:min(78vh,90vw);height:min(78vh,90vw)}
@media (max-width:560px){.pvq .ops{grid-template-columns:1fr}.qrbox{width:150px}}
.pvq>.row{flex-wrap:nowrap}.pvq .grow{min-width:0}
.qrcard>.row{flex-wrap:nowrap}.qrcard .grow{min-width:0;flex:1}@media (max-width:560px){.qrcard>.row{flex-wrap:wrap}}
/* AI soạn câu hỏi + AI phân tích kết quả */
.aiq textarea,.aiq input[type=text]{width:100%}
.aiq.saved{opacity:.65;border-color:var(--ok)}
.aio{margin-top:6px}
.aicard{border-color:var(--brand2);background:linear-gradient(0deg,var(--card),var(--info-soft))}
.airep h3{margin:14px 0 6px}
.airep ul,.airep ol{margin:4px 0 8px;padding-left:22px}
.aigrp{padding:8px 10px;border-radius:10px;margin:6px 0;border:1px solid var(--line)}
.aigrp.bad{background:var(--bad-soft)}.aigrp.ok{background:var(--ok-soft)}.aigrp.mid{background:var(--info-soft)}
.aigrp .hint span{opacity:.75;font-size:12px}
.aisai li{margin:6px 0}
.aio label.row,.aio .row{display:flex;flex-wrap:nowrap;margin:3px 0}.aio .row input{min-width:0}
.herosub{font-size:14px;line-height:1.45}.herosub b{display:block;font-size:15px}.herosub span{display:block;font-size:12.5px;opacity:.85;margin-top:2px}
/* Bộ đề luyện thi TN THPT */
.degrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.decard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;border-left:5px solid var(--line2)}
.decard.good{border-left-color:var(--ok)}.decard.ok{border-left-color:#e0a800}.decard.low{border-left-color:var(--bad)}
.deno{min-width:44px;height:44px;border-radius:12px;background:var(--info-soft);color:var(--brand2);font-weight:800;font-size:18px;display:flex;align-items:center;justify-content:center;margin-right:10px}
.decard>.row:first-child{flex-wrap:nowrap}.decard .grow{min-width:0}
/* GV quản lý đề luyện thi TN */
.detable tr.click{cursor:pointer}.detable tr.click:hover td{background:var(--info-soft)}.detable tr.muted td{color:var(--muted)}
.stuans{display:flex;flex-wrap:wrap;gap:6px}
.stuans .sa{font-size:13px;padding:4px 8px;border-radius:8px;border:1px solid var(--line);background:var(--card)}
.stuans .sa.ok{border-color:var(--ok);background:var(--ok-soft)}.stuans .sa.bad{border-color:var(--bad);background:var(--bad-soft)}.stuans .sa.skip{opacity:.6}
.stuans .sa i{font-style:normal;color:var(--muted)}
/* Trò chơi góc chiếu */
.gcwrap{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.gcgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;max-width:520px;margin:12px auto 0;align-items:center}
.gcslot{min-height:110px;border:2px dashed var(--line2);border-radius:12px;background:var(--card);display:flex;align-items:center;justify-content:center;padding:6px;cursor:pointer}
.gcslot.can{border-color:var(--brand2);background:var(--info-soft)}
.gcslot.ok{border:3px solid var(--ok);background:var(--ok-soft)}.gcslot.bad{border:3px solid var(--bad);background:var(--bad-soft)}
.gcfront{display:flex;flex-direction:column;align-items:center;gap:4px;border:2px solid #e53935;border-radius:12px;padding:6px;background:#fff}
.gcfront span{font-size:12px;font-weight:700;color:#e53935}
.gccard{border:2px solid var(--line);border-radius:12px;background:#fff;padding:6px;cursor:pointer}
.gccard.on{border-color:var(--brand2);box-shadow:0 0 0 3px var(--info-soft)}
.gcslot svg,.gccard svg,.gcfront svg{max-width:100%;height:auto}
.gcpick{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.gcpick button{border:1px solid var(--line2);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:13.5px;cursor:pointer}
.gcpick button.on{background:var(--brand2);border-color:var(--brand2);color:#fff}
.gcbig{max-width:100%;height:auto;border-radius:10px;background:#fff}
.gcimgs{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:flex-end}
.gcimgs figure{margin:0;text-align:center;background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px}
.gcimgs img{max-height:170px;max-width:220px;height:auto;width:auto;display:block}
.gcimgs figcaption{font-weight:700;font-size:13px;margin-top:4px;color:#334}
/* ---- Khối 10 · Hình chiếu vuông góc ---- */
.hc3d{display:block;width:100%;height:380px;border-radius:14px;background:radial-gradient(circle at 50% 35%,#ffffff 0%,#eef3fb 60%,#dfe8f5 100%);border:1px solid var(--line);touch-action:none;cursor:grab;margin-top:10px}
.hc3d:active{cursor:grabbing}
.hc3d:fullscreen{height:100vh;border-radius:0}
.hcsteps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.hcsteps button{border:2px solid var(--line);background:var(--card);border-radius:10px;padding:8px 6px;font-weight:700;font-size:13px;cursor:pointer;color:var(--muted);line-height:1.25}
.hcsteps button.on{border-color:#e89a2c;background:#fff4e2;color:#9a5b00}
.hclayout{display:grid;grid-template-columns:repeat(2,auto);gap:10px;justify-content:center;align-items:end;margin-top:10px}
.hclayout>div:nth-child(odd){justify-self:end}.hclayout>div:nth-child(even){justify-self:start}
.hclayout.m1>div:nth-child(1),.hclayout.m1>div:nth-child(2){align-self:end}.hclayout.m1>div:nth-child(3){align-self:start}
.hclayout.m3>div:nth-child(2){align-self:end}.hclayout.m3>div:nth-child(3),.hclayout.m3>div:nth-child(4){align-self:start}
.hccell{position:relative;background:#fff;border:2px solid #cbd5e1;border-radius:12px;padding:20px 6px 6px}
.hccell.hc-front{border-color:#e53935}.hccell.hc-top{border-color:#1e63d6}.hccell.hc-side{border-color:#c026d3}
.hctag{position:absolute;top:-11px;left:50%;transform:translateX(-50%);white-space:nowrap;color:#fff;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:999px}
.hctag.hc-front{background:#e53935}.hctag.hc-top{background:#1e63d6}.hctag.hc-side{background:#c026d3}
.hccell svg{display:block;max-width:100%;height:auto}
.hccompare{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.hcpractice{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;margin-top:10px}
@media (max-width:720px){.hccompare,.hcpractice{grid-template-columns:1fr}.hcsteps{grid-template-columns:repeat(2,minmax(0,1fr))}.hc3d{height:320px}}
.k10nav{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}
.k10nav a{font-size:13px;font-weight:700;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--muted);text-decoration:none}
.k10nav a.on{background:#fff4e2;border-color:#e89a2c;color:#9a5b00}
.hcfigs{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:12px}
.hcfig{margin:0;display:flex;flex-direction:column;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px;max-width:100%}
.hcfig figcaption{font-size:13px;color:#334155;text-align:center}
.hcopts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:12px}
.hcopts.td{grid-template-columns:repeat(3,minmax(0,1fr))}
.hcopts.txt{grid-template-columns:1fr 1fr}
.hcopt{position:relative;border:2px solid var(--line);border-radius:12px;background:#fff;padding:22px 6px 6px;cursor:pointer;display:flex;align-items:center;justify-content:center;min-height:60px;font-size:15px;color:#0f172a;text-align:left}
.hcopt svg{max-width:100%;height:auto}
.hcopt:hover:not([disabled]){border-color:var(--brand2)}
.hcopt.ok{border:3px solid var(--ok);background:var(--ok-soft)}.hcopt.bad{border:3px solid var(--bad);background:var(--bad-soft)}
.hcoptl{position:absolute;top:4px;left:8px;font-weight:800;color:var(--muted);font-size:13px}
@media (max-width:720px){.hcopts{grid-template-columns:1fr 1fr}.hcopts.td{grid-template-columns:1fr}.hcopts.txt{grid-template-columns:1fr}}
/* ---- Trang chủ GV ---- */
.gvbig{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gvbig a{display:flex;flex-direction:column;gap:4px;border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:16px;text-decoration:none;color:var(--text)}
.gvbig a:hover{border-color:var(--brand2)}
.gvbig a .ic{font-size:30px;line-height:1}
.gvbig a b{font-size:19px}
.gvbig a span:not(.ic){color:var(--muted);font-size:13.5px}
.gvbig a.big{background:linear-gradient(135deg,#e8f1ff,#fff);border-color:#bcd3f5}
.gvbig a.big.green{background:linear-gradient(135deg,#e5f6ee,#fff);border-color:#b6e2cb}
.gvbig a.sm{flex-direction:row;align-items:center;gap:10px;padding:12px 16px}
.gvbig a.sm .ic{font-size:22px}.gvbig a.sm b{font-size:15.5px}
.appgrp h3{margin:14px 0 8px;font-size:15px;color:var(--muted)}
.apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.app{position:relative;display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:12px 12px;text-decoration:none;color:var(--text)}
.app:hover{border-color:var(--brand2)}
.app .ic{flex:none;width:44px;height:44px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:22px;background:var(--info-soft)}
.app .ic.green{background:var(--ok-soft)}.app .ic.amber{background:#fff4e2}.app .ic.red{background:var(--bad-soft)}
.app .tx{display:flex;flex-direction:column;min-width:0;padding-right:38px}
.app .tx b{font-size:14.5px}.app .tx span{font-size:12.5px;color:var(--muted)}
.who{display:inline-block;font-size:10.5px;font-weight:800;padding:2px 6px;border-radius:6px;background:#ede9fe;color:#6d28d9;white-space:nowrap}
.app .who{position:absolute;top:8px;right:8px}
.who.gv{background:#dbeafe;color:#1d4ed8}.who.hs{background:#dcfce7;color:#15803d}
@media (max-width:520px){.gvbig a.big b{font-size:17px}}
.applist a .who{margin-left:6px;flex:none}
.applist a .ic.red{background:var(--bad-soft)}
.pcdefs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.pcdefs>div{background:var(--bg,#f8fafc);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:14px;line-height:1.5}
@media (max-width:720px){.pcdefs{grid-template-columns:1fr}}
/* gọn cho thư mục Khối 10 */
.k10nav{display:flex;flex-wrap:nowrap;gap:6px;margin:0 0 8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.k10nav::-webkit-scrollbar{display:none}
.k10nav a{flex:none;font-size:13px;font-weight:600;padding:5px 11px;white-space:nowrap}
.k10nav a b{font-weight:800}
.k10nav a.k10back{font-size:16px;padding:3px 11px;color:var(--brand2)}
.gcpick.compact{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 8px}
.gcpick.compact button{padding:5px 11px;font-size:13px;border-radius:999px}
.gcpick.compact .pill{align-self:center;margin-left:auto}
.gvhello{display:flex;flex-direction:column;gap:2px;margin:2px 2px 12px}
.gvhello b{font-size:19px}.gvhello span{color:var(--muted);font-size:13.5px}
.gvsec{border:1px solid var(--line);background:var(--card);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.gvsech{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;padding:14px 16px;cursor:pointer;text-align:left;color:var(--text)}
.gvsech .ic{flex:none;width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;background:var(--info-soft)}

<main id="view" class="view"><div class="loading">Đang tải…</div></main>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
/* Bài 9. Hình chiếu vuông góc (Công nghệ 10) – tách nguyên vẹn từ SmarttechCN 2026 (app.js) */
(() => {
'use strict';
const V = document.getElementById('view');

/* ================= Lưu trữ an toàn ================= */
const store = {
  get(k, d) { try { const v = localStorage.getItem('stc_' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('stc_' + k, JSON.stringify(v)); return true; } catch (e) { return false; } },
  del(k) { try { localStorage.removeItem('stc_' + k); } catch (e) {} }
};
let session = store.get('session', null);
const uid = () => (session && session.user && (session.user.MaHS || session.user.MaGV)) || 'demo';
/** lưu kết quả bài vừa làm + giữ lại 20 bài gần nhất trên máy để em xem lại bất cứ lúc nào */

function isGV() { return Boolean(session && (session.role === 'gv' || session.role === 'admin')); }

/* ================= Tiện ích ================= */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function rnd(n) { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; }
function shuffle(arr) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function math(el) {
  if (window.renderMathInElement) {
    try { window.renderMathInElement(el, { delimiters: [{ left: '\\(', right: '\\)', display: false }, { left: '\\[', right: '\\]', display: true }], throwOnError: false, strict: false }); } catch (e) {}
  } else if (!math._wait) { math._wait = 1; window.addEventListener('load', () => { math._wait = 0; math(V); }, { once: true }); }
}

let cleanup = null;
const routes = [];
const route = (re, fn) => routes.push([re, fn]);

function setView(html) {
  V.innerHTML = html; math(V);
  // thư mục Khối 10: đưa danh sách hình sang cột trái cho gọn
  const pk = V.querySelector('.gcpick.compact');
  if (pk) {
    const wrap = document.createElement('div'), side = document.createElement('aside'), main = document.createElement('div');
    wrap.className = 'k10wrap'; side.className = 'k10side'; main.className = 'k10main';
    pk.parentNode.insertBefore(wrap, pk);
    while (wrap.nextSibling) main.appendChild(wrap.nextSibling);
    side.appendChild(pk); wrap.append(side, main);
  }
  // nút phóng to / thu nhỏ cho các mô hình 3D (gửi sự kiện cuộn chuột cho khung vẽ)
  V.querySelectorAll('canvas.hc3d, canvas#cv').forEach(cv => {
    if (cv.id === 'td' || cv.id === 'pc' || cv.id === 'road' || cv.closest('.hczw')) return;
    const w = document.createElement('div'); w.className = 'hczw'; cv.parentNode.insertBefore(w, cv); w.appendChild(cv);
    const bar = document.createElement('div'); bar.className = 'hczb';
    bar.innerHTML = '<button type="button" data-z="-1" title="Phóng to">＋</button><button type="button" data-z="1" title="Thu nhỏ">－</button>';
    bar.querySelectorAll('button').forEach(b => b.onclick = e => { e.preventDefault(); for (let k = 0; k < 2; k++) cv.dispatchEvent(new WheelEvent('wheel', { deltaY: +b.dataset.z * 100, bubbles: true, cancelable: true })); });
    w.appendChild(bar);
  });
}

const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement || null;

/* ================= KHỐI 10 – HÌNH CHIẾU VUÔNG GÓC: xây dựng PPCG thứ nhất & thứ ba bằng mô hình 3D =================
 * Vật thể dựng từ khối hộp / khối đùn (có lỗ tròn, mặt cong). Ba hình chiếu vẽ theo đúng quy ước (nét thấy, nét khuất, đường tâm).
 * Góc thứ nhất: MP đứng sau vật, MP bằng dưới, MP cạnh bên phải → lật: HCB xuống dưới, HCC sang phải.
 * Góc thứ ba: MP đứng trước vật, MP bằng trên, MP cạnh bên trái → lật: HCB lên trên, HCC sang trái. */
const HC = (() => {
  const area = L => { let a = 0; L.forEach((p, i) => { const q = L[(i + 1) % L.length]; a += p[0] * q[1] - q[0] * p[1]; }); return a / 2; };
  const circ = (cx, cy, r, n = 28) => Array.from({ length: n }, (_, i) => { const t = i / n * Math.PI * 2; return [cx + r * Math.cos(t), cy + r * Math.sin(t), 1]; });
  const arcPts = (cx, cy, r, a0, a1, n) => Array.from({ length: n + 1 }, (_, i) => { const t = (a0 + (a1 - a0) * i / n) * Math.PI / 180; return [cx + r * Math.cos(t), cy + r * Math.sin(t), 1]; });
  const AX = { x: [1, 0, 0], y: [0, 1, 0], z: [0, 0, 1] };
  const to3 = (ax, p, q, c) => ax === 'z' ? [p, q, c] : ax === 'x' ? [c, p, q] : [q, c, p];
  const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]], cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  const norm = a => { const l = Math.hypot(...a) || 1; return a.map(v => v / l); };
  const orient = (L, ccw) => { if ((area(L) > 0) === ccw) return L; const n = L.length; return L.map((_, j) => { const v = L[n - 1 - j]; return [v[0], v[1], L[(n - 2 - j + n) % n][2] || 0]; }); };
  /** đùn đa giác (p,q) dọc trục ax từ c0 đến c1; mỗi điểm [p,q,s], s=1: cạnh tới điểm sau thuộc mặt cong */
  function extrude(ax, outer, holes, c0, c1, keep = 'tbsh') {
    const O = orient(outer.map(v => [v[0], v[1], v[2] || 0]), true), H = (holes || []).map(h => orient(h.map(v => [v[0], v[1], v[2] || 0]), false));
    const A = AX[ax], F = [];
    F.push({ pts: O.map(v => to3(ax, v[0], v[1], c1)), holes: H.map(h => h.map(v => to3(ax, v[0], v[1], c1))), n: A, t: 't' });
    F.push({ pts: O.map(v => to3(ax, v[0], v[1], c0)).reverse(), holes: H.map(h => h.map(v => to3(ax, v[0], v[1], c0)).reverse()), n: A.map(x => -x), t: 'b' });
    [O, ...H].forEach((L, li) => L.forEach((a, i) => {
      const b = L[(i + 1) % L.length], a0 = to3(ax, a[0], a[1], c0), b0 = to3(ax, b[0], b[1], c0);
      F.push({ pts: [a0, b0, to3(ax, b[0], b[1], c1), to3(ax, a[0], a[1], c1)], holes: [], n: norm(cross(sub(b0, a0), A)), smooth: !!a[2], t: li ? 'h' : 's' });
    }));
    return F.filter(f => keep.indexOf(f.t) >= 0 && (f.t === 't' || f.t === 'b' || c1 !== c0));
  }
  const xz = L => L.map(v => [v[1], v[0], v[2] || 0]);       // đùn theo y: đổi (x,z) → (z,x)
  const box = (x0, x1, y0, y1, z0, z1) => extrude('z', [[x0, y0], [x1, y0], [x1, y1], [x0, y1]], [], z0, z1);
  /** chuẩn bị cạnh: bỏ đường ghép giữa các mặt đồng phẳng liền nhau */
  function prep(faces) {
    const fx = v => (Math.abs(v) < 5e-4 ? 0 : v).toFixed(3);
    const key = (f, s = 1) => { const d = f.n[0] * f.pts[0][0] + f.n[1] * f.pts[0][1] + f.n[2] * f.pts[0][2]; return f.n.map(v => fx(v * s)).join(',') + '|' + fx(d * s); };
    faces.forEach(f => { f.k = key(f); f.ko = key(f, -1); f.loops = [f.pts, ...f.holes]; });
    /** điểm m nằm trong mặt g (cùng mặt phẳng) */

/* ================= KHỐI 10 – BỘ VẼ 3D CHUNG (z-buffer) ================= */
/** vẽ các mặt bằng bộ đệm độ sâu rồi vẽ cạnh thấy và đường bao mặt cong.
 * P: điểm 3D → [x, y, độ sâu] (pixel); V: hướng nhìn (đơn vị); o: {alpha, k (pixel/đơn vị), color:[r,g,b]} */
function hcPaint(ctx, w, h, faces, P, V, dp, o = {}) {
  let B = hcPaint.buf;
  if (!B || B.w !== w || B.h !== h) B = hcPaint.buf = { w, h, img: ctx.createImageData(w, h), dep: new Float32Array(w * h), ids: new Int32Array(w * h), cv: Object.assign(document.createElement('canvas'), { width: w, height: h }) };
  const { img, dep, ids } = B, px = img.data; dep.fill(Infinity); px.fill(0); ids.fill(0);
  const Lt = [0.35, -0.6, 0.72], ln = Math.hypot(...Lt), base = o.color || [1, 0.85, 0.52];
  const hs = Math.max(6, Math.round(7 * dp)), hw = Math.max(1, Math.round(1.3 * dp));
  const front = o.front || (f => f.n[0] * V[0] + f.n[1] * V[1] + f.n[2] * V[2] < -1e-3);
  const vis = [];
  faces.forEach((f, fi) => {
    if (!front(f)) return;
    const loops = f.loops.map(L => L.map(P)), Q = loops[0];
    let best = 0, i1 = 1, i2 = 2;
    for (let i = 1; i < Q.length; i++) for (let j = i + 1; j < Q.length; j++) { const ar = Math.abs((Q[i][0] - Q[0][0]) * (Q[j][1] - Q[0][1]) - (Q[j][0] - Q[0][0]) * (Q[i][1] - Q[0][1])); if (ar > best) { best = ar; i1 = i; i2 = j; } }
    if (best < 1e-6) return;
    const A = Q[0], Bq = Q[i1], C = Q[i2], bx = Bq[0] - A[0], by = Bq[1] - A[1], cx = C[0] - A[0], cy = C[1] - A[1], det = bx * cy - cx * by;
    const ga = ((Bq[2] - A[2]) * cy - (C[2] - A[2]) * by) / det, gb = (bx * (C[2] - A[2]) - cx * (Bq[2] - A[2])) / det;
    const dAt = (x, y) => A[2] + ga * (x - A[0]) + gb * (y - A[1]);
    const lam = Math.max(0, (f.n[0] * Lt[0] + f.n[1] * Lt[1] + f.n[2] * Lt[2]) / ln), cc = 178 + 70 * lam;
    const R = o.draft ? 255 : f.cut ? 252 : cc * base[0], G = o.draft ? 255 : f.cut ? 214 : cc * base[1], Bc = o.draft ? 255 : f.cut ? 200 : cc * base[2], HC0 = o.draft ? 30 : 150, HC1 = o.draft ? 41 : 36, HC2 = o.draft ? 59 : 36;
    let y0 = Infinity, y1 = -Infinity; Q.forEach(q => { y0 = Math.min(y0, q[1]); y1 = Math.max(y1, q[1]); });
    y0 = Math.max(0, Math.floor(y0)); y1 = Math.min(h - 1, Math.ceil(y1));
    for (let y = y0; y <= y1; y++) {
      const yc = y + 0.5, xs = [];
      loops.forEach(Lp => { for (let q = 0; q < Lp.length; q++) { const a = Lp[q], b = Lp[(q + 1) % Lp.length]; if ((a[1] <= yc) !== (b[1] <= yc)) xs.push(a[0] + (yc - a[1]) / (b[1] - a[1]) * (b[0] - a[0])); } });
      xs.sort((u, v) => u - v);
      for (let s = 0; s + 1 < xs.length; s += 2) {
        const xa = Math.max(0, Math.round(xs[s])), xb = Math.min(w, Math.round(xs[s + 1]));
        if (xb <= xa) continue;
        let d = dAt(xa + 0.5, yc);
        for (let x = xa; x < xb; x++, d += ga) {
          const id = y * w + x;
          if (d < dep[id]) { dep[id] = d; ids[id] = fi + 1; const p4 = id * 4; if (f.cut && (x + y) % hs < hw) { px[p4] = HC0; px[p4 + 1] = HC1; px[p4 + 2] = HC2; } else { px[p4] = R; px[p4 + 1] = G; px[p4 + 2] = Bc; } px[p4 + 3] = 255; }
        }
      }
    }
    vis.push(f);
  });
  B.cv.getContext('2d').putImageData(img, 0, 0);
  const al = o.alpha == null ? 1 : o.alpha;
  ctx.globalAlpha = al; ctx.drawImage(B.cv, 0, 0); ctx.globalAlpha = 1;
  const bias = o.bias != null ? o.bias : Math.max(0.15, 5 * dp / (o.k || 40));
  let own1 = 0, own2 = 0;
  const seen = (sx, sy, d) => { const x = sx | 0, y = sy | 0; let mn = Infinity; for (let yy = y - 1; yy <= y + 1; yy++) for (let xx = x - 1; xx <= x + 1; xx++) if (xx >= 0 && yy >= 0 && xx < w && yy < h) { const id = yy * w + xx, fid = ids[id]; if (fid && (fid === own1 || fid === own2)) return true; mn = Math.min(mn, dep[id]); } return d <= mn + bias; };
  ctx.globalAlpha = al; ctx.strokeStyle = o.edge || '#3b2a0c'; ctx.lineWidth = (o.lw || 2.3) * dp; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.beginPath();
  const HID = [];
  const seg = (a, b, onlyHid) => {
    const A = P(a), Bp = P(b), n = Math.max(2, Math.ceil(Math.hypot(Bp[0] - A[0], Bp[1] - A[1]) / (2 * dp)));
    let on = false, hs0 = null, last = null;
    for (let s = 0; s <= n; s++) {
      const t = s / n, x = A[0] + (Bp[0] - A[0]) * t, y = A[1] + (Bp[1] - A[1]) * t, v = seen(x, y, A[2] + (Bp[2] - A[2]) * t);

      if (o.hidden) { if (!v) { if (!hs0) hs0 = [x, y]; last = [x, y]; } else if (hs0) { HID.push([hs0, last]); hs0 = null; } }
    }
    if (hs0) HID.push([hs0, last]);

  const idx = new Map(faces.map((f, i) => [f, i + 1]));
  vis.forEach(f => { own1 = idx.get(f); own2 = 0; f.edges.forEach(([a, b]) => seg(a, b)); });
  if (!o.front) { own1 = own2 = 0; faces.forEach(f => { if (Math.abs(f.n[0] * V[0] + f.n[1] * V[1] + f.n[2] * V[2]) <= 1e-3) f.edges.forEach(([a, b]) => seg(a, b)); }); }
  faces.forEach(f => f.sil && f.sil.forEach(s => { if (front(f) !== front(s.g)) { own1 = idx.get(f); own2 = idx.get(s.g) || 0; seg(s.a, s.b); } }));
  if (o.hidden) { own1 = own2 = 0; faces.forEach(f => { if (!vis.includes(f)) f.edges.forEach(([a, b]) => seg(a, b, true)); }); }

  if (HID.length) {
    ctx.lineWidth = 1.3 * dp; ctx.setLineDash([5 * dp, 3.5 * dp]); ctx.beginPath();
    HID.forEach(([p, q]) => { if (Math.hypot(q[0] - p[0], q[1] - p[1]) > 3 * dp) { ctx.moveTo(p[0], p[1]); ctx.lineTo(q[0], q[1]); } });
    ctx.stroke(); ctx.setLineDash([]);
  }
  ctx.globalAlpha = 1;
  return vis;
}

const HCQ = (() => {
  const flipIt = (it, W, H, fu, fv) => it.map(x => {
    const U = u => fu ? W - u : u, Vv = v => fv ? H - v : v;
    if (x.p) return { ...x, p: x.p.map(q => [U(q[0]), Vv(q[1])]) };
    if (x.c) return { ...x, c: [U(x.c[0]), Vv(x.c[1]), x.c[2]] };
    if (x.a) { let [cx, cy, r, a0, a1] = x.a; if (fu) [a0, a1] = [180 - a1, 180 - a0]; if (fv) [a0, a1] = [-a1, -a0]; return { ...x, a: [U(cx), Vv(cy), r, a0, a1] }; }
    return x;
  });
  const vsig = v => JSON.stringify(v.it.map(x => x.k + JSON.stringify(x.p ? x.p.map(q => q.map(n => n.toFixed(2))).sort() : x.c || x.a || '')).sort());
  const variants = (T, k) => {
    const v = T.views[k], C = [];
    const add = (it, why) => C.push({ v: { W: v.W, H: v.H, it }, why });
    add(flipIt(v.it, v.W, v.H, true, false), 'Hình này bị lật trái – phải.');
    add(flipIt(v.it, v.W, v.H, false, true), 'Hình này bị lật ngược trên – dưới.');
    if (v.it.some(x => x.k === 'h')) { add(v.it.map(x => x.k === 'h' ? { ...x, k: 'v' } : x), 'Cạnh bị che khuất phải vẽ bằng nét đứt, không vẽ nét liền.'); add(v.it.filter(x => x.k !== 'h'), 'Hình này thiếu các cạnh khuất (nét đứt).'); }
    Object.keys(T.views).filter(n => !['front', 'top', 'side', k].includes(n)).forEach(n => C.push({ v: T.views[n], why: T.views[n].why || 'Đây không phải hình chiếu cần tìm.' }));
    ['front', 'top', 'side'].filter(n => n !== k).forEach(n => C.push({ v: T.views[n], why: n === 'front' ? 'Đây là hình chiếu đứng (nhìn từ trước).' : n === 'top' ? 'Đây là hình chiếu bằng (nhìn từ trên).' : 'Đây là hình chiếu cạnh (nhìn từ trái).' }));
    const seen = new Set([vsig(v)]), out = [];
    shuffle(C.slice(0, 4)).concat(C.slice(4)).forEach(c => { const s = vsig(c.v); if (out.length < 3 && !seen.has(s)) { seen.add(s); out.push(c); } });
    return out;
  };
  const VN = { front: 'hình chiếu đứng', top: 'hình chiếu bằng', side: 'hình chiếu cạnh' }, VDIR = { front: 'nhìn từ trước', top: 'nhìn từ trên xuống', side: 'nhìn từ trái sang' };
  const NEED = m => m === 1 ? { mid: 'front', below: 'top', right: 'side' } : { mid: 'front', above: 'top', left: 'side' };
  return { variants, VN, VDIR, NEED };
})();
